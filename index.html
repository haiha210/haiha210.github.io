<script>
// Khôi phục đường dẫn do 404.html (GitHub Pages SPA fallback) lưu lại
(function(){
  var r = sessionStorage.getItem("spa.redirect");
  if (r) { sessionStorage.removeItem("spa.redirect"); history.replaceState(null, "", r); }
})();
// Chống FOUC: đặt theme trước khi app mount (đọc key cũ để giữ lựa chọn đã lưu)
(function(){
  var t = localStorage.getItem("certs.theme.v1")
       || localStorage.getItem("ai200.theme.v1")
       || localStorage.getItem("dp300.theme.v1");
  try { t = JSON.parse(t); } catch(e){}
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
})();
</script>
