 o:["Yes — different servers, subscriptions and regions are allowed, as long as they are in the same Azure cloud","No — all targets must be on the same logical server","No — all targets must be in the same subscription","Yes — including targets in Azure Government from a commercial job agent"],a:0,
 e:"Target có thể ở server, subscription hay region khác nhau nhưng phải **cùng một Azure cloud** (không nối commercial với Government hay China)."},
{id:429,d:4,t:"Multi-server",q:"You configure multi-server administration between SQL Server instances on Azure VMs. How many master servers can one target server report to?",
 o:["Exactly one","Up to two, for redundancy","Any number","Up to five"],a:0,
 e:"Một target server (TSX) chỉ liên kết được với **một** master server (MSX). Multi-server administration là tính năng của SQL Server Agent trên SQL Server (on-prem hoặc VM); Azure SQL Database không có SQL Agent nên không tham gia được."},
{id:430,d:4,t:"Multi-server",q:"Where in SSMS do you promote an instance to be a master server for multi-server administration?",
 o:["Right-click SQL Server Agent – Multi Server Administration – Make this a Master","Right-click the server – Properties – Multi Server","Management – Policy Management – Register as Master","Azure portal – SQL virtual machines – Automation"],a:0,
 e:"Right-click SQL Server Agent – Multi Server Administration – 'Make this a Master' (và 'Make this a Target' trên các instance còn lại)."},
{id:431,d:4,t:"VM backup",q:"You must enable Automated Backup v2 for SQL Server on an Azure VM. Which two requirements apply?",
 o:["Windows Server 2012 R2 or higher with SQL Server 2016 or higher, in the Standard, Enterprise or Developer edition","Every database included must use the Full recovery model","Windows Server 2012 with SQL Server 2014, Standard or Enterprise edition","SQL Server Express is supported as long as the VM is registered in full manageability mode","Databases must use the Simple recovery model so no log backups are needed"],a:[0,1],
 e:"Version 1: Windows Server 2012 + SQL Server 2014 (Standard/Enterprise). Version 2: Windows Server 2012 R2+ và SQL Server 2016+ (Standard/Enterprise/Developer). Database phải dùng Full recovery model."},
{id:432,d:4,t:"VM backup",q:"Compliance requires 90 days of backups for a database on a SQL Server VM. Can Automated Backup satisfy this?",
 o:["No — its maximum retention is 30 days, so you need Azure Backup for SQL or your own strategy","Yes — retention can be set up to 10 years","Yes — retention is 35 days by default and can be extended to 90","No — its maximum retention is 7 days"],a:0,
 e:"Automated Backup trên VM giữ tối đa **30 ngày**. Cần lâu hơn thì dùng Azure Backup for SQL Server in Azure VM (LTR tới 10 năm) hoặc tự viết backup ra URL."},
{id:433,d:4,t:"VM backup",q:"A SQL Server VM hosts three named instances and no default instance. What happens when you enable Automated Backup?",
 o:["The operation fails, because it supports the default instance or exactly one named instance","All three instances are backed up","Only the first named instance is backed up","A default instance is created automatically"],a:0,
 e:"Automated Backup hỗ trợ default instance hoặc **một** named instance. Nhiều named instance mà không có default instance thì thao tác thất bại."},
{id:434,d:4,t:"Policies",q:"You must prevent developers from creating tables without a clustered index on a SQL Server VM. Which Policy-Based Management evaluation mode enforces this?",
 o:["On change: prevent — it uses DDL triggers to roll back non-compliant changes","On change: log only — enforcement is not possible","On schedule, with a SQL Agent job that reverts the change","On demand, run by an administrator"],a:0,
 e:"'On change: prevent' dùng DDL trigger để chặn thay đổi vi phạm. 'On change: log only' chỉ ghi lại. Policy-Based Management **không** áp dụng cho Azure SQL Database hay MI."},
{id:435,d:4,t:"Policies",q:"When you write a Policy-Based Management condition, what does the expression represent?",
 o:["The state that should exist — the policy reports a violation when the condition evaluates to false","The violation to detect — the policy fails when the condition is true","A default value applied to non-compliant objects","An alert threshold for the SQL Agent"],a:0,
 e:"Condition mô tả trạng thái **nên có**; policy fail khi điều kiện không đúng. Lưu ý trong facet expression, `!=` được viết là `<>` ở một số facet."},
{id:436,d:4,t:"Alerts",q:"You must raise an alert whenever a severity 17 or higher error is written to the SQL Server error log. Which SQL Server Agent alert type should you use?",
 o:["SQL Server event alert","SQL Server performance condition alert","WMI event alert","Azure metric alert"],a:0,
 e:"'SQL Server event' dựa trên error number hoặc severity (và có thể lọc theo database/text). 'SQL Server performance condition' dùng Object/Counter/Instance kèm ngưỡng; 'WMI event' dùng truy vấn WQL."},
{id:437,d:4,t:"Alerts",n:"s77",q:"A SQL Agent alert is configured with a delay between responses of 0 minutes and 0 seconds. What is the effect?",
 o:["Every occurrence of the alert triggers a response","No response is ever sent","Only the first occurrence triggers a response","A response is sent at most once per minute"],a:0,
 e:"Delay = 0 phút 0 giây nghĩa là **mỗi lần** alert xảy ra đều gửi response. Đặt delay lớn hơn để tránh bão email khi lỗi lặp liên tục."},
{id:438,d:4,t:"Alerts",q:"Your CPU alert on an Azure SQL database fires every morning during a known batch window, but you still want to catch genuine anomalies. What should you configure?",
 o:["A dynamic threshold, which models the metric's history and accounts for hourly, daily and weekly seasonality","A static threshold set above the batch peak","A log alert with a 1-day aggregation granularity","An action group with a suppression rule"],a:0,
 e:"Dynamic threshold học lịch sử metric và nhận biết seasonality, nên chấp nhận pattern buổi sáng nhưng vẫn báo bất thường. Sensitivity: High (nhiều alert), Medium (mặc định), Low (ít alert)."},
{id:439,d:4,t:"Alerts",q:"What severity values can an Azure alert rule use?",
 o:["0 (Critical) to 4 (Verbose)","1 (Low) to 5 (High)","0 (Info) to 3 (Critical)","1 to 10, where 10 is most severe"],a:0,
 e:"Severity 0 = Critical, 1 = Error, 2 = Warning, 3 = Informational, 4 = Verbose. Nhiều alert rule có thể dùng chung một action group."},
{id:440,d:4,t:"Alerts",q:"An action group must notify on-call staff and also trigger remediation. Which items can it contain?",
 o:["Notifications by email, SMS, Azure app push and voice, plus actions such as Automation runbook, Azure Function, ITSM, Logic App and webhook","Email notifications only","Webhooks only","Email and SMS notifications, with no automated actions"],a:0,
 e:"Action group gồm phần Notifications (email, SMS, push, voice) và phần Actions (Automation runbook, Azure Function, ITSM, Logic App, webhook, event hub)."},
{id:441,d:4,t:"Alerts",q:"Which deployment option supports SQL Server Agent event notifications?",
 o:["SQL Server on an Azure VM only — a managed instance has SQL Agent but does not allow event notifications","Azure SQL Database and managed instance","Azure SQL Database only","All three deployment options"],a:0,
 e:"Event notification (Service Broker) chỉ dùng được trên SQL Server VM/on-prem. Azure SQL Database không có SQL Agent; MI có SQL Agent nhưng không cho phép event notification."},
{id:442,d:4,t:"Alerts",q:"In an Azure log alert rule, which values can the aggregation granularity take?",
 o:["5, 10, 15, 30 or 45 minutes, 1–6 hours, or 1–2 days","1, 5 or 15 minutes only","Any value between 1 minute and 1 year","Hourly values only"],a:0,
 e:"Aggregation granularity và frequency of evaluation nhận 5/10/15/30/45 phút, 1–6 giờ, hoặc 1–2 ngày. Aggregation type có thể là Average, Total, Maximum hoặc Minimum."},
{id:443,d:4,t:"Alerts",q:"Which two statements correctly distinguish 'aggregation granularity' from 'frequency of evaluation' in an alert rule?",
 o:["Aggregation granularity is the time window over which measurements are grouped together","Frequency of evaluation is how often the rule is run against that window","They are two names for the same setting","Aggregation granularity is the number of violations required before the alert fires","Frequency of evaluation only applies to dynamic thresholds"],a:[0,1],
 e:"Granularity = cửa sổ gộp dữ liệu (ví dụ trung bình 15 phút). Frequency = bao lâu đánh giá một lần (ví dụ mỗi 5 phút). Đặt frequency nhỏ hơn granularity sẽ cho sliding window."},
{id:444,d:4,t:"Config changes",q:"You must find out who changed a server configuration option with `sp_configure` last week on a SQL Server VM. What must have been enabled, and where do you look?",
 o:["The default trace (`sp_configure 'default trace enabled', 1`), then Reports – Standard Reports – Configuration Changes History","Change data capture on the master database, then query the CDC tables","Query Store on master, then the Regressed Queries report","Extended Events `system_health`, then the ring buffer"],a:0,
 e:"Bật `show advanced options` rồi `default trace enabled`, mỗi lần kèm `RECONFIGURE`. Sau đó xem Reports – Standard Reports – **Configuration Changes History** (dữ liệu đến từ default trace, chỉ giữ lượng file hạn chế)."},
{id:445,d:4,t:"Logic Apps",q:"What does every Azure Logic Apps workflow start with?",
 o:["A trigger, followed by one or more actions","An action, followed by a trigger","A connection to a data source","A recurrence schedule, which is mandatory"],a:0,
 e:"Workflow luôn mở đầu bằng **trigger** (recurrence theo lịch, item được tạo/sửa trong SQL Server, HTTP request…) rồi tới các action."},
{id:446,d:4,t:"Logic Apps",q:"A Logic App must read rows from an on-premises SQL Server and write them into Azure SQL Database, with no secrets stored in the workflow. Which two statements are correct?",
 o:["The on-premises SQL Server connection requires the on-premises data gateway; the Azure SQL Database connection does not","The Azure SQL Database connection can authenticate with the Logic App's managed identity","Both connections require the on-premises data gateway","Neither connection needs a gateway once a site-to-site VPN exists","The gateway is required for the Azure SQL Database connection but not for the on-premises one"],a:[0,1],
 e:"Gateway chỉ cần cho SQL Server on-prem. Kiểu authentication khả dụng: service principal, Logic Apps managed identity, Entra ID integrated, và SQL/Windows authentication."},
{id:447,d:4,t:"Logic Apps",q:"A Logic App will run about 60,000 actions per month. How is the Consumption plan charged?",
 o:["Roughly $1 per 40,000 actions, with the first 4,000 actions free","A flat rate of about $180 per month","Free for any number of actions","By the volume of data processed, not by action count"],a:0,
 e:"Consumption: ~$1 cho 40.000 action (4.000 action đầu miễn phí) và ~$1.25 cho 10.000 standard connector execution mỗi ngày. Standard plan là khoảng $180/tháng, cố định."},
{id:448,d:4,t:"Logic Apps",q:"Which SQL Server actions are available in Logic Apps?",
 o:["Get/Insert/Update/Delete row, Get rows and tables, Execute an SQL query, and Execute stored procedure","Insert and Update row only","Execute stored procedure only","Backup database and Restore database"],a:0,
 e:"Connector SQL Server có Get/Insert/Update/Delete row, Get rows/tables, Execute an SQL query và Execute stored procedure. Control action (Condition, Switch, For each, Until) thuộc phần Logic Apps."},
{id:449,d:4,t:"Logic Apps",q:"You must audit every API connection used by Logic Apps across the whole subscription. Where do you look?",
 o:["The API connections blade in the Azure portal, at subscription level","The API connections blade inside each Logic App","The Connections tab of the resource group","Azure Monitor – Connections"],a:0,
 e:"Trong Logic App chỉ thấy connection của chính nó. Vào **API connections** ở cấp portal/subscription để thấy toàn bộ (và tìm connection mồ côi)."},
{id:450,d:4,t:"VM automation",q:"You enable 'Automatic SQL Server VM registration' on a subscription. Which two statements describe what you get?",
 o:["The subscription is checked daily for unregistered SQL Server VMs, which are then registered automatically","The VMs are registered in lightweight management mode, so you must upgrade them manually to use Automated Backup and Patching","SQL Server is installed automatically on newly created Windows VMs","Every registered VM is patched automatically from that point on","Automated Backup is configured automatically for every registered VM"],a:[0,1],
 e:"Nó dò subscription mỗi ngày và đăng ký VM chưa registered ở **lightweight mode** (không cần restart). Muốn dùng Automated Backup/Patching thì phải nâng lên full manageability thủ công."},
{id:451,d:4,t:"Maintenance",q:"You are enabling data compression on a VM-hosted table through the SSMS wizard and want it to run outside business hours. Which schedule options are offered?",
 o:["One time, recurring daily/weekly/monthly, when SQL Server Agent starts, or when the CPUs become idle","One time only","Daily and weekly only","No scheduling is available; the script must be run manually"],a:0,
 e:"Wizard 'Manage Compression' có thể sinh script và tạo SQL Agent job với các schedule: one time, recurring (daily/weekly/monthly), khi SQL Agent starts, hoặc khi CPU rảnh."},
{id:452,d:4,t:"Automation",q:"An application connected to Azure SQL Database intermittently receives transient connection errors during platform maintenance. Which two statements are true?",
 o:["Retry logic with exponential backoff in the application is the correct mitigation, because you do not control when PaaS patching happens","A database quorum keeps at least one primary replica online during patching, and Business Critical or Premium also keeps a secondary replica online","You can open a support ticket to have the maintenance windows scheduled outside business hours","Moving the database into an elastic pool exempts it from platform maintenance","Automatic patching can be disabled at logical server level"],a:[0,1],
 e:"PaaS được patch tự động và bạn không chọn thời điểm; cách giảm tác động là retry logic. Nhờ database quorum, luôn có ít nhất 1 primary replica online, còn Business Critical/Premium có thêm secondary replica online."},
{id:453,d:4,t:"Automation",q:"You must run a weekly PowerShell script that scales 30 Azure SQL databases up before month-end processing and back down afterwards, with no VM to maintain. Which service is the most appropriate?",
 o:["An Azure Automation runbook on a schedule, using a managed identity","A SQL Server Agent job on a managed instance","An Elastic Job, because PowerShell steps are supported","A Logic App with the SQL Server connector"],a:0,
 e:"Azure Automation runbook chạy PowerShell theo lịch mà không cần hạ tầng, và xác thực bằng managed identity. Elastic Jobs chỉ chạy **T-SQL**; Logic Apps không chạy script PowerShell trực tiếp."},
/* ---------- 5. Plan and implement a high availability and disaster recovery environment (20–25%) ---------- */
{id:501,d:5,t:"SLA / RPO / RTO",q:"A business states that it can tolerate losing at most five seconds of committed data and being unavailable for at most one hour. Which Azure SQL Database capability matches those objectives?",
 o:["An auto-failover group — RPO 5 seconds, RTO 1 hour","Geo-restore from geo-replicated backups — RPO 1 hour, RTO 12 hours","Long-term retention restore — RPO 1 week, RTO 12 hours","Point-in-time restore — RPO 10 minutes, RTO 12 hours"],a:0,
 e:"Auto-failover group: RPO 5 giây, RTO 1 giờ. Geo-restore: RPO 1 giờ, RTO 12 giờ. Manual failover sang geo-replicated secondary: RPO 5 giây, RTO 30 giây."},
{id:502,d:5,t:"SLA / RPO / RTO",q:"A cost-sensitive department accepts losing up to an hour of data and being down for up to half a day. Which option should you recommend?",
 o:["Geo-restore from geo-replicated backups","An auto-failover group with automatic failover policy","Active geo-replication with four secondaries","A Business Critical database with zone redundancy"],a:0,
 e:"Geo-restore (RPO 1 giờ, RTO 12 giờ) đã có sẵn trong giá backup nên rẻ nhất. Auto-failover group và geo-replication tốn thêm tiền cho secondary — chỉ dùng khi SLA không cho phép 12 giờ downtime."},
{id:503,d:5,t:"SLA / RPO / RTO",q:"Which pair of definitions is correct?",
 o:["RPO is how much data you can afford to lose; RTO is the maximum acceptable time before the system is usable again","RPO is the recovery time and RTO is the data loss","Both measure the same downtime from different perspectives","RPO is the number of replicas and RTO is the number of regions"],a:0,
 e:"RPO (Recovery Point Objective) = lượng dữ liệu có thể mất. RTO (Recovery Time Objective) = thời gian tối đa để dùng lại được, tức thời gian failover cho phép."},
{id:504,d:5,t:"SLA",q:"What SLA does Microsoft offer for an Azure SQL Database in the Business Critical tier with zone-redundant deployment enabled?",
 o:["99.995%","99.99%","99.95%","99.9%"],a:0,
 e:"99.995% (~26 phút/năm) cho Business Critical/Premium có zone redundant deployment. Các tier khác của Azure SQL Database và MI là 99.99%."},
{id:505,d:5,t:"SLA",q:"What is the availability SLA for a Hyperscale database configured with one high-availability replica?",
 o:["99.95%","99.9%","99.99%","99.995%"],a:0,
 e:"Hyperscale: 99.9% khi không có replica, 99.95% với một replica. Cần cao hơn thì thêm replica hoặc dùng zone redundancy."},
{id:506,d:5,t:"SLA",q:"An outage exceeds the committed RTO of your auto-failover group. What compensation does the SLA provide?",
 o:["A credit of 100% of the monthly cost of the secondary","A credit of 50% of the monthly cost of the primary","A full refund of the subscription for that month","No credit; RTO is a target rather than a commitment"],a:0,
 e:"Vượt RTO đã cam kết thì khách hàng được credit **100% chi phí hàng tháng của secondary**."},
{id:507,d:5,t:"Hybrid HADR",q:"You will extend an on-premises availability group to a SQL Server instance on an Azure VM. Which three prerequisites apply?",
 o:["An Active Directory domain, so a domain controller must be reachable from Azure","A VPN or ExpressRoute connection for the whole failover cluster","A replica domain controller in the DR site for a DR scenario","Identical public IP addresses on both sides","A shared disk visible to both sites"],a:[0,1,2],
 e:"AG cần Windows failover cluster nên phải có AD domain (thường dựng thêm domain controller VM), có VPN/ExpressRoute cho multi-subnet cluster, và nếu dùng cho DR thì nên có replica domain controller ở site DR. Failover diễn ra ở cấp **database**, không phải instance."},
{id:508,d:5,t:"Hybrid HADR",q:"Network and identity teams will not extend the Active Directory domain to Azure and will not build a VPN. You still need a synchronised copy of one database on an Azure VM. Which technology can do this?",
 o:["Database mirroring using server certificates","An availability group with a cloud witness","A failover cluster instance with Azure shared disks","An auto-failover group"],a:0,
 e:"Database mirroring dùng server certificate nên **không cần VPN và không cần cùng AD domain** (Azure VM chạy SQL Server 2012+, on-prem 2008 R2+). Đây là lý do duy nhất còn dùng mirroring dù nó đã deprecated."},
{id:509,d:5,t:"Hybrid HADR",q:"Why does log shipping between on-premises and an Azure VM require a VPN tunnel?",
 o:["Because the copy job uses Windows file sharing (SMB) to fetch the log backups","Because it needs port 1433 open in both directions","Because both servers must be in the same Active Directory domain","Because ExpressRoute is mandatory for backup traffic"],a:0,
 e:"Log shipping copy file backup qua Windows file share nên cần SMB, tức phải có VPN tunnel. Chuỗi hoạt động: backup log ở primary → copy sang secondary → restore trên secondary."},
{id:510,d:5,t:"FCI",q:"A customer proposes a failover cluster instance across two Azure VMs as their disaster recovery solution. What must you point out?",
 o:["An FCI provides high availability within a region but is not a DR solution; it protects against instance, NIC and disk failures","An FCI provides DR but not HA","An FCI provides read scale-out but no failover","An FCI is not supported on Azure VMs"],a:0,
 e:"FCI cho HA (chống lỗi instance, NIC, disk) chứ không phải DR — mọi node dùng chung storage. Trên Azure có 5 kiểu shared storage: Azure shared disks, Storage Spaces Direct, Premium File Share, giải pháp bên thứ ba, và ExpressRoute tới storage on-prem."},
{id:511,d:5,t:"Site Recovery",q:"How should you describe Azure Site Recovery for a SQL Server workload?",
 o:["Simple DR for Azure VMs by continuous replication to a secondary region, with recovery point snapshots — it is not a SQL-specific solution but can be used with SQL on VMs","HA and DR for Azure SQL Database and managed instance","A backup product that replaces BACKUP DATABASE","An automatic failover mechanism for managed instances"],a:0,
 e:"ASR replicate VM sang region khác và tạo recovery point (bắt cả dữ liệu disk, dữ liệu trong memory và transaction đang xử lý) — hữu ích cả khi bị ransomware. Nó không nhận biết SQL Server nên dùng cho DR đơn giản, không phải HA."},
{id:512,d:5,t:"Geo-replication",q:"How many readable secondaries can a single Azure SQL Database primary have, and what should you do if you need more?",
 o:["Four — beyond that, create a secondary of a secondary, accepting extra replication lag","Two — beyond that, use an auto-failover group","Eight — the limit matches an availability group","Unlimited, subject to cost"],a:0,
 e:"Tối đa 4 secondary mỗi primary, có thể ở nhiều region. Cần hơn thì chain: tạo secondary từ một secondary — replication tới đó chậm hơn."},
{id:513,d:5,t:"Geo-replication",q:"You maintain a geo-replicated pair and must both upgrade it to more vCores now and downgrade it again after the peak season. Which two rules apply?",
 o:["When upgrading, scale the secondary first","When downgrading, scale the primary first","When upgrading, scale the primary first so the workload benefits immediately","Both databases must always be scaled within the same operation","The order never matters, because the replication link is rebuilt automatically"],a:[0,1],
 e:"Khi **upgrade** thì nâng secondary trước; khi **downgrade** thì hạ primary trước. Lý do: secondary phải có service tier tối thiểu bằng primary, nếu không nó không theo kịp log và có thể bị ngắt."},
{id:514,d:5,t:"Geo-replication",q:"In which situation must you drop the geo-replication link before changing the service tier?",
 o:["When moving between General Purpose and Business Critical","On every service tier change","When changing the number of vCores","Never — the link survives all changes"],a:0,
 e:"Chỉ khi chuyển giữa General Purpose và Business Critical (khác kiến trúc storage) thì phải ngắt secondary rồi tạo lại. Đổi số vCore trong cùng tier thì không cần."},
{id:515,d:5,t:"Geo-replication",q:"Why do long-running reports on a readable secondary not delay transactions on the primary?",
 o:["Readable secondaries use snapshot isolation, so redo of primary changes is not blocked by readers","Readers are automatically disconnected when redo falls behind","The secondary replays the log only when idle","Reads are served from a separate copy taken every 5 minutes"],a:0,
 e:"Secondary dùng snapshot isolation mode nên reader không giữ shared lock — quá trình redo log từ primary không bị long-running query chặn."},
{id:516,d:5,t:"Geo-replication",q:"How does active geo-replication propagate changes, and how does that differ from transactional replication?",
 o:["Geo-replication streams the transaction log; transactional replication re-executes DML commands at the subscriber","Geo-replication re-executes DML commands; transactional replication streams the log","Both stream the transaction log, but geo-replication is synchronous","Both take periodic snapshots"],a:0,
 e:"Geo-replication stream **transaction log** nên toàn bộ database được sao chép nguyên trạng. Transactional replication thực thi lại các lệnh INSERT/UPDATE/DELETE nên cho phép chọn subset bảng và biến đổi dữ liệu."},
{id:517,d:5,t:"Failover group",n:"s91",q:"Which deployment options support auto-failover groups?",
 o:["Azure SQL Database and Azure SQL Managed Instance, but not SQL Server on VMs","Azure SQL Database only","Azure SQL Managed Instance only","All three, including SQL Server on Azure VMs"],a:0,
 e:"Auto-failover group dùng cho Azure SQL Database và MI. Trên VM thì tương đương là availability group (với listener và internal load balancer)."},
{id:518,d:5,t:"Failover group",n:"s91",q:"A regional incident begins. The failover group has an automatic read/write failover policy. When will Azure fail it over?",
 o:["Not before at least one hour has passed, since a short outage may be resolved sooner","Immediately, as soon as the primary is unreachable","After five minutes","Only after you approve it in the portal"],a:0,
 e:"Automatic failover không xảy ra trong **ít nhất 1 giờ** (tính từ khi outage được xác nhận), vì outage ngắn có thể tự khắc phục và failover luôn có rủi ro mất dữ liệu. Bản thân thao tác failover chỉ mất vài giây."},
{id:519,d:5,t:"Failover group",n:"s82-2",q:"You are creating a failover group with an automatic read/write failover policy. Which two statements about the timings are true?",
 o:["The read/write grace period can be set between 1 and 24 hours","Automatic failover is not triggered before at least one hour of confirmed outage has passed","The read/write grace period can be set between 1 and 60 minutes","Automatic failover is triggered as soon as the primary becomes unreachable","The grace period only applies to read-only failover"],a:[0,1],
 e:"Khi tạo failover group: tên duy nhất, secondary server, read/write failover policy (automatic hoặc manual) và **grace period 1–24 giờ** — thời gian chờ trước khi Azure tự failover."},
{id:520,d:5,t:"Failover group",q:"A failover group contains 12 databases and you fail over only because one of them is unhealthy. What happens?",
 o:["All 12 databases fail over together, because the group is the unit of failover","Only the unhealthy database fails over","Each database must be failed over separately","Only databases with a synchronised secondary fail over"],a:0,
 e:"Failover group là đơn vị failover: **toàn bộ** database trong group cùng chuyển. Forced (manual) failover có thể mất dữ liệu chưa replicate."},
{id:521,d:5,t:"Failover group",n:"s82-2",q:"Which cmdlet fails over every database in an elastic pool at once?",
 o:["`Invoke-AzSqlElasticPoolFailover`","`Invoke-AzSqlDatabaseFailover`","`Invoke-AzSqlInstanceFailover`","`Switch-AzSqlDatabaseFailoverGroup`"],a:0,
 e:"`Invoke-AzSqlElasticPoolFailover` cho cả pool; `Invoke-AzSqlDatabaseFailover` cho một database (kể cả một database trong pool, không ảnh hưởng các database khác); `Invoke-AzSqlInstanceFailover` cho MI."},
{id:522,d:5,t:"Availability Group",q:"You are sizing an availability group and comparing SQL Server Standard with Enterprise edition. Which two statements are true?",
 o:["Standard edition supports one primary and only one secondary replica, and that secondary is not readable","Enterprise edition supports one primary and up to eight secondary replicas","Standard edition supports up to four readable secondaries","Enterprise edition supports up to four secondary replicas","A secondary replica removes the need to take backups, because it is a second copy of the data"],a:[0,1],
 e:"SQL Server Enterprise: 1 primary + 1–8 secondary. **Standard chỉ cho 1 secondary** (basic availability group, một database mỗi AG, secondary không đọc được). Nhớ rằng secondary không thay thế backup."},
{id:523,d:5,t:"Availability Group",q:"Which two failover types involve no data loss and require synchronous-commit mode?",
 o:["Planned manual failover","Automatic failover","Forced manual failover","Failover initiated by geo-restore","Failover of an auto-failover group"],a:[0,1],
 e:"Planned manual failover và automatic failover đều không mất dữ liệu và chỉ dùng được ở synchronous-commit mode với secondary đã SYNCHRONIZED (automatic còn cần WSFC quorum). Forced manual failover là phương án DR cho asynchronous-commit và **có thể** mất dữ liệu."},
{id:524,d:5,t:"Availability Group",q:"The primary datacentre is lost and the only remaining replica is asynchronous and not synchronised. Which failover type is available?",
 o:["Forced manual failover, with possible data loss","Planned manual failover","Automatic failover","None — you must restore from backup"],a:0,
 e:"Chỉ **forced manual failover** (`ALTER AVAILABILITY GROUP ... FORCE_FAILOVER_ALLOW_DATA_LOSS`) hoạt động khi secondary chưa synchronized. Sau đó phải resume các database bị SUSPENDED trên replica cũ."},
{id:525,d:5,t:"Availability Group",q:"An availability group replica in another region uses asynchronous-commit mode. What is the trade-off?",
 o:["The primary commits without waiting for the secondary to harden the log, so transaction latency stays low but the secondary lags","The primary waits for the secondary to harden the log, guaranteeing zero data loss","No log is shipped until a manual failover is initiated","The secondary is not readable in asynchronous-commit mode"],a:0,
 e:"Asynchronous-commit: primary commit ngay, không chờ acknowledgement — latency thấp nhưng secondary trễ, nên chỉ hỗ trợ forced failover. Synchronous-commit thì primary chờ secondary hardened log."},
{id:526,d:5,t:"Availability Group",n:"s82-4",q:"Which T-SQL statement performs a planned failover of an availability group, and where must it be run?",
 o:["`ALTER AVAILABILITY GROUP MyAg FAILOVER;` on the instance hosting the target secondary replica","`ALTER AVAILABILITY GROUP MyAg FAILOVER;` on the current primary","`ALTER DATABASE Db1 SET HADR FAILOVER;` on the primary","`EXEC sp_failover_ag 'MyAg';` on the witness"],a:0,
 e:"Chạy `ALTER AVAILABILITY GROUP ... FAILOVER` trên instance chứa **secondary** sẽ trở thành primary. Trong SSMS: kết nối tới server đó, AlwaysOn High Availability – Availability Groups – right-click – Failover."},
{id:527,d:5,t:"Availability Group",n:"s90-2",q:"Automatic seeding is not used in your environment. How do you prepare a database on the secondary replica before joining it to an availability group?",
 o:["Back up the database and log on the primary, then restore both WITH NORECOVERY on the secondary, keeping the same database name","Back up on the primary and restore WITH RECOVERY on the secondary","Copy the MDF and LDF files and attach them","Create an empty database with the same name and let the AG seed it, without any restore"],a:0,
 e:"Secondary phải giống hệt primary: restore full + log **WITH NORECOVERY**, cùng tên database, primary dùng full recovery model. (Automatic seeding là lựa chọn khác, nhưng cách restore là quy trình kinh điển được hỏi.)"},
{id:528,d:5,t:"Availability Group",n:"s90-3",q:"Which two statements add a database to an existing availability group?",
 o:["`ALTER AVAILABILITY GROUP MyAG ADD DATABASE Db1;` on the primary","`ALTER DATABASE Db1 SET HADR AVAILABILITY GROUP = MyAG;` on each secondary","`ALTER AVAILABILITY GROUP MyAG JOIN DATABASE Db1;` on each secondary","`BACKUP DATABASE Db1 TO AVAILABILITY GROUP MyAG;`","`ALTER DATABASE Db1 SET PARTNER = MyAG;`"],a:[0,1],
 e:"Trên primary: `ALTER AVAILABILITY GROUP ... ADD DATABASE`. Trên từng secondary (sau khi đã restore WITH NORECOVERY): `ALTER DATABASE ... SET HADR AVAILABILITY GROUP = ...` để join."},
{id:529,d:5,t:"AG listener",q:"What is the maximum length of an availability group listener DNS name created through SSMS?",
 o:["15 characters","30 characters","63 characters","128 characters"],a:0,
 e:"Listener DNS name tối đa **15 ký tự** (chữ, số, gạch ngang, gạch dưới) vì tuân theo giới hạn NetBIOS. Port mặc định 1433, còn probe port của internal load balancer thường là 59999."},
{id:530,d:5,t:"AG listener",q:"Which IP configuration should you use for an availability group listener in production?",
 o:["A static IP address, because DHCP is not recommended for production listeners","DHCP, so the address follows the active replica","Either, since the cluster re-registers the name automatically","A public IP address, so clients outside the VNet can connect"],a:0,
 e:"Dùng **static IP**; DHCP không được khuyến nghị cho production. Với static, phải cấp một IP tĩnh cho mỗi subnet có availability replica."},
{id:531,d:5,t:"AG setup",q:"How many unused IP addresses do you need to build an availability group on Azure VMs, and what are they for?",
 o:["Two — one for the internal load balancer and one for the AG listener","One — for the listener only","Three — one per replica plus one for the listener","Four — two for the cluster and two for the listener"],a:0,
 e:"Cần 2 IP chưa dùng trong cùng subnet với AG: một cho internal load balancer, một cho listener. VM phải domain-joined, chạy SQL Server 2012+ Enterprise (hoặc 2016+ Standard) và đăng ký SQL IaaS Agent extension ở full manageability mode."},
{id:532,d:5,t:"AG setup",q:"You configure an internal load balancer for the availability group listener. What does 'internal' mean for clients?",
 o:["Only applications inside the virtual network (or connected to it) can reach the availability group","The listener is reachable from the public internet","The load balancer can only be used for disaster recovery failover","No static IP address is required"],a:0,
 e:"Internal load balancer chỉ phục vụ client trong VNet hoặc mạng đã peer/VPN tới VNet. External (public) load balancer thì mở ra internet. IP assignment nên để Static."},
{id:533,d:5,t:"Quorum",q:"A two-node Windows failover cluster on Azure VMs hosts an FCI, and you must configure the quorum witness. Which two statements are true?",
 o:["A cloud witness is the recommended choice whenever the cluster does not use shared storage","The cloud witness needs a General Purpose Standard storage account with locally redundant storage, and communicates over port 443","A disk witness is the recommended choice in all Azure scenarios","A file share witness must be placed on one of the two cluster nodes","No witness is needed, because two nodes already form a majority"],a:[0,1],
 e:"Cloud witness (Windows Server 2016+) được khuyến nghị whenever possible: chỉ ~1 MB trong blob, dùng port 443, cần storage account General Purpose Standard với LRS. Chỉ dùng disk witness khi cluster có shared storage."},
{id:534,d:5,t:"Quorum",q:"What limits the use of a disk witness on Azure?",
 o:["It requires a cluster using Azure shared disks, and it cannot be a Cluster Shared Volume","It cannot be used on Azure at all","It requires premium storage and at least 1 GB","It requires the disk to be attached to all nodes as a data disk"],a:0,
 e:"Disk witness là clustered disk nhỏ (<1 GB) trong nhóm Cluster Available Storage. Trên Azure chỉ dùng được với cluster dùng **Azure shared disks**, và không thể là Cluster Shared Volume."},
{id:535,d:5,t:"Quorum",q:"Why is the 'No majority (disk witness only)' quorum configuration not recommended?",
 o:["The witness disk becomes a single point of failure for the whole cluster","It requires an even number of nodes","It slows down failover detection","It only works with two nodes"],a:0,
 e:"Với cấu hình đó chỉ disk witness có vote, nên mất disk là mất cluster — single point of failure. Hãy dùng node majority kèm witness để có số vote lẻ."},
{id:536,d:5,t:"Quorum",q:"A two-node cluster is built with no quorum resource at all. What is the situation?",
 o:["It functions, but a quorum resource is recommended so that the vote count is odd and at least three votes exist","It cannot start until a witness is added","A third node is mandatory before the cluster can form","A cloud witness is created automatically"],a:0,
 e:"Cluster 2 node vẫn chạy được không cần quorum resource, nhưng nên có witness để tổng số vote là số lẻ (tối thiểu 3) — nếu không, mất một node là mất quorum."},
{id:537,d:5,t:"Backup",q:"You must take an ad-hoc backup of a database on Azure SQL Managed Instance before a risky deployment. What can you do?",
 o:["Take a full database COPY_ONLY backup — differential, log and file snapshot backups cannot be created manually","Take a full backup followed by a log backup","Take a differential backup only","Nothing; only automatic backups exist on a managed instance"],a:0,
 e:"MI đã có automatic backup; thủ công bạn **chỉ** tạo được full database COPY_ONLY backup (ghi ra URL). Differential, log và file snapshot backup thủ công đều không hỗ trợ."},
{id:538,d:5,t:"Backup",q:"Why does an ad-hoc backup need `WITH COPY_ONLY`?",
 o:["So it does not become the base for subsequent differential backups and does not break the existing backup chain","So the backup is compressed automatically","So the backup can be restored on a different edition","So the transaction log is truncated after the backup"],a:0,
 e:"COPY_ONLY tạo full backup nhưng không được coi là full backup cơ sở cho DIFFERENTIAL sau đó, nên không phá vỡ chuỗi backup định kỳ."},
{id:539,d:5,t:"Backup",q:"A `BACKUP DATABASE` statement writes to an existing backup file and no INIT/NOINIT option is given. What happens?",
 o:["NOINIT is the default, so the new backup set is appended to the media","INIT is the default, so the media is overwritten","The statement fails because the file already exists","The behaviour depends on the recovery model"],a:0,
 e:"Mặc định là `NOINIT` — append vào media set hiện có. `INIT` ghi đè các backup set (nhưng giữ media header)."},
{id:540,d:5,t:"Backup",q:"A junior DBA is about to add `WITH FORMAT` to a backup script that writes to a shared backup file. What is the risk?",
 o:["FORMAT writes a new media header, invalidating every existing backup set on that media, and it implies SKIP","FORMAT only changes the output file format and is harmless","FORMAT compresses the backup and cannot be restored on Standard edition","FORMAT requires the database to be offline"],a:0,
 e:"`FORMAT` ghi media header mới nên **toàn bộ** backup set đang có trên media không dùng được nữa; nó còn ngầm định `SKIP` (bỏ kiểm tra expiry/name). Mặc định an toàn là `NOFORMAT`."},
{id:541,d:5,t:"Backup",q:"Which two statements about the default backup options are correct?",
 o:["`NO_CHECKSUM` is the default, so backup checksums are not generated","`STOP_ON_ERROR` is the default, so the backup stops if a page checksum error is found","`CHECKSUM` is the default and is always verified","`CONTINUE_AFTER_ERROR` is the default for backups to URL","`STATS = 1` is the default progress interval"],a:[0,1],
 e:"Mặc định: `NO_CHECKSUM` và `STOP_ON_ERROR`. Dùng `CHECKSUM` để phát hiện hỏng trang sớm, và chỉ dùng `CONTINUE_AFTER_ERROR` khi đã biết có lỗi mà vẫn cần cứu dữ liệu. `STATS` mặc định là 10 (phần trăm)."},
{id:542,d:5,t:"Backup",q:"You want progress messages every 5% during a large backup. Which option do you set, and what is its default?",
 o:["`STATS = 5`; the default is 10","`PROGRESS = 5`; the default is 1","`STATS = 5`; the default is 1","`BUFFERCOUNT = 5`; there is no default"],a:0,
 e:"`STATS = X` in thông báo tiến độ mỗi X phần trăm, mặc định 10."},
{id:543,d:5,t:"Backup",q:"You plan to use `MIRROR TO` so each backup is written to two locations. Which two constraints apply?",
 o:["It requires Enterprise edition","Up to three mirrors are supported and they must be written at the same time as the primary backup","It works in all editions from Standard upwards","Only one mirror is supported","Mirrors can be written later, from the original backup file"],a:[0,1],
 e:"`MIRROR TO` chỉ có ở Enterprise edition, tối đa 3 mirror, và mirror phải được ghi **đồng thời** với backup chính — không thể tạo mirror sau."},
{id:544,d:5,t:"Backup",q:"Which encryption algorithms can `BACKUP ... WITH ENCRYPTION` use, and what else is required?",
 o:["AES_128, AES_192, AES_256 or TRIPLE_DES_3KEY, plus a server certificate or asymmetric key","AES_256 only, plus a database master key","RSA_2048 or AES_256, plus an Azure Key Vault key","MD5 or SHA_256, plus a password"],a:0,
 e:"Thuật toán: AES_128/192/256, TRIPLE_DES_3KEY, hoặc `NO_ENCRYPTION` (mặc định). Phải chỉ định `SERVER CERTIFICATE` hoặc `SERVER ASYMMETRIC KEY` — và phải backup certificate đó, không có nó thì không restore được."},
{id:545,d:5,t:"Backup",q:"You are backing up a 600 GB database from a managed instance to a URL. What must you take into account?",
 o:["The maximum stripe (blob) size is 195 GB, so you must split the backup across several URLs","A single blob can hold up to 1 TB, so one URL is enough","Backups to URL are limited to 195 GB in total","Striping is not supported for backups to URL"],a:0,
 e:"Mỗi backup stripe (blob) tối đa **195 GB**, nên database lớn phải chia thành nhiều file bằng cách khai báo nhiều `URL =` trong cùng lệnh BACKUP."},
{id:546,d:5,t:"Backup",q:"In the SSMS restore dialog you choose 'Backup the tail of the log before restore'. What state is the source database left in?",
 o:["The restoring state, unavailable to users until the restore sequence completes","Online, exactly as before","Read-only","Emergency mode"],a:0,
 e:"Tail-log backup kèm `NORECOVERY` để database ở trạng thái **restoring** (không ai dùng được) nhằm bảo đảm không có thay đổi nào sau đó. Lựa chọn còn lại là backup log rồi để database online."},
{id:547,d:5,t:"Log backup",q:"A database is damaged and suspect, and you must attempt one last log backup to minimise data loss. Which option should you use?",
 o:["`BACKUP LOG ... WITH NO_TRUNCATE, NORECOVERY`","`BACKUP LOG ... WITH TRUNCATE_ONLY`","`BACKUP LOG ... WITH STANDBY = 'path'`","`BACKUP DATABASE ... WITH COPY_ONLY`"],a:0,
 e:"`NO_TRUNCATE` buộc SQL Server cố backup log bất kể trạng thái database (damaged/suspended) và không truncate log — nên đi cùng `NORECOVERY`."},
{id:548,d:5,t:"Log backup",n:"s88-3",q:"What is the effect of `BACKUP LOG ... WITH STANDBY = 'D:\\standby.und'`?",
 o:["The tail of the log is backed up and the database is left read-only in STANDBY state, with rolled back changes held in the standby file","The database is left in the restoring state and is inaccessible","The database stays online and read-write","The log is truncated and the database enters emergency mode"],a:0,
 e:"`STANDBY` backup phần tail của log và để database **read-only, STANDBY** — cho phép đọc kiểm tra dữ liệu. File standby (undo file) giữ các thay đổi đã bị rollback để có thể tiếp tục restore sau."},
{id:549,d:5,t:"Log backup",q:"A database is in the SIMPLE recovery model and the team wants 15-minute point-in-time recovery. What must you explain?",
 o:["SIMPLE does not allow transaction log backups; the model must change to FULL (or BULK_LOGGED)","Log backups work in SIMPLE but cannot be restored","SIMPLE supports log backups only on Enterprise edition","Point-in-time recovery is available in SIMPLE through differential backups"],a:0,
 e:"SIMPLE recovery model không cho `BACKUP LOG` (log tự truncate ở mỗi checkpoint) nên không có PITR. Cần FULL, hoặc BULK_LOGGED cho giai đoạn bulk load."},
{id:550,d:5,t:"Log backup",q:"Which roles already hold the permissions needed to run BACKUP DATABASE and BACKUP LOG?",
 o:["sysadmin at server level, plus db_owner and db_backupoperator at database level","sysadmin only","db_datareader and db_datawriter","dbcreator and securityadmin"],a:0,
 e:"Quyền backup đã có trong fixed server role `sysadmin` và fixed database role `db_owner`, `db_backupoperator`."},
{id:551,d:5,t:"Restore",q:"An operator must restore a backup as a brand-new database on a SQL Server instance. Which permission is required?",
 o:["CREATE DATABASE — held by sysadmin and dbcreator, or by the owner for an existing database","RESTORE DATABASE, a distinct server-level permission","Membership of db_backupoperator in master","CONTROL SERVER"],a:0,
 e:"Restore vào database **mới** cần quyền CREATE DATABASE (có trong sysadmin và dbcreator). Với database đã tồn tại thì owner (dbo) cũng restore được."},
{id:552,d:5,t:"Restore",q:"You are restoring a full backup and will then apply three log backups. Which option must the full restore use?",
 o:["`WITH NORECOVERY`, leaving the database in the restoring state","`WITH RECOVERY`, which is the default","`WITH STANDBY`, so the database stays readable between restores","`WITH REPLACE`, to overwrite the previous database"],a:0,
 e:"`NORECOVERY` giữ database ở trạng thái restoring để restore tiếp. `RECOVERY` (mặc định) đưa database online và kết thúc chuỗi restore. `STANDBY` cho đọc read-only giữa các bước, cần undo file."},
{id:553,d:5,t:"Restore",q:"You must confirm that a backup file is readable and complete without restoring it. What should you run?",
 o:["`RESTORE VERIFYONLY FROM DISK = '...'`","`RESTORE HEADERONLY FROM DISK = '...'`","`RESTORE DATABASE ... WITH RECOVERY, STATS = 1`","`DBCC CHECKDB` after restoring to a scratch database"],a:0,
 e:"`RESTORE VERIFYONLY` kiểm tra backup mà không restore (kiểm tra đầy đủ hơn nếu backup được tạo `WITH CHECKSUM`). `RESTORE HEADERONLY` chỉ đọc header. Nó **không** thay thế việc thử restore thật và chạy CHECKDB."},
{id:554,d:5,t:"Restore",q:"Which databases are missing from the Destination database dropdown in the SSMS restore dialog?",
 o:["master and tempdb","msdb and model","tempdb and msdb","None — every database is listed"],a:0,
 e:"Dropdown liệt kê mọi database trên server **trừ master và tempdb** (master phải restore ở single-user mode, tempdb được tạo lại mỗi lần khởi động)."},
{id:555,d:5,t:"Restore",q:"You select 'Restrict access to the restored database'. Who can connect afterwards?",
 o:["Members of db_owner, dbcreator and sysadmin","Members of sysadmin only","Any user holding CONNECT permission","Only the login that performed the restore"],a:0,
 e:"Tùy chọn đó đặt database ở `RESTRICTED_USER`: chỉ db_owner, dbcreator và sysadmin kết nối được — hữu ích để kiểm tra dữ liệu trước khi mở cho người dùng."},
{id:556,d:5,t:"Restore",n:"s88-2",q:"A table was dropped at 12:04 PM. You must restore to 12:00 PM using the full backup and log backups. Which syntax is correct?",
 o:["`RESTORE LOG Sales FROM DISK='...' WITH FILE = 6, NORECOVERY, STOPAT = 'Jun 19, 2024 12:00 PM';`","`RESTORE DATABASE Sales FROM DISK='...' WITH POINT_IN_TIME = 'Jun 19, 2024 12:00 PM';`","`RESTORE DATABASE Sales AS OF 'Jun 19, 2024 12:00 PM';`","`RESTORE LOG Sales FROM DISK='...' WITH RECOVERY_POINT = '12:00';`"],a:0,
 e:"Dùng `STOPAT = 'datetime'` trên lệnh restore log (kèm `FILE = n` nếu media chứa nhiều backup set). Còn có `STOPATMARK` / `STOPBEFOREMARK = { mark | lsn } [AFTER 'datetime']` cho marked transaction."},
{id:557,d:5,t:"PITR",q:"What is the automatic backup schedule behind point-in-time restore for Azure SQL Database and managed instance?",
 o:["Full backups weekly, differential backups every 12–24 hours, transaction log backups every 5–10 minutes","Full backups daily and log backups hourly","Full backups monthly, differential backups daily, log backups every minute","Snapshot backups every 5 minutes"],a:0,
 e:"Full mỗi tuần, differential mỗi 12–24 giờ, log mỗi 5–10 phút. Backup đầu tiên được lên lịch ngay sau khi database được tạo hoặc restore."},
{id:558,d:5,t:"PITR",q:"What is the default point-in-time restore retention, and what range can you configure?",
 o:["7 days by default, configurable from 1 to 35 days — with Basic capped at 7 days","35 days by default, configurable from 1 to 35 days","14 days by default, configurable from 7 to 30 days","Fixed at 7 days and not configurable"],a:0,
 e:"PITR mặc định 7 ngày, đặt được 1–35 ngày (Basic tối đa 7; Hyperscale có cơ chế riêng). Trên MI, PITR áp dụng cho **từng database**, không phải cả instance."},
{id:559,d:5,t:"PITR",q:"A developer asks you to restore last night's copy of a production Azure SQL database over the top of the existing database. What must you do?",
 o:["Restore to a new database name, then rename the databases, because Azure SQL cannot restore over an existing database","Use `RESTORE DATABASE ... WITH REPLACE`","Use the portal, which allows overwriting","Use PowerShell with `-Force`, which allows overwriting"],a:0,
 e:"Trên Azure SQL, restore **luôn** tạo database mới — không có cách nào ghi đè (kể cả PowerShell/portal). Quy trình: restore ra tên tạm, rename database cũ, rồi rename bản restore về tên gốc."},
{id:560,d:5,t:"LTR",q:"Compliance requires monthly backups to be kept for seven years. Which feature should you use, and what is its maximum retention?",
 o:["Long-term retention, which stores backups for up to 10 years","Point-in-time restore, extended to 35 days and then archived","Geo-redundant backup storage, which never expires","Azure Backup for SQL Server, which is required because Azure SQL has no LTR"],a:0,
 e:"LTR giữ backup tới **10 năm**, cấu hình theo Weekly / Monthly / Yearly (kèm WeekOfYear). Backup nằm trong Azure Blob storage, mỗi tuần một container khác."},
{id:561,d:5,t:"LTR",q:"You configure an LTR policy today and cannot find any long-term backup afterwards. Which two statements explain the behaviour?",
 o:["Azure creates LTR backups on its own schedule; you cannot trigger one manually","The first LTR backup may take up to seven days to appear","LTR backups are created by `BACKUP DATABASE ... WITH LTR`","LTR copies existing PITR backups immediately when the policy is saved","LTR backups are stored inside the database itself"],a:[0,1],
 e:"LTR do Azure thực hiện: bạn không kiểm soát timing, không tạo thủ công được, và backup LTR đầu tiên có thể mất tới **7 ngày** mới xuất hiện."},
{id:562,d:5,t:"LTR",q:"A database with an LTR policy is deleted. What happens to its long-term backups?",
 o:["No new backups are taken, and existing ones are removed as they reach the end of their retention","All backups are deleted immediately with the database","The backups are retained forever","The backups are moved to the archive access tier automatically"],a:0,
 e:"Sau khi database bị xoá: không có backup mới, còn backup hiện có vẫn dùng được cho tới khi hết hạn theo policy rồi bị xoá dần. Muốn giữ lâu hơn thì phải sao ra ngoài trước khi xoá."},
{id:563,d:5,t:"LTR",q:"What must you remember about LTR policies in a geo-replication topology?",
 o:["Configure an LTR policy on the secondary as well; the backups are only taken once it becomes the primary","Secondaries never need an LTR policy","The primary's LTR policy is copied to secondaries automatically","LTR backups are taken only on secondaries, to offload the primary"],a:0,
 e:"Đặt LTR policy sẵn trên secondary để sau khi failover nó tiếp tục có LTR — nhưng backup LTR chỉ được tạo khi database đó **là primary**."},
{id:564,d:5,t:"Cloud backup",q:"In SSMS you back up a database to a URL and click Create Credential. What is generated?",
 o:["A credential holding a shared access signature (SAS) for the container","A credential holding the storage account key","A service principal in Microsoft Entra ID","A system-assigned managed identity on the SQL Server instance"],a:0,
 e:"'Create Credential' sinh credential dựa trên **SAS** cho container. Khi restore mà không thấy backup file, nguyên nhân hay gặp là dùng sai SAS/credential (hoặc SAS đã hết hạn)."},
{id:565,d:5,t:"Cloud backup",q:"What is the limitation of restoring a managed instance backup from Azure Blob Storage with T-SQL?",
 o:["The backup can only be restored to another managed instance, not to SQL Server on-premises","Only COPY_ONLY backups can be restored","Multiple URLs are not supported in the RESTORE statement","Restore from URL requires SSMS and cannot be scripted"],a:0,
 e:"`RESTORE DATABASE ... FROM URL` của MI chỉ restore được sang MI khác — không sang SQL Server on-prem (do version của MI luôn mới hơn). Trên MI, restore hoàn chỉnh từ Blob Storage chỉ làm được bằng T-SQL."},
{id:566,d:5,t:"Replication",q:"You are designing transactional replication with Azure SQL Database in the topology. Which two roles can an Azure SQL Database not perform?",
 o:["Publisher","Distributor","Push subscriber","Pull subscriber","Republisher"],a:[0,1],
 e:"Publisher và Distributor phải là SQL Server instance hoặc MI — Azure SQL Database chỉ làm được **push subscriber**. Cần đồng bộ hai chiều với Azure SQL Database thì dùng Data Sync."},
{id:567,d:5,t:"Replication",q:"Which replication types can an Azure SQL Database support as a push subscriber?",
 o:["Standard transactional and snapshot replication","Transactional, snapshot and bidirectional replication","Merge and peer-to-peer replication","All replication types"],a:0,
 e:"Azure SQL Database (push subscriber): chỉ transactional và snapshot. MI thêm được bidirectional; peer-to-peer và merge chỉ dùng cho SQL Server on-prem/VM (merge cũng dùng được với MI)."},
{id:568,d:5,t:"Replication",q:"Field engineers work offline on laptops and both the head office and the laptops modify the same rows, then reconcile when reconnected. Which replication type fits?",
 o:["Merge replication","Transactional replication","Snapshot replication","Peer-to-peer transactional replication"],a:0,
 e:"Merge replication cho phép sửa dữ liệu ở cả publisher và subscriber, đồng bộ khi kết nối lại và có cơ chế giải quyết xung đột — thiết kế đúng cho client offline."},
{id:569,d:5,t:"Replication",q:"You create a publication without specifying a distributor. What is the consequence?",
 o:["The publisher acts as its own distributor, and you must specify a snapshot folder the agents can read and write","Publication creation fails until a distributor is configured","Azure creates a distributor automatically in the same region","The subscriber becomes the distributor"],a:0,
 e:"Không chỉ định distributor thì publisher tự làm distributor (local distribution) — cần chỉ định default snapshot folder mà các agent truy cập được. Với hệ thống tải cao thì nên tách remote distributor."},
{id:570,d:5,t:"Replication",q:"Which two version rules apply to a distributor and a push subscriber relative to the publisher?",
 o:["A distributor on a SQL Server instance must be the same version as the publisher or higher","A push subscriber may be newer than the publisher, or older by at most two versions","A distributor must always be an older version than the publisher","A push subscriber must be exactly the same version as the publisher","All three components must run the same service pack level"],a:[0,1],
 e:"Distributor (nếu là SQL Server instance) phải bằng hoặc cao hơn publisher. Push subscriber có thể mới hơn publisher, hoặc thấp hơn nhưng không quá 2 version."},
{id:571,d:5,t:"Log shipping",q:"A log shipping secondary is up to date and the primary has just failed. What happens next?",
 o:["Nothing automatically — failover in log shipping is a manual process","The secondary is promoted automatically within 30 seconds","Failover happens automatically if a monitor server is configured","Clients are redirected automatically by the listener"],a:0,
 e:"Log shipping **không** có automatic failover: phải tự restore các log còn lại, recover database và chuyển client. Đây là điểm khác căn bản so với availability group và failover group."},
{id:572,d:5,t:"Log shipping",q:"What does the optional monitor server in a log shipping configuration track?",
 o:["When the log was last backed up, when each secondary copied and restored it, and any backup or restore failure alerts","Disk space on the primary only","Query performance on the secondary","Firewall configuration on both servers"],a:0,
 e:"Monitor server (nên đặt trên một instance thứ ba) theo dõi thời điểm backup trên primary, thời điểm copy/restore trên từng secondary và phát alert khi job thất bại."},
{id:573,d:5,t:"Log shipping",q:"You configure 'Delay restoring backups at least 60 minutes' on a log shipping secondary. What is the benefit?",
 o:["If data is deleted by mistake on the primary, there is an hour in which the secondary still holds the previous version","The network load of the copy job is reduced","The secondary can run with less CPU than the primary","Restores complete faster because several log files are applied together"],a:0,
 e:"Delay restore tạo cửa sổ thời gian để lấy lại dữ liệu bị xoá nhầm từ secondary trước khi thay đổi được áp vào — đánh đổi là RPO/RTO khi failover xấu đi tương ứng."},
{id:574,d:5,t:"Log shipping",q:"You want the log shipping secondary to be readable between restores using standby mode. What limitation applies?",
 o:["Standby mode is not available when the secondary server's major version is higher than the primary's","Standby mode requires Enterprise edition","Standby mode only works with Azure VMs","Standby mode allows reads even while a restore is running"],a:0,
 e:"Standby mode không dùng được nếu major version của secondary cao hơn primary. Ngoài ra khi restore đang chạy thì kết nối đọc bị ngắt (hoặc restore phải chờ), nên cần cân nhắc lịch restore."},
{id:575,d:5,t:"Log shipping",q:"Which procedure do you run on the primary server when configuring log shipping with T-SQL?",
 o:["`sp_add_log_shipping_primary_database`","`sp_add_log_shipping_secondary_primary`","`sp_add_log_shipping_secondary_database`","`sp_add_log_shipping_alert_job`, before anything else"],a:0,
 e:"Trên primary: `sp_add_log_shipping_primary_database`, `sp_add_jobschedule`, `sp_add_log_shipping_alert_job`, `sp_add_log_shipping_primary_secondary`. Trên secondary: `sp_add_log_shipping_secondary_primary`, `sp_add_log_shipping_secondary_database`, `sp_add_jobschedule`, `sp_attach_schedule`."},
{id:576,d:5,t:"MI restore",q:"You must restore an Azure SQL database into a different region from its geo-redundant backups. How do you do it in the portal?",
 o:["Create a new database and, on the Additional settings tab, change 'Use existing data' to Backup and pick the backup","Run `RESTORE DATABASE ... FROM URL` against the target server","Copy the data files to the target region and attach them","Create a failover group with the target region, then remove the primary"],a:0,
 e:"Geo-restore: tạo database mới ở region đích, trong 'Additional settings' đổi 'Use existing data' sang **Backup** rồi chọn backup. Với MI: mở MI, '+ New database', đặt tên và chọn Backup tương tự."},
{id:577,d:5,t:"Backup",q:"A managed instance database must be copied to a SQL Server 2019 instance on-premises. What should you tell the requester?",
 o:["It is not possible with a native backup, because a managed instance backup cannot be restored to an earlier SQL Server version — use BACPAC, Data Sync or transactional replication instead","Take a COPY_ONLY backup to a URL and restore it on the on-premises instance","Detach the database files from the managed instance and copy them","Use RESTORE ... WITH REPLACE, DOWNGRADE"],a:0,
 e:"Backup của MI luôn ở version mới hơn nên **không** restore được xuống SQL Server. Cách chuyển dữ liệu ra ngoài: BACPAC (`SqlPackage`), transactional replication với MI làm publisher, hoặc ETL/Data Sync."},
];

{id:"case2",title:"Case study 2 — Fabrikam Health: bảo mật và tuân thủ cho dữ liệu bệnh nhân",

{id:"case3",title:"Case study 3 — Northwind Logistics: sự cố hiệu năng sau khi lên Azure",
 sections:[
   {h:"Bối cảnh",
    md:"`ShipmentDb` vừa được migrate từ SQL Server 2014 lên **Azure SQL Database General Purpose, 8 vCores**. Compatibility level được nâng từ 120 lên 160 trong quá trình migrate.\n\nSau khi go-live, người dùng phàn nàn hệ thống chậm vào giờ cao điểm buổi sáng. Query Store đang bật (mặc định)."},
   {h:"Quan sát từ giám sát",
    md:"- `sys.dm_db_resource_stats` cho thấy `avg_cpu_percent` khoảng 95% trong 90 phút mỗi sáng.\n- Wait chiếm ưu thế là `SOS_SCHEDULER_YIELD` và `CXPACKET`.\n- Một stored procedure tìm kiếm đơn hàng chạy 8 giây, so với 400 ms ở môi trường cũ.\n- Execution plan của procedure đó cho thấy Clustered Index Scan trên bảng 400 triệu dòng, kèm một Sort tốn kém và số dòng estimated (1) lệch rất xa actual (2,4 triệu).\n- `max_worker_percent` đạt 98% vào lúc cao điểm, trong khi `data_io_percent` chỉ khoảng 25%.\n- Truy vấn tìm kiếm dùng `WHERE YEAR(OrderDate) = @year AND CustomerName LIKE '%' + @name + '%'`."},
