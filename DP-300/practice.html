/* ============================================================
   Engine
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const LS_WRONG   = "dp300.wrong.v2";
const LS_BEST    = "dp300.best.v2";
const LS_THEME   = "dp300.theme.v1";

const LETTERS = "ABCDEFGH";
const KINDLABEL = {
  mc:"Một đáp án", multi:"Nhiều đáp án", order:"Sắp xếp thứ tự",
  fill:"Điền chỗ trống", yesno:"Có / Không", case:"Case study"
};
const KIND_ORDER = ["mc", "multi", "order", "fill", "yesno", "case"];

/* ---- utilities ---- */
const load    = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } };
const save    = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const eqSet   = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
const esc     = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* `code` và **đậm** trong dữ liệu câu hỏi được dựng thành thẻ HTML */
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

/* Markdown rút gọn cho phần bối cảnh case study: đoạn văn + gạch đầu dòng */
function fmtBlock(md){
  const out = []; let ul = false;
  md.split("\n").forEach(line => {
    if (/^\s*-\s+/.test(line)){
      if (!ul){ out.push("<ul>"); ul = true; }
      out.push("<li>" + fmt(line.replace(/^\s*-\s+/, "")) + "</li>");
    } else {
      if (ul){ out.push("</ul>"); ul = false; }
      if (line.trim()) out.push("<p>" + fmt(line) + "</p>");
    }
  });
  if (ul) out.push("</ul>");
  return out.join("");
}

/* ---- gộp 5 nguồn câu hỏi thành một danh sách phẳng ---- */
const ALL = [];
QUESTIONS.forEach(q => ALL.push({ id:q.id, d:q.d, t:q.t, k:Array.isArray(q.a) ? "multi" : "mc", q }));
ORDER    .forEach(q => ALL.push({ id:q.id, d:q.d, t:q.t, k:"order", q }));
FILL     .forEach(q => ALL.push({ id:q.id, d:q.d, t:q.t, k:"fill",  q }));
YESNO    .forEach(q => ALL.push({ id:q.id, d:q.d, t:q.t, k:"yesno", q }));
CASES    .forEach(c => c.questions.forEach(q => ALL.push({ id:q.id, d:q.d, t:q.t, k:"case", q, cs:c })));

const byId  = new Map(ALL.map(x => [x.id, x]));
const isMC  = k => k === "mc" || k === "multi" || k === "case";
const multi = src => Array.isArray(src.q.a);

/* ---- link "đọc thêm" trỏ vào đúng mục của notes.html ----
   Mặc định tra theo "<domain>|<chủ đề>"; câu nào có trường `n` thì `n` thắng,
   dùng khi một chủ đề nằm rải ở nhiều mục của note. */
function noteLink(src){
  const id = src.q.n || NOTE_REF[src.d + "|" + src.t];
  if (!id) return null;
  const a = document.createElement("a");
  a.className = "note-link";
  a.href = "notes.html#" + id;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Đọc note: " + src.t + " →";
  return a;
}

/* ---- state ---- */
const state = {
  domains: new Set([0,1,2,3,4]),
  kinds:   new Set(KIND_ORDER),
  mode:    "study",
  list:    [],
  i:       0,
  correct: 0,
  caseOpen:true
};

function makeItem(src){
  const it = { src, revealed:false };
  const q = src.q;
  if (src.k === "order"){
    it.pool = shuffle(q.steps.map((_, i) => i));
    it.seq  = [];
  } else if (src.k === "fill"){
    it.bo  = q.blanks.map(b => shuffle(b.o.map((_, i) => i)));   // thứ tự hiển thị của từng dropdown
    it.sel = q.blanks.map(() => -1);                             // index GỐC đã chọn
  } else if (src.k === "yesno"){
    it.yn = null;
  } else {
    it.order  = shuffle(q.o.map((_, i) => i));                   // thứ tự hiển thị của các lựa chọn
    it.picked = new Set();                                       // index GỐC đã chọn
  }
  return it;
}

function answered(it){
  const k = it.src.k;
  if (k === "order") return it.seq.length === it.src.q.steps.length;
  if (k === "fill")  return it.sel.every(v => v >= 0);
  if (k === "yesno") return it.yn !== null;
  return multi(it.src) ? it.picked.size === it.src.q.a.length : it.picked.size === 1;
}

function isCorrect(it){
  const q = it.src.q;
  switch (it.src.k){
    case "order": return it.seq.length === q.steps.length && it.seq.every((v, i) => v === i);
    case "fill":  return it.sel.every((v, i) => v === q.blanks[i].a);
    case "yesno": return it.yn === q.a;
    default:      return eqSet(it.picked, new Set(Array.isArray(q.a) ? q.a : [q.a]));
  }
}

/* ---- theme ---- */
(function(){
  const saved = localStorage.getItem(LS_THEME);
  if (saved) document.documentElement.dataset.theme = saved.replace(/"/g, "");
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem(LS_THEME, next);
  };
})();

/* ---- trang thiết lập ---- */
function renderSetup(){
  $("#qcount").textContent = ALL.length + " câu hỏi";

  const dbox = $("#domains");
  dbox.innerHTML = "";
  DOMAINS.forEach((name, i) => {
    const n = ALL.filter(x => x.d === i + 1).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = DOMAIN_SHORT[i] + " (" + n + ")";
    b.title = name + " — " + DOMAIN_WEIGHT[i] + " của đề thi";
    b.setAttribute("aria-pressed", state.domains.has(i));
    b.onclick = () => {
      if (state.domains.has(i)){ if (state.domains.size > 1) state.domains.delete(i); }
      else state.domains.add(i);
      renderSetup();
    };
    dbox.appendChild(b);
  });

  const kbox = $("#kinds");
  kbox.innerHTML = "";
  KIND_ORDER.forEach(k => {
    const n = ALL.filter(x => x.k === k).length;
    if (!n) return;
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = KINDLABEL[k] + " (" + n + ")";
    b.setAttribute("aria-pressed", state.kinds.has(k));
    b.onclick = () => {
      if (state.kinds.has(k)){ if (state.kinds.size > 1) state.kinds.delete(k); }
      else state.kinds.add(k);
      renderSetup();
    };
    kbox.appendChild(b);
  });

  $$("#modes [data-mode]").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.mode === state.mode);
    b.onclick = () => { state.mode = b.dataset.mode; renderSetup(); };
  });

  const wrong = new Set(load(LS_WRONG, []));
  $("#wrongCount").textContent = wrong.size;
  $("#startWrong").disabled = wrong.size === 0;

  const best = load(LS_BEST, {});
  const stats = $("#stats");
  stats.innerHTML = "";
  DOMAINS.forEach((name, i) => {
    const b = best[i + 1];
    const el = document.createElement("div");
    el.className = "stat";
    el.innerHTML = "<b>" + (b ? Math.round(b) + "%" : "—") + "</b><span>" + DOMAIN_SHORT[i] + "</span>";
    el.title = name + " — điểm cao nhất";
    stats.appendChild(el);
  });
}

/* Giữ các câu của cùng một case study liền nhau, như khi thi thật */
function groupCases(list){
  const out = [], used = new Array(list.length).fill(false);
  list.forEach((x, i) => {
    if (used[i]) return;
    out.push(x); used[i] = true;
    if (!x.cs) return;
    list.forEach((y, j) => {
      if (!used[j] && y.cs && y.cs.id === x.cs.id){ out.push(y); used[j] = true; }
    });
  });
  return out;
}

/* ---- bắt đầu một lượt ---- */
function start(pool){
  if (!pool){
    pool = ALL.filter(x => state.domains.has(x.d - 1) && state.kinds.has(x.k));
    shuffle(pool);
    const n = +$("#num").value;
    if (n > 0) pool = pool.slice(0, n);
    pool = groupCases(pool);
  }
  if (!pool.length) return;

  state.list = pool.map(makeItem);
  state.i = 0; state.correct = 0; state.caseOpen = true;
  $("#setup").hidden = true; $("#result").hidden = true; $("#quiz").hidden = false;
  renderQuestion();
}

function renderQuestion(){
  const it = state.list[state.i], src = it.src, q = src.q;

  $("#prog").style.width = (state.i / state.list.length * 100) + "%";
  $("#mDomain").textContent = DOMAIN_SHORT[src.d - 1];
  $("#mTopic").textContent  = src.t;
  $("#mKind").textContent   = KINDLABEL[src.k];
  $("#mPos").textContent    = (state.i + 1) + "/" + state.list.length;
  $("#mScore").textContent  = state.mode === "study" ? " · " + state.correct + " đúng" : "";

  /* bối cảnh case study */
  $("#casePanel").innerHTML = src.cs ? casePanel(src.cs) : "";
  if (src.cs) $("#casePanel").querySelector(".casebar").onclick = () => {
    state.caseOpen = !state.caseOpen; renderQuestion();
  };

  const head = src.k === "yesno"
    ? "Giải pháp dưới đây có đạt được mục tiêu không?"
    : q.q;
  $("#qtext").innerHTML = fmt(head)
    + (multi(src) ? ' <span class="badge">chọn ' + q.a.length + ' đáp án</span>' : "");

  $("#hint").innerHTML = {
    mc:    "Phím tắt: <kbd>1</kbd>–<kbd>9</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / câu tiếp",
    multi: "Chọn đủ số đáp án được yêu cầu · <kbd>1</kbd>–<kbd>9</kbd> chọn · <kbd>Enter</kbd> kiểm tra",
    case:  "Bấm vào tiêu đề bối cảnh để thu gọn hoặc mở lại",
    order: "Bấm bước ở cột trái để xếp vào cột phải; bấm ở cột phải để bỏ ra",
    fill:  "Chọn giá trị cho từng chỗ trống trong đoạn code",
    yesno: "Trả lời Có hoặc Không cho riêng giải pháp này · phím <kbd>Y</kbd> / <kbd>N</kbd>"
  }[src.k] || "";

  ({ order:renderOrder, fill:renderFill, yesno:renderYesNo })[src.k]
    ? ({ order:renderOrder, fill:renderFill, yesno:renderYesNo })[src.k](it)
    : renderMC(it);

  $("#expl").innerHTML = "";
  if (it.revealed){
    if (state.mode === "study") showExpl(it);
    $("#check").hidden = true; $("#next").hidden = false;
  } else {
    $("#check").hidden = false;
    $("#check").disabled = !answered(it);
    $("#check").textContent = state.mode === "study" ? "Kiểm tra" : "Trả lời";
    $("#next").hidden = true;
  }
  $("#next").textContent = state.i === state.list.length - 1 ? "Xem kết quả →" : "Câu tiếp →";
}

function casePanel(cs){
  return '<div class="casebox"><button class="casebar"><span class="caret">'
    + (state.caseOpen ? "▾" : "▸") + "</span>" + esc(cs.title)
    + '<span class="spacer"></span><span class="hintx">'
    + (state.caseOpen ? "thu gọn" : "xem bối cảnh") + "</span></button>"
    + (state.caseOpen
        ? '<div class="casebody">' + cs.sections.map(s => "<h5>" + esc(s.h) + "</h5>" + fmtBlock(s.md)).join("") + "</div>"
        : "")
    + "</div>";
}

function renderMC(it){
  const q = it.src.q, correct = new Set(Array.isArray(q.a) ? q.a : [q.a]);
  $("#body").innerHTML = '<div class="opts">' + it.order.map((orig, pos) => {
    let cls = "";
    if (it.revealed && state.mode === "study"){
      if (correct.has(orig)) cls = " ok";
      else if (it.picked.has(orig)) cls = " bad";
    }
    return '<button class="opt' + cls + '" data-o="' + orig + '" aria-pressed="'
      + it.picked.has(orig) + '"' + (it.revealed ? " disabled" : "")
      + '><span class="k">' + LETTERS[pos] + "</span><span>" + fmt(q.o[orig]) + "</span></button>";
  }).join("") + "</div>";
  if (it.revealed) return;
  $$("#body .opt").forEach(el => el.onclick = () => {
    const o = +el.dataset.o;
    if (multi(it.src)) it.picked.has(o) ? it.picked.delete(o) : it.picked.add(o);
    else it.picked = new Set([o]);
    renderQuestion();
  });
}

function renderOrder(it){
  const q = it.src.q;
  const pool = it.pool.length
    ? it.pool.map(i => '<button class="step" data-add="' + i + '"><span>' + fmt(q.steps[i]) + "</span></button>").join("")
    : '<div class="slot">(đã dùng hết)</div>';
  const seq = it.seq.length
    ? it.seq.map((v, pos) => {
        const cls = it.revealed && state.mode === "study" ? (v === pos ? " ok" : " bad") : "";
        return '<button class="step' + cls + '" data-rm="' + pos + '"' + (it.revealed ? " disabled" : "")
          + '><span class="n">' + (pos + 1) + "</span><span>" + fmt(q.steps[v]) + "</span></button>";
      }).join("")
    : '<div class="slot">Bấm các bước bên trái để xếp vào đây theo thứ tự</div>';
  $("#body").innerHTML = '<div class="build"><div class="buildcol"><h4>Các bước có sẵn</h4>' + pool
    + '</div><div class="buildcol"><h4>Trình tự của bạn</h4>' + seq + "</div></div>";
  if (it.revealed) return;
  $$("#body [data-add]").forEach(el => el.onclick = () => {
    const i = +el.dataset.add;
    it.pool = it.pool.filter(x => x !== i); it.seq.push(i); renderQuestion();
  });
  $$("#body [data-rm]").forEach(el => el.onclick = () => {
    const pos = +el.dataset.rm;
    it.pool.push(it.seq[pos]); it.seq.splice(pos, 1); renderQuestion();
  });
}

function renderFill(it){
  const q = it.src.q;
  const code = esc(q.code).replace(/\{\{(\d)\}\}/g, (m, n) => {
    const bi = +n, b = q.blanks[bi];
    let cls = "";
    if (it.revealed && state.mode === "study") cls = it.sel[bi] === b.a ? " class=\"ok\"" : " class=\"bad\"";
    const opts = ['<option value="-1">— chọn —</option>'].concat(
      it.bo[bi].map(orig => '<option value="' + orig + '"'
        + (it.sel[bi] === orig ? " selected" : "") + ">" + esc(b.o[orig]) + "</option>")).join("");
    return '<select data-b="' + bi + '"' + cls + (it.revealed ? " disabled" : "") + ">" + opts + "</select>";
  });
  $("#body").innerHTML = '<pre class="fillcode">' + code + "</pre>";
  if (it.revealed) return;
  $$("#body select").forEach(sel => sel.onchange = () => {
    it.sel[+sel.dataset.b] = +sel.value;
    renderQuestion();
  });
}

function renderYesNo(it){
  const q = it.src.q;
  const cls = v => {
    if (!(it.revealed && state.mode === "study")) return "";
    if (v === q.a) return " ok";
    return it.yn === v ? " bad" : "";
  };
  $("#body").innerHTML =
      '<div class="goalbox"><h4>Mục tiêu</h4>' + fmt(q.goal) + "</div>"
    + '<div class="solbox"><h4>Giải pháp đề xuất</h4>' + fmt(q.solution) + "</div>"
    + '<div class="ynrow">'
    + '<button data-v="1" class="' + cls(true).trim() + '" aria-pressed="' + (it.yn === true) + '"'
      + (it.revealed ? " disabled" : "") + ">Có — giải pháp đạt mục tiêu</button>"
    + '<button data-v="0" class="' + cls(false).trim() + '" aria-pressed="' + (it.yn === false) + '"'
      + (it.revealed ? " disabled" : "") + ">Không — không đạt</button></div>";
  if (it.revealed) return;
  $$("#body .ynrow button").forEach(b => b.onclick = () => {
    it.yn = b.dataset.v === "1"; renderQuestion();
  });
}

/* ---- mô tả đáp án đúng / đáp án đã chọn, dùng cho giải thích và phần ôn lại ---- */
function answerText(it){
  const q = it.src.q;
  if (it.src.k === "order")
    return { yours: it.seq.length ? it.seq.map(v => q.steps[v]).map((s, i) => (i+1) + ". " + s).join(" → ") : "(bỏ trống)",
             right: q.steps.map((s, i) => (i+1) + ". " + s).join(" → ") };
  if (it.src.k === "fill")
    return { yours: it.sel.map((v, i) => v < 0 ? "—" : q.blanks[i].o[v]).join("  ·  "),
             right: q.blanks.map(b => b.o[b.a]).join("  ·  ") };
  if (it.src.k === "yesno")
    return { yours: it.yn === null ? "(bỏ trống)" : (it.yn ? "Có" : "Không"),
             right: q.a ? "Có" : "Không" };
  const L = o => LETTERS[it.order.indexOf(o)];
  const right = Array.isArray(q.a) ? q.a : [q.a];
  return { yours: it.picked.size ? [...it.picked].map(o => L(o) + ". " + q.o[o]).sort().join("  |  ") : "(bỏ trống)",
           right: right.map(o => L(o) + ". " + q.o[o]).sort().join("  |  ") };
}

function showExpl(it){
  const ok = isCorrect(it), src = it.src;
  const e = document.createElement("div");
  e.className = "expl " + (ok ? "ok" : "bad");
  const head = document.createElement("b");
  head.textContent = ok ? "Chính xác" : "Chưa đúng";
  e.appendChild(head);
  if (!ok){
    const line = document.createElement("div");
    line.style.margin = "0 0 6px";
    line.innerHTML = "Đáp án đúng: " + fmt(answerText(it).right);
    e.appendChild(line);
  }
  const why = document.createElement("div");
  why.innerHTML = fmt(src.q.e);
  e.appendChild(why);
  const ln = noteLink(src);
  if (ln) e.appendChild(ln);
  $("#expl").appendChild(e);
}

/* ---- chốt đáp án một câu ---- */
function reveal(it){
  if (it.revealed) return;
  it.revealed = true;
  if (isCorrect(it)) state.correct++;
  const w = new Set(load(LS_WRONG, []));
  isCorrect(it) ? w.delete(it.src.id) : w.add(it.src.id);
  save(LS_WRONG, [...w]);
}

function check(){
  const it = state.list[state.i];
  if (it.revealed || !answered(it)) return;
  reveal(it);
  renderQuestion();
  $("#next").focus();
}

function next(){
  if (state.i === state.list.length - 1) return finish();
  state.i++; renderQuestion(); window.scrollTo({ top:0 });
}

/* ---- chấm điểm ---- */
function finish(){
  /* Chỉ chấm những câu đã trả lời: bấm "Kết thúc" giữa bài không tính các câu
     chưa xem là sai, nên danh sách "câu đã sai" không bị làm bẩn. */
  const done  = state.list.filter(it => it.revealed);
  if (!done.length) return home();
  $("#quiz").hidden = true; $("#result").hidden = false;

  const total = done.length;
  const right = done.filter(isCorrect).length;
  const pct   = total ? right / total * 100 : 0;
  $("#rPct").textContent = Math.round(pct) + "%";
  $("#rRaw").textContent = right + "/" + total + " câu đúng"
    + (pct >= 70 ? " — đạt ngưỡng 700/1000" : " — chưa tới ngưỡng 700/1000");

  const per = {}, perKind = {};
  done.forEach(it => {
    const d = it.src.d, k = it.src.k;
    (per[d]      = per[d]      || { n:0, ok:0 }).n++;
    (perKind[k]  = perKind[k]  || { n:0, ok:0 }).n++;
    if (isCorrect(it)){ per[d].ok++; perKind[k].ok++; }
  });

  const barColor = p => p >= 80 ? "var(--ok)" : p >= 60 ? "var(--accent)" : "var(--bad)";
  const bar = p => '<div class="mini"><i style="width:' + p + "%;background:" + barColor(p) + '"></i></div>';

  const best = load(LS_BEST, {});
  let html = "<tr><th>Phạm vi</th><th class='num'>Đúng</th><th class='num'>%</th><th style='width:120px'></th></tr>";
  Object.keys(per).sort().forEach(d => {
    const p = Math.round(per[d].ok / per[d].n * 100);
    if (per[d].n >= 5 && (!best[d] || p > best[d])) best[d] = p;
    html += "<tr><td>" + DOMAIN_SHORT[d-1] + "</td><td class='num'>" + per[d].ok + "/" + per[d].n
         + "</td><td class='num'>" + p + "%</td><td>" + bar(p) + "</td></tr>";
  });
  $("#rTable").innerHTML = html;
  save(LS_BEST, best);

  const kinds = KIND_ORDER.filter(k => perKind[k]);
  $("#rKind").innerHTML = kinds.length > 1
    ? "<tr><th>Dạng câu hỏi</th><th class='num'>Đúng</th><th class='num'>%</th><th style='width:120px'></th></tr>"
      + kinds.map(k => {
          const p = Math.round(perKind[k].ok / perKind[k].n * 100);
          return "<tr><td>" + KINDLABEL[k] + "</td><td class='num'>" + perKind[k].ok + "/" + perKind[k].n
               + "</td><td class='num'>" + p + "%</td><td>" + bar(p) + "</td></tr>";
        }).join("")
    : "";

  /* ôn lại các câu sai */
  const bad = done.filter(it => !isCorrect(it));
  const rv = $("#rReview");
  rv.innerHTML = "";
  if (!bad.length){
    rv.innerHTML = "<div class='empty'>Không sai câu nào.</div>";
  } else {
    const h = document.createElement("h3");
    h.textContent = "Xem lại " + bad.length + " câu sai";
    rv.appendChild(h);
    bad.forEach(it => {
      const src = it.src, a = answerText(it);
      const d = document.createElement("div");
      d.className = "rev";
      const qq = document.createElement("div");
      qq.className = "qq";
      qq.innerHTML = '<span class="badge kind">' + KINDLABEL[src.k] + "</span>"
        + fmt(src.k === "yesno" ? src.q.solution : src.q.q);
      d.appendChild(qq);
      const mk = (cls, label, text) => {
        const l = document.createElement("div");
        l.className = "line " + cls;
        l.innerHTML = '<span class="tag">' + label + "</span>" + fmt(text);
        d.appendChild(l);
      };
      mk("yours", "Bạn chọn", a.yours);
      mk("right", "Đáp án",   a.right);
      const w = document.createElement("div");
      w.className = "why";
      w.innerHTML = fmt(src.q.e);
      d.appendChild(w);
      const ln = noteLink(src);
      if (ln) d.appendChild(ln);
      rv.appendChild(d);
    });
  }
  $("#reviewWrong").disabled = !bad.length;
  $("#reviewWrong").onclick  = () => start(groupCases(bad.map(it => it.src)));
  renderSetup();
  window.scrollTo({ top:0 });
}

function home(){
  $("#quiz").hidden = true; $("#result").hidden = true; $("#setup").hidden = false;
  renderSetup(); window.scrollTo({ top:0 });
}

/* ---- wiring ---- */
$("#start").onclick = () => start(null);
$("#startWrong").onclick = () => {
  const w = new Set(load(LS_WRONG, []));
  const pool = [...w].map(id => byId.get(id)).filter(Boolean);
  if (!pool.length) return;
  start(groupCases(shuffle(pool)));
};
$("#check").onclick = check;
$("#next").onclick  = next;
$("#quit").onclick  = () => state.list.some(it => it.revealed) ? finish() : home();
$("#again").onclick = home;

document.addEventListener("keydown", e => {
  if ($("#quiz").hidden) return;
  if (e.target.tagName === "SELECT") return;
  const it = state.list[state.i];
  if (e.key >= "1" && e.key <= "9" && isMC(it.src.k)){
    const el = $$("#body .opt")[+e.key - 1];
    if (el && !it.revealed){ el.click(); e.preventDefault(); }
  } else if (it.src.k === "yesno" && !it.revealed && "yn".includes(e.key.toLowerCase())){
    $('#body [data-v="' + (e.key.toLowerCase() === "y" ? 1 : 0) + '"]').click();
  } else if (e.key === "Enter"){
    e.preventDefault();
    it.revealed ? next() : (answered(it) && check());
  }
});

renderSetup();
</script>
</body>
</html>
