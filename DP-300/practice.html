<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DP-300 · Luyện tập</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#646b74; --line:#e2e5ea;
  --accent:#0b6bcb; --accent-soft:#e7f0fb;
  --ok:#127c3f; --ok-soft:#e4f4ea; --bad:#c0392b; --bad-soft:#fbeceb;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --card:#1c2025; --fg:#e6e8ea; --muted:#98a0aa; --line:#2c323a;
    --accent:#5aa9ff; --accent-soft:#16283d;
    --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#331817;
  }
}
:root[data-theme=light]{
  --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#646b74; --line:#e2e5ea;
  --accent:#0b6bcb; --accent-soft:#e7f0fb;
  --ok:#127c3f; --ok-soft:#e4f4ea; --bad:#c0392b; --bad-soft:#fbeceb;
}
:root[data-theme=dark]{
  --bg:#14171a; --card:#1c2025; --fg:#e6e8ea; --muted:#98a0aa; --line:#2c323a;
  --accent:#5aa9ff; --accent-soft:#16283d;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#331817;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
code,kbd,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:7px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

/* setup screen */
.setup{margin-top:16px}
.field{margin-bottom:16px}
.field > label{display:block;font-weight:600;font-size:13px;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}

/* quiz */
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 8px;font-weight:600;font-size:11.5px}
.badge.plain{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.q{font-size:16.5px;font-weight:600;margin:0 0 16px;line-height:1.5;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:transparent;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:1px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed=true] .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.expl{margin-top:14px;padding:13px 15px;border-radius:8px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:14px}
.expl b{display:block;margin-bottom:3px}
.expl.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.expl.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;gap:8px;align-items:center;margin-top:16px}
.hint{color:var(--muted);font-size:12px;margin-top:14px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px}

/* results */
.score{text-align:center;padding:8px 0 4px}
.score b{font-size:44px;letter-spacing:-.03em;display:block;line-height:1.1}
.score span{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.review{margin-top:20px}
.review > h3{font-size:14px;margin:0 0 10px}
.rev{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:9px}
.rev .qq{font-weight:600;margin-bottom:8px;white-space:pre-wrap}
.rev .line{font-size:13.5px;margin:3px 0}
.rev .line .tag{display:inline-block;min-width:56px;color:var(--muted);font-size:12px}
.rev .yours{color:var(--bad)}
.rev .right{color:var(--ok)}
.rev .why{margin-top:8px;font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px}
.note-link{display:inline-block;margin-top:9px;font-size:13px;font-weight:600;
  color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.note-link:hover{border-bottom-color:var(--accent)}
.rev .note-link{margin-top:7px}
header a.top{font-size:13px;color:var(--accent);text-decoration:none}
header a.top:hover{text-decoration:underline}

/* ---------- điện thoại ---------- */
@media (max-width:640px){
  html{-webkit-text-size-adjust:100%}
  .wrap{padding:16px 12px 90px}
  header{gap:8px}
  h1{font-size:18px}
  .card{padding:15px}
  .q{font-size:17px}
  /* vùng chạm tối thiểu 44px cho ngón tay */
  button{min-height:44px}
  header a.top{min-height:44px;display:inline-flex;align-items:center}
  .chip{min-height:44px;display:inline-flex;align-items:center}
  select{min-height:44px;font-size:16px}          /* 16px để iOS không tự phóng to */
  .opt{min-height:52px;padding:13px 14px}
  .note-link{min-height:44px;display:inline-flex;align-items:center}
  .stats{grid-template-columns:repeat(auto-fit,minmax(94px,1fr))}
  /* nội dung dài không được đẩy trang rộng ra */
  table{display:block;overflow-x:auto}
  code{overflow-wrap:anywhere}
  .q,.rev .qq,.expl,.rev .line{overflow-wrap:anywhere}
  .score b{font-size:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DP-300 · Luyện tập</h1>
    <span class="sub" id="qcount"></span>
    <a class="top" href="notes.html">Xem toàn bộ note →</a>
    <span class="spacer"></span>
    <button id="theme" title="Đổi giao diện sáng/tối">◐</button>
  </header>

  <!-- ===== SETUP ===== -->
  <section id="setup" class="setup">
    <div class="card">
      <div class="field">
        <label>Phạm vi (Skills measured)</label>
        <div class="chips" id="domains"></div>
      </div>
      <div class="field">
        <label>Chế độ</label>
        <div class="chips" id="modes">
          <button class="chip" data-mode="study" aria-pressed="true">Học — hiện đáp án ngay</button>
          <button class="chip" data-mode="exam" aria-pressed="false">Thi thử — chấm ở cuối</button>
        </div>
      </div>
      <div class="field">
        <label for="num">Số câu</label>
        <select id="num">
          <option value="20">20 câu</option>
          <option value="40" selected>40 câu</option>
          <option value="60">60 câu</option>
          <option value="0">Tất cả</option>
        </select>
      </div>
      <div class="nav">
        <button class="primary" id="start">Bắt đầu</button>
        <button id="startWrong">Ôn lại câu đã sai (<span id="wrongCount">0</span>)</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quiz" hidden>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="meta">
        <span class="badge" id="mDomain"></span>
        <span class="badge plain" id="mTopic"></span>
        <span class="spacer"></span>
        <span id="mPos"></span>
        <span id="mScore"></span>
      </div>
      <p class="q" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div id="expl"></div>
      <div class="nav">
        <button id="check" class="primary">Kiểm tra</button>
        <button id="next" class="primary" hidden>Câu tiếp →</button>
        <span class="spacer"></span>
        <button id="quit">Kết thúc</button>
      </div>
      <div class="hint">Phím tắt: <kbd>1</kbd>–<kbd>9</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / câu tiếp</div>
    </div>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="result" hidden>
    <div class="card">
      <div class="score">
        <b id="rPct"></b>
        <span id="rRaw"></span>
      </div>
      <table id="rTable"></table>
      <div class="nav" style="margin-top:18px">
        <button class="primary" id="again">Làm lại</button>
        <button id="reviewWrong">Ôn ngay các câu sai</button>
      </div>
    </div>
    <div class="review" id="rReview"></div>
  </section>
</div>

<script>

   a = index đáp án đúng (số = 1 đáp án, mảng = nhiều đáp án)
   e = giải thích
   ============================================================ */

/* Link "đọc thêm" trỏ vào đúng mục của notes.html */
function noteLink(q){
  const id = NOTE_REF[q.d + "|" + q.t];
  if (!id) return null;
  const a = document.createElement("a");
  a.className = "note-link";
  a.href = "notes.html#" + id;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Đọc note: " + q.t + " →";
  return a;
}

const QUESTIONS = [
/* ---------- 1. Plan and implement data platform resources ---------- */
{d:1,t:"Deployment",q:"What is the minimum length of the admin account password when creating an Azure SQL Managed Instance?",

 o:["30%","50%","10%","100%"],a:0,
 e:"Khi tính vCore, Log size = 30% của Data Maximum size."},
{d:1,t:"Azure SQL DB",q:"Which DTU-model tiers CANNOT use Change Data Capture?",
 o:["Basic and Standard S0, S1 and S2 (less than 1 vCore)","Basic only","Premium","They all can"],a:0,
 e:"Basic và Standard S0/S1/S2 có ít hơn 1 vCore nên không dùng được Change Data Capture."},
{d:1,t:"Azure SQL DB",q:"When does Microsoft recommend considering a move from DTUs to vCores?",
 o:["When you exceed 300 DTUs","When you exceed 100 DTUs","When you exceed 1000 DTUs","Never — the two models are independent"],a:0,
 e:"Nên cân nhắc chuyển sang vCore khi > 300 DTU — có thể giảm chi phí, và không có downtime khi chuyển."},
{d:1,t:"Azure SQL DB",q:"After re-scaling a database, which command should you run so that the DMVs report accurate figures?",
 o:["EXEC sp_query_store_flush_db;","DBCC FREEPROCCACHE;","EXEC sp_updatestats;","DBCC DROPCLEANBUFFERS;"],a:0,
 e:"Sau khi re-scale, cần flush Query Store bằng EXEC sp_query_store_flush_db; để DMV có số liệu chính xác."},
{d:1,t:"Azure SQL DB",q:"Which connection policy establishes a connection directly to the database node?",
 o:["Redirect","Proxy","Default","Direct"],a:0,
 e:"Redirect kết nối thẳng tới database node. Proxy đi qua gateway. Default = Redirect nếu từ trong Azure, Proxy nếu từ ngoài."},
{d:1,t:"Azure SQL DB",q:"How many tempdb files does Azure SQL Database create?",
 o:["1 file per vCore, 32 GB per file, capped at 32 files (serverless only)","12 files regardless of the number of vCores","8 files, fixed","A single file"],a:0,
 e:"Azure SQL Database: 1 tempdb file/vCore, 32 GB mỗi file, cap 32 file (chỉ với serverless). Managed Instance thì luôn tạo 12 file."},
{d:1,t:"Azure SQL MI",q:"How many tempdb files does Azure SQL Managed Instance create?",
 o:["12 files, regardless of the number of vCores","1 file per vCore","8 files","32 files"],a:0,
 e:"MI luôn tạo 12 tempdb file bất kể số vCore, khác với Azure SQL Database (1 file/vCore)."},
{d:1,t:"Azure SQL MI",q:"Which feature exists in Azure SQL Managed Instance but NOT in Azure SQL Database?",
 o:["SQL Agent and the msdb database","Automatic tuning","Transparent Data Encryption","Dynamic Data Masking"],a:0,
 e:"MI có cross-database queries, CLR, SQL Agent và msdb — những thứ Azure SQL Database không có."},
{d:1,t:"Azure SQL MI",q:"What are the limits of Azure SQL Managed Instance?",
 o:["Up to 80 vCores, 400 GB memory, 100 databases, 16 TB","Up to 80 vCores, 4 TB memory, 100 TB","Up to 40 vCores, 400 GB memory, unlimited databases","Up to 128 vCores, 1 TB memory, 50 databases"],a:0,
 e:"MI: tối đa 80 vCores, 400 GB memory, tối đa 100 database, database size tối đa 16 TB. MI không hỗ trợ DTU model và không có Hyperscale."},
{d:1,t:"SQL on VM",q:"Which SLA applies to 2+ VM instances placed in 2+ Availability Zones within the same region?",
 o:["99.99%","99.95%","99.9%","99.5%"],a:0,
 e:"99.95% = 2+ instance trong cùng Availability Set (cùng datacenter). 99.99% = 2+ instance trong 2+ Availability Zones (datacenter vật lý khác nhau)."},
{d:1,t:"SQL on VM",q:"What is the SLA for a single-instance VM using Premium SSD or Ultra Disks?",
 o:["99.9%","99.5%","95%","99.99%"],a:0,
 e:"95% = Standard HDD; 99.5% = Standard SSD; 99.9% = Premium SSD hoặc Ultra Disk."},
{d:1,t:"SQL on VM",q:"When SHOULD you choose SQL Server on an Azure VM instead of PaaS?",
 o:["When you need SSAS, SSIS, SSRS or an older version of SQL Server","When you want to minimise administration effort","When you need auto-patching","When you need Hyperscale"],a:0,
 e:"Dùng VM khi cần bản SQL Server cũ, quyền truy cập Windows OS, cần SSAS/SSIS/SSRS, hoặc tính năng không có ở SQL Database / MI."},
{d:1,t:"SQL on VM",q:"How should disk caching be configured for SQL Server files on an Azure VM?",
 o:["ReadOnly for data files, None for log files","ReadWrite for data files, ReadOnly for log files","None for both","ReadWrite for both"],a:0,
 e:"ReadOnly cho data file (đọc từ cache nhanh hơn nhiều so với Azure Blob storage), None cho log file (ghi tuần tự). ReadWrite KHÔNG được dùng cho file SQL Server vì không đảm bảo data consistency."},
{d:1,t:"SQL on VM",q:"Which Storage Spaces resiliency type needs at least 3 physical disks and suits archive and backup?",
 o:["Parity","Mirror","Simple","Striped"],a:0,
 e:"Simple: ≥1 đĩa, không resiliency. Mirror: ≥2 đĩa, dùng cho hầu hết deployment. Parity: ≥3 đĩa, stripe data + parity, dùng cho archive và backup."},
{d:1,t:"SQL on VM",q:"What is the tempdb data file best practice for SQL Server on an Azure VM?",
 o:["One tempdb data file per core, up to 8 files","Always exactly 12 files","A single large file","One file per 4 cores"],a:0,
 e:"Best practice: 1 tempdb data file mỗi core, tối đa 8 file. Tempdb nên đặt trên ổ D (SSD cục bộ)."},
{d:1,t:"SQL on VM",q:"What does the SQL IaaS Agent Extension provide?",
 o:["Automated backup, automated patching and Azure Key Vault integration","Automated backup only","Automatic failover and availability groups","Enhanced Query Store"],a:0,
 e:"SQL IaaS Agent Extension: automated backup, automated patching, Azure Key Vault integration, và hiển thị thông tin cấu hình SQL Server trong Azure Portal."},
{d:1,t:"SQL on VM",q:"Which storage account redundancy should be used for SQL Server on an Azure VM?",
 o:["Locally Redundant Storage (LRS)","Geo-Redundant Storage (GRS)","Read-Access Geo-Redundant Storage","Zone-Redundant Storage is mandatory"],a:0,
 e:"Dùng Local Redundant Storage, không dùng Geo-redundant storage, trên storage account cho SQL Server VM."},
{d:1,t:"SQL on VM",q:"Which VM series is best suited to a relational database server?",
 o:["Memory optimized","Compute optimized","General purpose","Storage optimized"],a:0,
 e:"Memory optimized (high memory, tới 4 TB) tốt cho relational database server, cache vừa-lớn, in-memory analytics."},
{d:1,t:"Compression",q:"Page compression consists of three operations in which order?",
 o:["Row compression, then Prefix compression, then Dictionary compression","Prefix, then Row, then Dictionary","Dictionary, then Prefix, then Row","Row, then Dictionary, then Prefix"],a:0,
 e:"Page compression = Row compression, rồi Prefix compression, rồi Dictionary compression. Page chỉ được nén khi có thể nhét thêm dòng vào page đã đầy."},
{d:1,t:"Compression",q:"Which data types do NOT benefit from row compression?",
 o:["varchar and nvarchar","char and nchar","datetime2","int"],a:0,
 e:"Row compression nén numeric (trừ tinyint), datetime/datetime2/datetimeoffset, char/nchar. varchar và nvarchar không hưởng lợi."},
{d:1,t:"Compression",q:"You CANNOT use data compression on a table with which characteristic?",
 o:["A table with SPARSE columns","A heap (no clustered index)","A table with a nonclustered index","An indexed view"],a:0,
 e:"Không dùng được data compression với bảng có SPARSE columns. Heap, clustered index, nonclustered index và indexed view đều nén được. System table thì không."},
{d:1,t:"Compression",q:"Which stored procedure estimates compression savings but is NOT available on Azure SQL Database?",
 o:["sp_estimate_data_compression_savings","sp_spaceused","sp_helpindex","sp_updatestats"],a:0,
 e:"sp_estimate_data_compression_savings không dùng được trên Azure SQL Database. Tham số Index_ID: 0 = heap, 1 = clustered, >1 = nonclustered, NULL = cả bảng."},
{d:1,t:"Compression",q:"Which T-SQL enables page compression on all partitions of a table?",
 o:["ALTER TABLE Schema.Table REBUILD PARTITION = ALL WITH (DATA_COMPRESSION = PAGE);","ALTER TABLE Schema.Table SET COMPRESSION = PAGE;","ALTER DATABASE SET COMPRESSION = PAGE;","EXEC sp_compress_table 'Schema.Table', 'PAGE';"],a:0,
 e:"ALTER TABLE ... REBUILD PARTITION = 1 | ALL WITH (DATA_COMPRESSION = PAGE | ROW | NONE). Với index thì dùng ALTER INDEX ... REBUILD."},
{d:1,t:"Compression",q:"When is archival compression for columnstore most appropriate?",
 o:["Data that is rarely read but must be retained for regulatory or business reasons","OLTP data that is read and written constantly","Small tables under 1000 rows","Data that must be queried in real time"],a:0,
 e:"Archival compression tiết kiệm dung lượng nhưng chi phí CPU giải nén rất cao, vượt cả phần I/O tiết kiệm được — chỉ dùng cho dữ liệu ít đọc cần lưu giữ."},
{d:1,t:"Migration",q:"You need to migrate an Oracle database to Azure SQL. Which tool should you use?",
 o:["SQL Server Migration Assistant (SSMA)","Data Migration Assistant (DMA)","Database Experimentation Assistant (DEA)","Azure Migrate"],a:0,
 e:"SSMA dùng cho non-SQL objects: Access, DB2, MySQL, Oracle, SAP ASE. DMA dùng cho SQL Server → Azure SQL."},
{d:1,t:"Migration",q:"You need to compare workloads between the source and target SQL Server. Which tool should you use?",
 o:["Database Experimentation Assistant (DEA)","Data Migration Assistant","Azure Migrate","SQL Server Profiler"],a:0,
 e:"DEA capture workload của môi trường SQL Server nguồn, so sánh và phát hiện vấn đề tương thích."},
{d:1,t:"Migration",q:"You need to lift and shift SQL Server to a Virtual Machine and assess your whole data estate. What should you use?",
 o:["Azure Migrate","SSMA","DMA","Azure Data Factory"],a:0,
 e:"Azure Migrate dùng cho lift-and-shift sang VM; nó cũng discover và assess SQL data estate ở quy mô lớn, đưa ra khuyến nghị deployment, sizing và ước tính chi phí."},
{d:1,t:"Migration",q:"Which outbound port does Azure Database Migration Service (DMS) require?",
 o:["443 (HTTPS), and possibly 1434 (UDP)","1433 (TCP) and 3306","80 (HTTP)","5432 and 3306"],a:0,
 e:"DMS cần outbound port 443 (HTTPS), có thể cần 1434 (UDP). Lưu ý: 3306 = MySQL, 5432 = PostgreSQL, 1433 = SQL Server."},
{d:1,t:"Migration",q:"Which permissions are required to run Azure Database Migration Service?",
 o:["CONTROL SERVER on the source and CONTROL DATABASE on the target","sysadmin on both","db_owner on the target","VIEW SERVER STATE on the source"],a:0,
 e:"Cần CONTROL SERVER trên SQL Server nguồn và CONTROL DATABASE trên Azure SQL đích."},
{d:1,t:"Migration",q:"Which backups does Azure DMS use when migrating?",
 o:["Existing full and log backups; it takes no backups itself and does not use differentials","It takes a new full backup itself","Differential backups only","Snapshots only"],a:0,
 e:"DMS không khởi tạo backup nào; nó dùng full và log backup đã có sẵn, KHÔNG dùng differential."},
{d:1,t:"Migration",q:"Which Azure DMS pricing tier allows online (continuous) migration?",
 o:["Premium","Standard","Basic","Free"],a:0,
 e:"Standard miễn phí nhưng chỉ offline (one-off). Premium (~$1 cho 3 giờ) cho phép cả online lẫn offline, tốc độ nhanh hơn."},
{d:1,t:"Migration",q:"In the Data Migration Assistant, which option identifies unsupported features that may block migration?",
 o:["Check database compatibility","Check feature parity","Migration scope: Schema only","Assessment report"],a:0,
 e:"Check database compatibility phát hiện tính năng bị hỗ trợ một phần hoặc không hỗ trợ, có thể chặn migration. Check feature parity đưa ra hướng tiếp cận thay thế."},
{d:1,t:"Migration",q:"After migration you find a query has regressed because of the new compatibility level. What is the most appropriate action?",
 o:["Force the last known good plan","Lower the compatibility level of the whole server to 100","Drop and recreate every index","Switch to the DTU model"],a:0,
 e:"Khi có regression sau khi đổi compatibility level, force last known good plan. Cũng cần kiểm tra parameter sniffing và recompile stored procedure nếu cần."},
{d:1,t:"Migration",q:"What is the correct order of feature completeness, from fewest to most features?",
 o:["Azure SQL Database, then Azure SQL MI, then SQL Server on-premises/VM","SQL Server on-premises, then Azure SQL MI, then Azure SQL Database","Azure SQL MI, then Azure SQL Database, then SQL Server on-premises","They all have the same features"],a:0,
 e:"Azure SQL Database có ít tính năng hơn Azure SQL MI, và MI ít hơn on-prem hoặc Azure VM."},
{d:1,t:"Data Sync",q:"What is required of tables when using Azure SQL Data Sync?",
 o:["Each table must have a primary key, and that primary key cannot be changed","Each table must have a clustered columnstore index","Each table must be smaller than 1 GB","Each table must have Change Data Capture enabled"],a:0,
 e:"Bảng phải có primary key, và PK không thể thay đổi (chỉ có thể xóa rồi tạo lại dòng). Data Sync KHÔNG hoạt động với Azure SQL Managed Instance."},
{d:1,t:"Data Sync",q:"What must the Sync Metadata Database in SQL Data Sync be?",
 o:["An empty Azure SQL Database in the same region as the Hub Database","A Managed Instance in any region","The Hub Database itself","An on-premises SQL Server"],a:0,
 e:"Sync Metadata Database chứa metadata và log; phải là Azure SQL Database cùng region với Hub Database, và nên là database rỗng."},
{d:1,t:"Data Sync",q:"What are the Conflict Resolution Policy options in a Sync Group?",
 o:["Hub wins or Member wins","Newest wins or Oldest wins","Manual or Automatic","Primary wins or Secondary wins"],a:0,
 e:"Chỉ có 'Hub wins' hoặc 'Member wins'. Nếu nhiều member thì kết quả phụ thuộc member nào sync trước."},
{d:1,t:"Migration",q:"What does an SSMS Data-tier Application export produce?",
 o:["A bacpac, containing both schema and data","A dacpac, containing data only","A bak binary backup","A bcp text file"],a:0,
 e:"Export Data-tier Application tạo bacpac (back-up package), archive chứa cả schema lẫn data. sqlpackage.exe cũng tạo bacpac."},
{d:1,t:"Migration",q:"What is the limitation of using the Azure Portal to export/import a bacpac?",
 o:["It is not supported for exporting from or importing into Managed Instance","It does not support Azure SQL Database","It only works for databases under 1 GB","It handles data but not schema"],a:0,
 e:"Azure Portal không hỗ trợ export từ hay import vào MI. Sau khi export ra bacpac có thể dùng SSMS để import vào MI."},
{d:1,t:"Migration",q:"Which PowerShell cmdlet exports an Azure SQL Database to a bacpac?",
 o:["New-AzSqlDatabaseExport","New-AzSqlDatabaseImport","Export-AzSqlDatabase","Backup-AzSqlDatabase"],a:0,
 e:"New-AzSqlDatabaseExport để export, New-AzSqlDatabaseImport để import. Azure CLI dùng az sql db import."},
{d:1,t:"MI copy/move",q:"What is the difference between Copy and Move for databases between two Managed Instances?",
 o:["Copy leaves the original online; Move drops the original afterwards","Copy risks data loss, Move does not","Move is faster because no data is transferred","Copy transfers schema only"],a:0,
 e:"Copy: database gốc vẫn online, không đồng bộ tiếp, cả hai đều read/write được. Move: database gốc bị drop sau đó."},
{d:1,t:"MI copy/move",q:"If a copy/move between two Managed Instances is not completed within what period is it cancelled?",
 o:["24 hours","1 hour","12 hours","7 days"],a:0,
 e:"Nếu không click 'Ready for completion' rồi 'Complete' trong 24 giờ, copy/move bị hủy và database đích bị drop."},
{d:1,t:"Resource",q:"What is the unit price of an eDTU pool compared with DTUs for a single database?",
 o:["1.5 times","The same","2 times","0.5 times"],a:0,
 e:"Unit price cho eDTU pool là 1.5x đơn giá DTU của single database. Còn vCore pool thì cùng đơn giá với single database."},
{d:1,t:"Resource",q:"What is the main difference between a single database and an elastic pool?",
 o:["An elastic pool shares resources and can autoscale; a single database scales manually only","A single database is always cheaper","An elastic pool does not support the vCore model","A single database cannot be moved into a pool"],a:0,
 e:"Single database: cô lập, portable, scale thủ công (không autoscale). Elastic pool: chia sẻ tài nguyên giữa các database, có thể autoscale — tốt khi các database có pattern sử dụng biến động."},

/* ---------- 2. Implement a secure environment ---------- */
{d:2,t:"Authentication",q:"An application runs on a machine that is NOT in Azure and is NOT domain-joined. Which authentication method should it use?",
 o:["A certificate","A managed identity","Passwordless authentication","SQL authentication"],a:0,
 e:"App trên Azure VM → passwordless. App trên máy ngoài Azure có domain-join → managed identity. Máy ngoài Azure không domain-join → certificate. App cũ không đổi được connection string → SQL authentication."},
{d:2,t:"Authentication",q:"According to the decision tree, when should you choose federated authentication?",
 o:["When you want to integrate with an existing federation provider, or you have a sign-in requirement Azure AD does not natively support","When you want Azure AD to handle sign-in entirely in the cloud","In all remaining cases","When you have cloud-only identities"],a:0,
 e:"Cloud-only: Azure AD xử lý sign-in hoàn toàn trên cloud. Federated: tích hợp federation provider có sẵn hoặc yêu cầu đặc biệt. Pass-through: mọi trường hợp còn lại."},
{d:2,t:"Authentication",q:"Which SQL Server authentication method sends the user name and password in plain text?",
 o:["SQL Server authentication","Microsoft Entra ID authentication","Windows authentication","Certificate-based authentication"],a:0,
 e:"SQL Server authentication gửi user name và password dạng plain text. Entra ID (trước là Azure AD) an toàn hơn và có thể sync với on-prem Windows Server AD."},
{d:2,t:"Users & logins",q:"In Azure SQL Database, what is the RECOMMENDED way to create a user from an Entra ID account?",
 o:["CREATE USER [user_name] FROM EXTERNAL PROVIDER, in the target database","CREATE LOGIN ... FROM EXTERNAL PROVIDER then CREATE USER ... FOR LOGIN","Create the user through the Azure Portal","EXEC sp_adduser"],a:0,
 e:"Với Azure SQL Database, best practice là dùng CREATE USER [tên] FROM EXTERNAL PROVIDER trực tiếp trong database. Cách tạo login ở master rồi user cũng chạy được nhưng không phải best practice."},
{d:2,t:"Users & logins",q:"Can database users be created using the Azure Portal?",
 o:["No — database users cannot be created from the Azure Portal","Yes, on the database Security tab","Yes, but only for Managed Instance","Yes, but only contained users"],a:0,
 e:"Database user không tạo được từ Azure Portal, cũng không tạo được SQL Server login từ Portal. Nhưng bạn có thể tạo Azure AD admin ở đó."},
{d:2,t:"Users & logins",q:"Which user type cannot log in, but can still be granted permissions and makes the database more portable?",
 o:["SQL user without login","SQL user with password","SQL user with login","Windows user"],a:0,
 e:"'SQL user without login' không có password, không login được nhưng vẫn được grant permission, và giúp database portable. Được phép trong Azure SQL Database và contained database."},
{d:2,t:"Users & logins",q:"Who is the ONLY principal able to create contained database users based on Azure AD users and groups?",
 o:["A Microsoft Entra ID Administrator for SQL Server","A SQL Server Administrator","db_owner","securityadmin"],a:0,
 e:"Cả SQL Server Admin lẫn Entra ID Admin đều tạo được user từ SQL login và contained user từ SQL auth. Nhưng chỉ Entra ID Administrator mới tạo được contained user dựa trên Azure AD user/group."},
{d:2,t:"Server roles",q:"Which fixed server role allows the BULK INSERT statement to be run?",
 o:["bulkadmin","dbcreator","serveradmin","setupadmin"],a:0,
 e:"bulkadmin chạy BULK INSERT. setupadmin thêm/xóa linked server. diskadmin quản lý disk file. processadmin kết thúc process. dbcreator create/alter/drop/restore database."},
{d:2,t:"Server roles",q:"Which fixed server role can GRANT, DENY and REVOKE server-level permissions?",
 o:["securityadmin","serveradmin","sysadmin","processadmin"],a:0,
 e:"securityadmin GRANT/DENY/REVOKE quyền server-level, và cả quyền database-level nếu có quyền vào database đó — nghĩa là gán được hầu hết quyền server."},
{d:2,t:"Database roles",q:"Which database role can back up the database on MI or a VM (but is not applicable to Azure SQL Database)?",
 o:["db_backupoperator","db_owner","db_ddladmin","db_securityadmin"],a:0,
 e:"db_backupoperator back up được database trên MI hoặc VM. Không áp dụng cho Azure SQL Database vì lệnh BACKUP/RESTORE không có ở đó."},
{d:2,t:"Database roles",q:"What is the notable security characteristic of db_securityadmin?",
 o:["It can modify membership of custom roles only, but it can elevate its own permissions","It can DROP the database","It has full sysadmin rights","It cannot manage permissions at all"],a:0,
 e:"db_securityadmin chỉ sửa role membership cho custom role và quản lý permission — nhưng nó CÓ THỂ tự nâng quyền của chính mình, nên cần cẩn trọng."},
{d:2,t:"Database roles",q:"In Azure SQL Database, which special role exists only in the master database and can create and delete databases?",
 o:["dbmanager","loginmanager","dbcreator","db_owner"],a:0,
 e:"Trong master của Azure SQL Database có 2 role đặc biệt: dbmanager (tạo/xóa database, kết nối như dbo) và loginmanager (tạo/xóa login)."},
{d:2,t:"Permissions",q:"Which statement about DENY is TRUE?",
 o:["DENY overrides any GRANT, but does not apply to sysadmin members or object owners","DENY only applies when the user is not in any role","DENY is always weaker than GRANT","DENY and REVOKE are equivalent"],a:0,
 e:"DENY ghi đè GRANT. DENY không áp dụng cho sysadmin và object owner. Nếu DENY áp lên public role thì mọi non-sysadmin đều mất quyền đó."},
{d:2,t:"Permissions",q:"Why would you use REVOKE instead of DENY?",
 o:["REVOKE removes a granted permission but does not stop the permission being obtained through another role","REVOKE is stronger than DENY","REVOKE also applies to sysadmin","REVOKE automatically re-grants after 24 hours"],a:0,
 e:"REVOKE là ngược lại của GRANT: gỡ quyền đã cấp nhưng KHÔNG chặn quyền có được từ role khác. DENY thì chặn tuyệt đối."},
{d:2,t:"Permissions",q:"Which permission gives ownership-like capability and includes all other permissions, including ALTER, SELECT, INSERT and UPDATE?",
 o:["CONTROL","ALTER","TAKE OWNERSHIP","REFERENCES"],a:0,
 e:"CONTROL cho quyền như owner và bao gồm mọi quyền khác. TAKE OWNERSHIP chỉ cho phép nhận quyền sở hữu chứ không tự động nhận."},
{d:2,t:"Permissions",q:"Which permission is required to create a FOREIGN KEY constraint referencing a table?",
 o:["REFERENCES","CONTROL","ALTER","VIEW DEFINITION"],a:0,
 e:"REFERENCES là quyền tạo FOREIGN KEY constraint. VIEW DEFINITION cho truy cập metadata."},
{d:2,t:"Permissions",q:"How does ownership chaining work?",
 o:["If two objects have the same owner, permissions on the second object called from the first are not separately checked","Every object inherits permissions from the database","Permissions are checked twice for extra security","It only works with system stored procedures"],a:0,
 e:"Ownership chaining: nếu hai object cùng owner, permission ở object thứ hai (được gọi từ object thứ nhất) không bị kiểm tra riêng. Nhờ đó có thể cấp EXECUTE trên stored procedure mà không cần cấp quyền trên bảng bên dưới."},
{d:2,t:"Permissions",q:"Which syntax grants SELECT on a single COLUMN?",
 o:["GRANT SELECT ON OBJECT::Customer(CustomerName) TO Phillip;","GRANT SELECT ON COLUMN::CustomerName TO Phillip;","GRANT SELECT(CustomerName) ON Customer TO Phillip;","GRANT COLUMN SELECT ON Customer.CustomerName TO Phillip;"],a:0,
 e:"Cú pháp cột: GRANT SELECT ON OBJECT::Table(Column) TO Principal. SECURABLE có thể là OBJECT::, SCHEMA::, DATABASE:: hoặc SERVER::."},
{d:2,t:"Permissions",q:"Which option allows the grantee to grant that permission on to others?",
 o:["WITH GRANT OPTION","WITH DELEGATION","AS OWNER","WITH CASCADE"],a:0,
 e:"[WITH GRANT OPTION] cho phép principal cấp lại quyền đó cho người khác."},
{d:2,t:"Permissions",q:"Which function checks your own current permissions at database level?",
 o:["SELECT * FROM sys.fn_my_permissions (NULL, 'DATABASE')","SELECT * FROM sys.database_principals","EXEC sp_helprole","SELECT * FROM sys.server_principals"],a:0,
 e:"fn_my_permissions(NULL,'DATABASE') cho quyền của login; fn_my_permissions('DBName','DATABASE') cho quyền của user; fn_builtin_permissions(default) liệt kê tất cả permission."},
{d:2,t:"Permissions",q:"How can you TEST another user's permissions?",
 o:["EXECUTE AS USER = 'user_name' ... then REVERT","EXEC sp_test_permissions 'user_name'","SET USER = 'user_name'","GRANT IMPERSONATE TO SELF"],a:0,
 e:"Dùng EXECUTE AS USER = 'tên' (hoặc EXECUTE AS LOGIN nếu là sysadmin trên MI/VM), rồi REVERT để quay lại. Cũng có thể tạo procedure WITH EXECUTE AS user_name."},
{d:2,t:"Permissions",q:"Which stored procedures are NOT available on Azure SQL Database?",
 o:["sp_helprotect and sp_helprolemember","sp_helprole","sp_executesql","sp_rename"],a:0,
 e:"sp_helprotect (quyền của user trên object) và sp_helprolemember (thành viên trực tiếp của role) không có trên Azure SQL Database. sp_helprole thì có."},
{d:2,t:"Custom roles",q:"Which statement adds a user to a database role?",
 o:["ALTER ROLE db_datareader ADD MEMBER database_principal","EXEC sp_addrolemember 'db_datareader', 'user'","GRANT ROLE db_datareader TO user","CREATE ROLE db_datareader FOR user"],a:0,
 e:"ALTER ROLE <role> ADD MEMBER <principal> (hoặc DROP MEMBER). Cần quyền ALTER trên role, hoặc ALTER ANY ROLE, hoặc db_securityadmin / db_owner."},
{d:2,t:"Certificates",q:"If CREATE CERTIFICATE omits ENCRYPTION BY PASSWORD, what encrypts the private key?",
 o:["The database master key","The service master key","Nothing — it is unencrypted","An Azure Key Vault key"],a:0,
 e:"Nếu không dùng ENCRYPTION BY PASSWORD, private key được mã hóa bằng database master key. Certificate mặc định lưu ở database master."},
{d:2,t:"Certificates",q:"If no dates are specified in CREATE CERTIFICATE, what is the default EXPIRY_DATE?",
 o:["One year after START_DATE","One month after START_DATE","It never expires","10 years"],a:0,
 e:"START_DATE mặc định là ngày hiện tại (UTC), EXPIRY_DATE mặc định là một năm sau START_DATE."},
{d:2,t:"Certificates",q:"What can ALTER CERTIFICATE change?",
 o:["The private key password, but not the SUBJECT or the dates","The SUBJECT and EXPIRY_DATE","Only the EXPIRY_DATE","Every property"],a:0,
 e:"ALTER CERTIFICATE ... WITH PRIVATE KEY (ENCRYPTION BY PASSWORD = ...) đổi được password, nhưng không đổi được SUBJECT hay các DATE."},
{d:2,t:"TDE",q:"How does TDE differ from TLS?",
 o:["TDE encrypts data at rest at page level; TLS encrypts data in transit","TDE encrypts in transit; TLS encrypts at rest","Both encrypt data at rest","TDE encrypts individual columns, TLS encrypts individual tables"],a:0,
 e:"TDE mã hóa/giải mã ở mức page khi ghi/đọc — dữ liệu at rest. TLS (Transport Layer Security) mã hóa dữ liệu khi truyền."},
{d:2,t:"TDE",q:"At which level is TDE set for Azure SQL Database?",
 o:["At server level; new databases are encrypted by default, except those created by restore or database copy","At database level, enabled manually for each one","At subscription level","At elastic pool level"],a:0,
 e:"Với Azure SQL Database, TDE đặt ở server level; database mới mã hóa mặc định NHƯNG database tạo qua restore hoặc database copy thì không. Với MI thì đặt ở instance level."},
{d:2,t:"TDE",q:"Which statement is TRUE about enabling TDE for Azure SQL Managed Instance?",
 o:["It cannot be enabled from the Azure Portal; use T-SQL ALTER DATABASE ... SET ENCRYPTION ON","It can only be enabled from the Azure Portal","MI does not support TDE","It is always on and cannot be disabled"],a:0,
 e:"Với MI không dùng Portal được — dùng ALTER DATABASE ... SET ENCRYPTION ON/OFF. Lưu ý: không thể đổi TDE protector sang key trong Key Vault bằng T-SQL."},
{d:2,t:"TDE",q:"Which type of database can TDE NOT encrypt?",
 o:["System databases","Databases larger than 1 TB","Databases in an elastic pool","Databases using the Full recovery model"],a:0,
 e:"TDE không mã hóa được system database. Nó dùng symmetric Database Encryption Key (DEK), được bảo vệ bởi TDE protector (service-managed certificate hoặc asymmetric key trong Key Vault)."},
{d:2,t:"Firewall",q:"In what order are firewall rules checked in Azure SQL Database?",
 o:["Database rules are checked BEFORE server-level rules","Server-level rules first, then database rules","Only server-level rules are checked","Both in parallel — whichever blocks first wins"],a:0,
 e:"Database rule được kiểm tra trước server-level rule. Server-level rule cho phép truy cập tất cả database; database rule dành cho một user/app cụ thể."},
{d:2,t:"Firewall",q:"How are database-level firewall rules created?",
 o:["Only with T-SQL, and CONTROL DATABASE permission is required","Only through the Azure Portal","With PowerShell or the Portal","With Azure CLI"],a:0,
 e:"Database firewall rule chỉ tạo được bằng T-SQL (sp_set_database_firewall_rule) và cần CONTROL DATABASE. Phải có server-level firewall rule trước đó."},
{d:2,t:"Firewall",q:"What does a firewall rule of 0.0.0.0 mean?",
 o:["It lets all Azure services bypass the server-level firewall rule","It blocks all access","It allows every IP address on the internet","It allows localhost only"],a:0,
 e:"Rule 0.0.0.0 cho phép mọi Azure service bypass server-level firewall — trong Portal thì tương ứng bật 'Allow Azure services and resources to access this server'."},
{d:2,t:"Firewall",q:"Where are server-level firewall rules for Azure SQL Database stored?",
 o:["In the master database","In the msdb database","In each individual database","In Azure Resource Manager"],a:0,
 e:"Server-level rule lưu ở master (xem qua sys.firewall_rules). Database-level rule lưu trong chính database đó (sys.database_firewall_rules)."},
{d:2,t:"Always Encrypted",q:"Which Always Encrypted encryption type allows equality joins, GROUP BY, indexes and DISTINCT?",
 o:["Deterministic","Randomized","Symmetric","Asymmetric"],a:0,
 e:"Deterministic cho phép equality join, GROUP BY, index và DISTINCT; yêu cầu collation _BIN2 với chuỗi (ví dụ Latin1_General_BIN2). Randomized ngăn tất cả những thao tác đó."},
{d:2,t:"Always Encrypted",q:"When connecting to a database with Always Encrypted columns, which parameter must be added in SSMS?",
 o:["Column Encryption Setting=enabled","Always Encrypted=true","Encrypt=strict","Trusted_Connection=yes"],a:0,
 e:"Trong tab 'Additional Connection Parameters', nhập: Column Encryption Setting=enabled."},
{d:2,t:"Always Encrypted",q:"If the Security Administrator and the DBA are TWO different people, which tool must be used to configure Always Encrypted?",
 o:["PowerShell only","SSMS only","Either SSMS or PowerShell","The Azure Portal only"],a:0,
 e:"Nếu cần role separation (Security Admin giữ key nhưng không truy cập database; DBA quản metadata nhưng không giữ key) thì chỉ dùng được PowerShell. Nếu cùng một người thì SSMS hoặc PowerShell đều được."},
{d:2,t:"Always Encrypted",q:"Which permission is required to create or delete a column encryption key?",
 o:["ALTER ANY COLUMN ENCRYPTION KEY","ALTER ANY COLUMN MASTER KEY","VIEW ANY COLUMN ENCRYPTION KEY DEFINITION","CONTROL DATABASE"],a:0,
 e:"ALTER ANY COLUMN MASTER KEY để tạo/xóa column master key; ALTER ANY COLUMN ENCRYPTION KEY cho column encryption key; VIEW ANY ... DEFINITION để đọc metadata."},
{d:2,t:"Secure enclaves",q:"What is the main difference between a VBS enclave and an Intel SGX enclave?",
 o:["VBS does not require Microsoft Azure Attestation; SGX requires Attestation and a DC-series database","VBS provides stronger security isolation","SGX needs no special hardware","VBS is only available on SQL Server 2016"],a:0,
 e:"Intel SGX cần Azure SQL Database DC-series và Microsoft Azure Attestation. VBS có ở mọi phiên bản Azure SQL Database (kể cả Elastic Pool) và SQL Server 2019+, không cần Attestation — nhưng cách ly bảo mật yếu hơn SGX."},
{d:2,t:"Secure enclaves",q:"After enabling 'Enable secure enclaves' on a database, can you turn it off again?",
 o:["No — it cannot be switched off once it has been switched on","Yes, at any time in the Portal","Yes, but only using T-SQL","Yes, but the database must be restarted"],a:0,
 e:"Không thể chuyển 'Enable secure enclaves' về Off sau khi đã bật On."},
{d:2,t:"Dynamic Data Masking",q:"What is the default mask value for date and time data types in Dynamic Data Masking?",
 o:["01-01-1900","0","XXXX","NULL"],a:0,
 e:"Default value: XXXX cho string, 0 cho numeric, 01-01-1900 cho date/time."},
{d:2,t:"Dynamic Data Masking",q:"Who is ALWAYS excluded from Dynamic Data Masking?",
 o:["Administrators — they can always read the real data","db_datareader members","Nobody","Only users with the UNMASK permission"],a:0,
 e:"Administrator luôn được loại trừ khỏi DDM. Ngoài ra có thể chỉ định user cụ thể (phân cách bằng dấu chấm phẩy) hoặc dùng GRANT UNMASK."},
{d:2,t:"Dynamic Data Masking",q:"Which T-SQL applies an email mask to a column?",
 o:["ALTER TABLE ... ALTER COLUMN col ADD MASKED WITH (FUNCTION = 'email()')","ALTER COLUMN col SET MASK = 'email'","CREATE MASK ON col WITH email()","EXEC sp_add_mask 'col', 'email'"],a:0,
 e:"ALTER TABLE Schema.Table ALTER COLUMN ColumnName ADD MASKED WITH (FUNCTION = 'email()') — hoặc 'default()', 'random(1,1000)', 'partial(1,\"xxxxx\",1)'."},
{d:2,t:"Private Link",q:"A Private Endpoint must be in the same region as which component?",
 o:["The Virtual Network — the target service may be in a different region","The Azure SQL Database","Both the Virtual Network and the target service","The subscription"],a:0,
 e:"Private Endpoint phải cùng region với Virtual Network, nhưng KHÔNG cần cùng region với service nó kết nối tới. Toàn bộ traffic đi qua mạng Microsoft, không qua public internet."},
{d:2,t:"Private Link",q:"When creating a Private Endpoint for Azure SQL Database, which target sub-resource should you select?",
 o:["sqlServer","sqlDatabase","managedInstance","sqlPool"],a:0,
 e:"Trong tab Resource, chọn target sub-resource là 'sqlServer'."},
{d:2,t:"TLS",q:"Which TLS version is the most commonly used, uses SHA-256, and is considered to create a secure connection?",
 o:["TLS 1.2","TLS 1.0","TLS 1.1","TLS 1.3"],a:0,
 e:"TLS 1.2 (2008) dùng SHA-256, độ tin cậy và hiệu năng tốt hơn — là bản phổ biến nhất. TLS 1.3 (2018) kết nối nhanh hơn. TLS 1.0/1.1 đã bị deprecate rộng rãi khoảng 2020."},
{d:2,t:"TLS",q:"Where do you configure the minimum TLS version for Azure SQL in the Portal?",
 o:["SQL Server (not the database) – Security – Networking – Connectivity","Database – Security – Transparent data encryption","Subscription – Policies","Resource group – Settings"],a:0,
 e:"Vào SQL Server (không phải database) – Security – Networking – Connectivity – đổi 'Minimum TLS version'. Hoặc Set-AzSqlServer -MinimalTlsVersion, hoặc az sql server update --set minimalTlsVersion."},
{d:2,t:"Classification",q:"Which roles can MODIFY a database's data classification?",
 o:["Owner, Contributor and SQL Security Manager","Reader and User Access Administrator","Owner only","db_datareader"],a:0,
 e:"Owner, Contributor và SQL Security Manager sửa và đọc được. Reader và User Access Administrator chỉ ĐỌC được, không sửa."},
{d:2,t:"Classification",q:"Which T-SQL adds a sensitivity classification to a column?",
 o:["ADD SENSITIVITY CLASSIFICATION TO schema.table.column WITH (LABEL=..., INFORMATION_TYPE=..., RANK=...)","ALTER TABLE ... ADD CLASSIFICATION","EXEC sp_add_classification","CREATE SENSITIVITY LABEL"],a:0,
 e:"ADD SENSITIVITY CLASSIFICATION TO ... WITH (LABEL, INFORMATION_TYPE, RANK). RANK có thể là NONE, LOW, MEDIUM, HIGH, CRITICAL. Kiểm tra bằng sys.sensitivity_classifications."},
{d:2,t:"Classification",q:"Which rule must be followed when creating a classification?",
 o:["You cannot select [n/a] for BOTH the Information Type and the Sensitivity Label","You must select [n/a] for at least one of the two","The Sensitivity Label is optional","The Information Type must always be Financial"],a:0,
 e:"Bạn không thể chọn [n/a] cho cả Information Type và Sensitivity Label cùng lúc."},
{d:2,t:"Auditing",q:"Which action groups does the default Azure SQL auditing policy include?",
 o:["BATCH_COMPLETED_GROUP, SUCCESSFUL_ and FAILED_DATABASE_AUTHENTICATION_GROUP","FAILED_DATABASE_AUTHENTICATION_GROUP only","DDL_DATABASE_LEVEL_EVENTS","SCHEMA_OBJECT_ACCESS_GROUP"],a:0,
 e:"Default policy: BATCH_COMPLETED_GROUP (mọi query và stored procedure) + SUCCESSFUL_/FAILED_DATABASE_AUTHENTICATION_GROUP (login thành công/thất bại). Lưu tối đa 4.000 ký tự mỗi audit."},
{d:2,t:"Auditing",q:"Which type of blob are Azure SQL audit logs written to?",
 o:["Append Blobs","Block Blobs","Page Blobs","Table storage"],a:0,
 e:"Audit được ghi vào Append Blob trong Blob storage. Không hỗ trợ premium storage hay hierarchical namespace."},
{d:2,t:"Auditing",q:"What does Microsoft recommend regarding server-level versus database-level auditing?",
 o:["Use server-level auditing only, unless you need to audit different event types for a specific database","Always use both for better coverage","Use database-level auditing only","Avoid server-level auditing because of the cost"],a:0,
 e:"Server policy audit luôn áp cho database bất kể database-level policy — hai cái chạy song song. Microsoft khuyến nghị CHỈ dùng server-level trừ khi cần audit loại sự kiện khác cho một database riêng."},
{d:2,t:"Auditing",q:"Which T-SQL function reads an audit file?",
 o:["sys.fn_get_audit_file ('NameOfFile.sqlaudit', default, default)","sys.dm_audit_actions","sys.fn_read_audit","sp_get_audit_log"],a:0,
 e:"SELECT * FROM sys.fn_get_audit_file('file.sqlaudit', default, default). Trong SSMS có thể dùng File – Open – Merge Audit Files."},
{d:2,t:"Change Tracking",q:"How does Change Tracking differ from Change Data Capture (CDC)?",
 o:["Change Tracking records only that a column changed and keeps no historic data; CDC tracks historic data","Change Tracking keeps historic data, CDC does not","Both keep historic data","Change Tracking is heavier than CDC"],a:0,
 e:"Change Tracking nhẹ hơn, ít storage hơn: chỉ biết dòng nào/cột nào đã đổi, KHÔNG xem được dữ liệu trước đó. CDC theo dõi cả dữ liệu lịch sử."},
{d:2,t:"Change Tracking",q:"What is the default retention period for Change Tracking?",
 o:["2 days","1 hour","7 days","30 days"],a:0,
 e:"Mặc định 2 Days. Tối thiểu là 1 Minute, không có giá trị tối đa. AUTO_CLEANUP quyết định có tự xóa dữ liệu quá hạn hay không."},
{d:2,t:"Change Tracking",q:"What must you do first in order to disable Change Tracking at database level?",
 o:["Disable change tracking on all tables first","Put the database in SINGLE_USER mode","Take a transaction log backup","Nothing — it can be disabled directly"],a:0,
 e:"Muốn tắt ở cấp database, phải tắt change tracking trên toàn bộ các bảng trước (ALTER TABLE ... DISABLE CHANGE_TRACKING)."},
{d:2,t:"CDC",q:"What is the minimum resource requirement to use Change Data Capture on Azure SQL Database?",
 o:["At least 1 vCore or 100 DTUs/eDTUs","At least 2 vCores","Any tier, including Basic","Premium tier only"],a:0,
 e:"CDC cần tối thiểu 1 vCore hoặc 100 DTU/eDTU. Không dùng được trên Free, Basic hay Standard S0/S1/S2, và không dùng được trên Elastic Pool có vCore < 1 hoặc eDTU < 100."},
{d:2,t:"CDC",q:"In CDC, what does _$operation = 2 mean?",
 o:["Insert","Delete","Update (before image)","Update (after image)"],a:0,
 e:"_$operation: 1 = delete, 2 = insert, 3 hoặc 4 = update."},
{d:2,t:"CDC",q:"Before enabling CDC on a table, what must you do and which permission is required?",
 o:["Run EXEC sys.sp_cdc_enable_db, which requires sysadmin","Run sp_cdc_enable_table first, requiring db_owner","Enable Change Tracking first","Enable snapshot isolation"],a:0,
 e:"Phải chạy EXEC sys.sp_cdc_enable_db trước (cần sysadmin), chỉ dùng cho user database. Sau đó mới sp_cdc_enable_table. Cả hai trả về 0 = thành công, 1 = thất bại."},
{d:2,t:"Ledger",q:"When is a block closed in the Azure SQL Database ledger?",
 o:["After 30 seconds or 100,000 transactions","After 60 seconds or 10,000 transactions","After every transaction","After 5 minutes"],a:0,
 e:"Root hash được lưu trong block; block đóng sau 30 giây hoặc 100.000 transaction. Block được hash cùng root hash của block trước, tạo thành blockchain. Hash của block mới nhất gọi là 'database digest'."},
{d:2,t:"Ledger",q:"What characterises an append-only ledger table?",
 o:["Only inserts are allowed; updates and deletes are denied even for sysadmins, and no history table is created","Updates are allowed but deletes are not","It creates a history table like an updatable ledger table","It is only available on SQL Server 2019"],a:0,
 e:"Append-only: chỉ INSERT. Update/delete bị từ chối ngay cả với sysadmin/DBA. Không có history table (vì không có update/delete), chỉ thêm 2 cột GENERATED ALWAYS."},
{d:2,t:"Ledger",q:"Can you convert an existing non-ledger table into a ledger table?",
 o:["No — you must create a new ledger table and copy the data across","Yes, using ALTER TABLE ... SET LEDGER = ON","Yes, but only for empty tables","Yes, automatically when the ledger database is enabled"],a:0,
 e:"Không convert được. Phải tạo ledger table mới, copy dữ liệu (sp_copy_data_in_batches, SELECT INTO hoặc BULK INSERT), rồi đổi tên. sp_copy_data_in_batches chia thành batch 10.000-100.000 dòng chạy song song."},
{d:2,t:"Ledger",q:"What does Microsoft recommend for querying the change history of an updatable ledger table?",
 o:["The ledger view, which joins the table with its history table","The history table directly","sys.database_ledger_transactions","Temporal table syntax"],a:0,
 e:"Microsoft khuyến nghị dùng ledger view thay vì đọc trực tiếp history table. View hiển thị transaction ID và loại thao tác (UPDATE = cả DELETE lẫn INSERT)."},
{d:2,t:"RLS",q:"In Row-Level Security, which operations does a FILTER PREDICATE apply to?",
 o:["SELECT (and it affects UPDATE and DELETE)","INSERT","DELETE only","DDL statements"],a:0,
 e:"FILTER PREDICATE lọc dòng được đọc (SELECT, UPDATE, DELETE). BLOCK PREDICATE chặn ghi (AFTER INSERT/AFTER UPDATE cho dữ liệu mới; BEFORE UPDATE/BEFORE DELETE cho dữ liệu hiện có)."},
{d:2,t:"RLS",q:"What form must a Row-Level Security function take?",
 o:["An inline table-valued function returning 1 when the user may see the row","A scalar function returning BIT","A stored procedure returning a recordset","A multi-statement table-valued function"],a:0,
 e:"RLS dùng inline table-valued function (thường WITH SCHEMABINDING), trả về 1 khi user được xem dòng. Cần cấp SELECT trên function. Nên đặt các object RLS ở schema riêng."},
{d:2,t:"RLS",q:"Which permission is required to create a security policy for Row-Level Security?",
 o:["ALTER ANY SECURITY POLICY, plus SELECT and REFERENCES on the functions and target tables","CONTROL DATABASE","db_securityadmin","ALTER ANY SCHEMA"],a:0,
 e:"Cần ALTER ANY SECURITY POLICY, cộng SELECT và REFERENCES trên các function, bảng và cột liên quan."},
{d:2,t:"RLS",q:"From which version is Row-Level Security available?",
 o:["SQL Server 2016 or later, and Azure SQL Database","SQL Server 2012 or later","Azure SQL Database only","SQL Server 2019 or later"],a:0,
 e:"RLS có từ SQL Server 2016 trở lên và trên Azure SQL Database."},
{d:2,t:"Defender",q:"What does Microsoft Defender for SQL / Advanced Threat Protection alert you about?",
 o:["Suspicious database activities, potential vulnerabilities and SQL injection attacks","Failed logins only","Cost overruns only","Query performance only"],a:0,
 e:"Advanced Threat Protection cảnh báo về hoạt động đáng ngờ (kể cả access và query pattern bất thường), lỗ hổng, và SQL injection. Tích hợp với Microsoft Defender for Cloud kèm hành động khuyến nghị."},
{d:2,t:"Vulnerability",q:"In a Vulnerability Assessment, what does 'Approve as Baseline' do?",
 o:["Similar future results are placed in the Passed section","It disables the rule permanently","It deletes the result from the report","It automatically remediates the vulnerability"],a:0,
 e:"'Approve as Baseline' đưa các kết quả tương tự vào mục 'Passed'. Muốn bỏ hẳn rule thì dùng 'Disable rule'. Kết quả có thể export ra Excel."},
{d:2,t:"Purview",q:"What are the three main elements of Azure Purview Studio?",
 o:["Data Map, Data Catalog and Data Insights","Data Factory, Data Lake and Data Explorer","Data Map, Data Flow and Data Sync","Scanner, Classifier and Reporter"],a:0,
 e:"Data Map thu thập metadata bằng cách scan và classify; Data Catalog giúp tìm dữ liệu qua bộ lọc classification/metadata; Data Insights cho thấy dữ liệu nhạy cảm ở đâu và luân chuyển thế nào."},
{d:2,t:"Key Vault",q:"When creating a Key Vault for Azure VM disk encryption, which access policy must be enabled?",
 o:["Azure Disk Encryption for volume encryption","Azure Backup","Azure Resource Manager for template deployment","Azure Virtual Machines for deployment"],a:0,
 e:"Trong tab Access Policies, bật 'Enable Access to: Azure Disk Encryption for volume encryption'. Sau khi tạo Key Vault, để trống ô Key, click Select rồi Save."},

/* ---------- 3. Monitor, configure and optimize database resources ---------- */
{d:3,t:"Baseline",q:"At what frequency, and over what period, does sys.dm_db_resource_stats return data?",
 o:["One row every 15 seconds, for roughly the past hour","One row per minute, for the past 24 hours","One row per hour, retained for 90 days","One row every 5 seconds, for 30 minutes"],a:0,
 e:"sys.dm_db_resource_stats cho CPU, IO, memory — một dòng mỗi 15 giây cho khoảng 1 giờ qua. Với MI dùng sys.server_resource_stats."},
{d:3,t:"Baseline",q:"Which view gives an HOURLY summary of resource usage and retains 90 days of history?",
 o:["sys.resource_usage (or sys.resource_stats in master)","sys.dm_db_resource_stats","sys.dm_os_performance_counters","sys.dm_exec_requests"],a:0,
 e:"sys.resource_usage cho tổng hợp theo giờ, giữ lịch sử 90 ngày (hiện đang ở trạng thái preview). sys.dm_db_resource_stats chỉ giữ ~1 giờ."},
{d:3,t:"Metrics",q:"How many days can Metrics Explorer show at once, and how far back can you go?",
 o:["Up to 30 days at once, going back up to 93 days","Up to 7 days at once, going back 30 days","Up to 90 days at once, going back 1 year","There is no limit"],a:0,
 e:"Metrics Explorer hiển thị tối đa 30 ngày cùng lúc, dùng mũi tên trái/phải để lùi tới 93 ngày trong quá khứ."},
{d:3,t:"Metrics",q:"What is the fundamental difference between Metrics and Logs in Azure Monitor?",
 o:["Metrics are numerical time-series values, lightweight and suited to near real-time alerting; Logs are events that may contain non-numerical data","Metrics hold text and Logs hold numbers","Metrics can only be viewed through Log Analytics","Logs are faster than Metrics"],a:0,
 e:"Metrics: giá trị số thu thập đều đặn, lưu trong time-series database, nhẹ, cho phép alert gần realtime. Logs: sự kiện, có thể chứa dữ liệu phi số, có cấu trúc hoặc tự do — xem trong Log Analytics."},
{d:3,t:"Metrics",q:"What happens if xtp_storage_percent (In-Memory OLTP storage) reaches 100%?",
 o:["INSERT, UPDATE, ALTER and CREATE operations fail; SELECT and DELETE still work","The whole database goes offline","Only SELECT operations fail","The database scales up automatically"],a:0,
 e:"Khi xtp_storage_percent chạm 100%, các thao tác INSERT, UPDATE, ALTER, CREATE sẽ fail; SELECT và DELETE vẫn hoạt động. Trả về 0 nếu không dùng In-Memory OLTP."},
{d:3,t:"Metrics",q:"What does max_worker_percent measure?",
 o:["Maximum concurrent requests divided by the service tier limit","The percentage of CPU in use","Maximum concurrent sessions divided by the limit","The number of idle worker threads"],a:0,
 e:"max_worker_percent = số concurrent request tối đa / giới hạn service tier. max_session_percent = số concurrent session tối đa / giới hạn."},
{d:3,t:"Metrics",q:"Data space used percent is running high. Which actions are appropriate?",
 o:["Upgrade the service tier, shrink the database, or scale out using sharding","Only upgrading the service tier is possible","Increase MAXDOP","Enable Query Store"],a:0,
 e:"Khi Data space used percent cao: nâng service tier, shrink database, hoặc scale out bằng sharding. Nếu đang trong elastic pool, cân nhắc chuyển database ra khỏi pool."},
{d:3,t:"Query Perf Insight",q:"What does Query Performance Insight (Intelligent Performance) let you see?",
 o:["Top queries by CPU, duration or execution count, plus details of individual queries","Deadlocks only","Firewall configuration","Backup history"],a:0,
 e:"Query Performance Insight: top CPU-consuming query, chi tiết từng query, top query theo Duration hoặc Execution Count, kèm biểu tượng performance recommendation."},
{d:3,t:"SQL Insights",q:"Which configuration does SQL Insights NOT support?",
 o:["Azure SQL Database with elastic pools, or the Basic, S0, S1 and S2 tiers","Azure SQL Managed Instance","SQL Server on Azure VMs","SQL Server 2012 or later"],a:0,
 e:"SQL Insights không hỗ trợ Azure SQL Database dùng elastic pool hoặc tier Basic/S0/S1/S2. Nó cũng không hỗ trợ monitor nhiều hơn 1 secondary replica mỗi database, và không hỗ trợ Azure AD authentication."},
{d:3,t:"SQL Insights",q:"How many monitoring VMs does Microsoft recommend per number of connection strings?",
 o:["One Standard_B2s VM for every 100 connection strings","One VM for every 10 connection strings","One VM for every 1000 connection strings","No VM is required"],a:0,
 e:"Khuyến nghị 1 VM Standard_B2s (2 CPU, 4 GB, Ubuntu 18.04) cho mỗi 100 connection string. Dữ liệu lưu vào Log Analytics workspace."},
{d:3,t:"SQL Insights",q:"Which permission must be granted to the SQL Insights user on Azure SQL Database?",
 o:["GRANT VIEW DATABASE STATE","GRANT VIEW SERVER STATE","GRANT CONTROL DATABASE","db_owner membership"],a:0,
 e:"Với Azure SQL Database: tạo user trong database liên quan (không phải master) và GRANT VIEW DATABASE STATE. Với MI và SQL Server VM: GRANT VIEW SERVER STATE và VIEW ANY DEFINITION."},
{d:3,t:"Database watcher",q:"Where does database watcher store its data?",
 o:["An Azure Data Explorer cluster, or Real-Time Analytics in Microsoft Fabric","A Log Analytics workspace","Azure Blob Storage","The monitored database itself"],a:0,
 e:"Database watcher lưu vào Azure Data Explorer cluster hoặc Real-Time Analytics trong Fabric. Truy vấn bằng KQL (Kusto) hoặc T-SQL; xem trong ADX dashboard, Power BI, Grafana, Excel."},
{d:3,t:"Database watcher",q:"How is database watcher charged?",
 o:["Creating watchers and dashboards is free; you only pay for storage","Per monitored resource","Per user","It is completely free"],a:0,
 e:"Tạo watcher và dashboard là miễn phí, không tính theo resource hay theo user — nhưng phải trả tiền storage."},
{d:3,t:"Query Store",q:"How many stores does Query Store contain, and which are they?",
 o:["3: the plan store, the runtime stats store and the wait stats store","2: the plan store and the runtime stats store","4: plan, runtime, wait and error stores","1: the plan store"],a:0,
 e:"Query Store gồm 3 store: Plan store (execution plan), Runtime stats store (thống kê thực thi), Wait stats store."},
{d:3,t:"Query Store",q:"What is the default state of Query Store?",
 o:["Disabled for new SQL Server databases, enabled for new Azure SQL Databases","Enabled for both","Disabled for both","Enabled only once the database exceeds 1 GB"],a:0,
 e:"Query Store TẮT mặc định với database SQL Server mới (ví dụ trên VM), nhưng BẬT mặc định với Azure SQL Database mới."},
{d:3,t:"Query Store",q:"What happens when Query Store reaches MAX_STORAGE_SIZE_MB?",
 o:["It switches to read-only, stops collecting new data and becomes stale","It grows its allocation automatically","It deletes all data and starts again","The database becomes read-only"],a:0,
 e:"Khi chạm giới hạn, Query Store chuyển read-only và ngừng thu thập — dữ liệu trở nên stale. Kiểm tra bằng sys.database_query_store_options; readonly_reason = 65536 nghĩa là đã chạm MAX_STORAGE_SIZE_MB."},
{d:3,t:"Query Store",q:"With SIZE_BASED_CLEANUP_MODE = AUTO, when does cleanup start and when does it stop?",
 o:["It starts at about 90% of MAX_STORAGE_SIZE_MB and stops at about 80%","It starts at 100% and stops at 50%","It starts at 75% and stops at 25%","It runs every 24 hours regardless of size"],a:0,
 e:"Khi dữ liệu đạt ~90% MAX_STORAGE_SIZE_MB, cleanup bắt đầu, xóa dữ liệu cũ nhất/ít tốn kém nhất, dừng khi còn ~80%."},
{d:3,t:"Query Store",q:"In sys.database_query_store_options, what does actual_state = 2 mean?",
 o:["READ_WRITE","READ_ONLY","OFF","ERROR"],a:0,
 e:"actual_state = 2 là READ_WRITE, = 1 là READ_ONLY."},
{d:3,t:"Query Store",q:"What is the default QUERY_CAPTURE_MODE in SQL Server 2019 and Azure SQL?",
 o:["AUTO — it ignores infrequent queries and those with small compile/execution times","ALL — it captures every query","NONE","CUSTOM"],a:0,
 e:"Mặc định trước đây là ALL, nhưng từ SQL Server 2019 và Azure SQL thì là AUTO — bỏ qua query không thường xuyên và query có compile/execution time nhỏ."},
{d:3,t:"Query Store",q:"What does DATA_FLUSH_INTERVAL_SECONDS control?",
 o:["How long data is retained in memory before being written to disk","How long before old data is deleted","The interval over which each query's statistics are aggregated","How often cleanup runs"],a:0,
 e:"DATA_FLUSH_INTERVAL_SECONDS = thời gian dữ liệu ở trong memory trước khi lưu xuống đĩa. Giá trị cao thì ít ghi đĩa hơn nhưng mất dữ liệu nếu SQL Server crash/restart."},
{d:3,t:"Query Store",q:"Which values can INTERVAL_LENGTH_MINUTES take?",
 o:["1, 5, 10, 15, 30, 60 or 1440 minutes","Any integer from 1 to 1440","15 or 60 only","5, 10 or 15"],a:0,
 e:"Chọn từ 1, 5, 10, 15, 30, 60 hoặc 1440 phút. Trong mỗi khoảng đó, mỗi query có tối đa 1 dòng thống kê."},
{d:3,t:"Query Store",q:"Which statement clears all Query Store data?",
 o:["ALTER DATABASE DatabaseName SET QUERY_STORE CLEAR;","EXEC sp_query_store_clear;","DBCC FREEPROCCACHE;","TRUNCATE TABLE sys.query_store_plan;"],a:0,
 e:"ALTER DATABASE ... SET QUERY_STORE CLEAR; hoặc nút 'Purge Query Data' trong SSMS."},
{d:3,t:"Query Store",q:"Which SSMS Query Store report helps you find queries that have become SLOWER?",
 o:["Regressed Queries","Top Resource Consuming Queries","Queries With Forced Plans","Overall Resource Consumption"],a:0,
 e:"Regressed Queries cho thấy query bị chậm đi — xem Duration, CPU Time, Logical/Physical Reads. Queries with High Variation cho query có độ dao động lớn."},
{d:3,t:"Query Store",q:"In the Tracked Queries view, what does a square represent?",
 o:["A query cancelled by the client","A completed query","A query that failed due to an exception","A currently running query"],a:0,
 e:"Hình tròn = query hoàn tất; hình vuông = bị client hủy; hình tam giác = thất bại do exception làm ngắt thực thi."},
{d:3,t:"Query Store",q:"Which view holds Query Store execution plans?",
 o:["sys.query_store_plan","sys.dm_exec_cached_plans","sys.query_store_runtime_stats","sys.dm_exec_query_plan"],a:0,
 e:"sys.query_store_plan chứa plan; sys.query_store_runtime_stats chứa thống kê; join sys.query_store_query với sys.query_store_query_text để xem câu lệnh; sys.query_store_wait_stats cho wait."},
{d:3,t:"Blocking",q:"Which isolation level causes NO blocking but permits dirty reads?",
 o:["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","SERIALIZABLE"],a:0,
 e:"READ UNCOMMITTED: không block nhưng có dirty read. REPEATABLE READ: không dirty read nhưng block. SERIALIZABLE: không dirty read, block cả update/insert."},
{d:3,t:"Blocking",q:"What is the default setting of READ_COMMITTED_SNAPSHOT on SQL Server and on Azure SQL Database?",
 o:["OFF on SQL Server, ON on Azure SQL Database","ON for both","OFF for both","ON on SQL Server, OFF on Azure SQL Database"],a:0,
 e:"READ_COMMITTED_SNAPSHOT mặc định OFF trên SQL Server (nên READ COMMITTED có thể block) và ON trên Azure SQL Database (dùng snapshot nên không block)."},
{d:3,t:"Blocking",q:"Which database option must be enabled for the SNAPSHOT isolation level?",
 o:["ALLOW_SNAPSHOT_ISOLATION ON","READ_COMMITTED_SNAPSHOT ON","AUTO_UPDATE_STATISTICS ON","CHANGE_TRACKING ON"],a:0,
 e:"SNAPSHOT cần ALTER DATABASE ... SET ALLOW_SNAPSHOT_ISOLATION ON. Option này khiến DML sinh row version — cho phép snapshot chứ chưa bật nó."},
{d:3,t:"Blocking",q:"Which query identifies sessions that are currently blocked?",
 o:["SELECT ... FROM sys.dm_exec_requests WHERE blocking_session_id > 0","SELECT * FROM sys.dm_tran_locks","SELECT * FROM sys.dm_exec_sessions","SELECT * FROM sys.dm_os_wait_stats"],a:0,
 e:"sys.dm_exec_requests với blocking_session_id > 0 cho biết ai đang bị block bởi ai. sys.dm_tran_locks xem các lock. sys.dm_os_waiting_tasks xem wait type theo task."},
{d:3,t:"Blocking",q:"Which command shows the current isolation level of a session?",
 o:["DBCC USEROPTIONS","SELECT @@ISOLATION","DBCC SHOWOPTIONS","EXEC sp_isolation"],a:0,
 e:"DBCC USEROPTIONS hiển thị các tùy chọn SET của session hiện tại, bao gồm isolation level."},
{d:3,t:"Extended Events",q:"Which Extended Events target detects start events with no matching end event?",
 o:["Pair Matching","Histogram","Ring Buffer","Event Counter"],a:0,
 e:"Pair Matching (asynchronous) phát hiện start event không có end event tương ứng. Histogram đếm số lần; Ring Buffer cho tập dữ liệu nhỏ hoặc thu thập liên tục."},
{d:3,t:"Extended Events",q:"Which Extended Events targets process data SYNCHRONOUSLY?",
 o:["Event Tracing for Windows (ETW) and Event Counter","Event File and Histogram","Ring Buffer and Pair Matching","Event File only"],a:0,
 e:"ETW và Event Counter xử lý synchronous. Event File, Histogram, Pair Matching và Ring Buffer là asynchronous."},
{d:3,t:"Extended Events",q:"Which Extended Events template is used to identify slow queries?",
 o:["TSQL_Duration","TSQL_Locks","TSQL_Replay","Count Query Locks"],a:0,
 e:"TSQL_Duration để tìm query chậm; TSQL_Locks cho deadlock; TSQL_Replay cho benchmark; Count Query Locks nằm trong nhóm Locks and Blocks."},
{d:3,t:"DMV",q:"Which DMV shows the top completed queries by cumulative CPU?",
 o:["sys.dm_exec_query_stats","sys.dm_exec_requests","sys.dm_exec_connections","sys.dm_os_wait_stats"],a:0,
 e:"sys.dm_exec_query_stats (thường CROSS APPLY với sys.dm_exec_sql_text) cho top query theo total_worker_time. sys.dm_exec_requests cho query ĐANG chạy."},
{d:3,t:"DMV",q:"You need to find CURRENTLY RUNNING queries consuming a lot of CPU. Which DMV should you use?",
 o:["sys.dm_exec_requests","sys.dm_exec_query_stats","sys.query_store_runtime_stats","sys.dm_db_resource_stats"],a:0,
 e:"sys.dm_exec_requests cho các query đang chạy (long running) và tài nguyên chúng đang chờ. dm_exec_query_stats là cho query đã hoàn tất."},
{d:3,t:"DMV",q:"Which hint writes the execution plan to Extended Events?",
 o:["OPTION (USE HINT ('QUERY_PLAN_PROFILE'))","OPTION (RECOMPILE)","OPTION (MAXDOP 1)","OPTION (KEEPFIXED PLAN)"],a:0,
 e:"Thêm OPTION(USE HINT('QUERY_PLAN_PROFILE')) vào cuối query để đưa plan vào Extended Events (lightweight profiling)."},
{d:3,t:"DMV",q:"Which permission is required to use DATABASE-scoped DMVs?",
 o:["VIEW DATABASE STATE — VIEW SERVER STATE is not sufficient","VIEW SERVER STATE","CONTROL DATABASE","db_datareader membership"],a:0,
 e:"DMV cấp database cần VIEW DATABASE STATE trên database — VIEW SERVER STATE KHÔNG đủ. DMV cấp server thì cần VIEW SERVER STATE."},
{d:3,t:"DMV",q:"What does SERVERPROPERTY('EngineEdition') return for Azure SQL Managed Instance?",
 o:["8","5","3","Less than 5"],a:0,
 e:"EngineEdition: 5 = Azure SQL Database, 8 = Managed Instance, < 5 = on-prem hoặc VM."},
{d:3,t:"Wait stats",q:"What does the CXPACKET wait type usually suggest?",
 o:["MAXDOP may be too high, or indexes may be needed","Data file I/O problems","Waiting for a memory grant","Log rate governance throttling"],a:0,
 e:"CXPACKET: MAXDOP có thể quá cao hoặc cần tạo index. SOS_SCHEDULER_YIELD: CPU cao, thường do thiếu index — hay đi kèm CXPACKET."},
{d:3,t:"Wait stats",q:"What problem does the PAGEIOLATCH_* wait type indicate?",
 o:["Data file I/O issues","tempdb I/O issues","Transaction log I/O issues","Waiting for a memory grant"],a:0,
 e:"PAGEIOLATCH_* = data file I/O. PAGELATCH_* = tempdb I/O. WRITE_LOG = transaction log I/O. RESOURCE_SEMAPHORE = chờ memory."},
{d:3,t:"Wait stats",q:"Which wait type relates to log rate governance for an Elastic Pool?",
 o:["POOL_LOG_RATE_GOVERNOR","LOG_RATE_GOVERNOR","INSTANCE_LOG_GOVERNOR","HADR_THROTTLE_LOG_RATE"],a:0,
 e:"LOG_RATE_GOVERNOR = Azure SQL Database; POOL_LOG_RATE_GOVERNOR = Elastic Pool; INSTANCE_LOG_GOVERNOR = MI; RBIO* = Hyperscale; HADR_THROTTLE_LOG_RATE = Business Critical và geo-replication."},
{d:3,t:"Index",q:"If a query uses LIKE '%text%', will an index normally help?",
 o:["No — apart from a full-text index, an index will not help","Yes, if it is a clustered index","Yes, if it uses INCLUDE","Yes, if it is a filtered index"],a:0,
 e:"Với LIKE '%text%' (wildcard ở đầu) thì index thông thường không giúp được — chỉ full-text index mới hỗ trợ."},
{d:3,t:"Index",q:"What characteristics should a clustered index have?",
 o:["UNIQUE or many distinct values, accessed sequentially in ranges, IDENTITY, frequently used","As many columns as possible","It should be on a long varchar column","Each table should have several clustered indexes"],a:0,
 e:"Chỉ có 1 clustered index mỗi bảng (nó sắp xếp lại bảng). Nên UNIQUE hoặc có nhiều giá trị phân biệt, truy cập theo range, IDENTITY, dùng thường xuyên."},
{d:3,t:"Index",q:"When you see a Key Lookup or RID Lookup in an execution plan, what is the usual fix?",
 o:["Add the required columns to the index using INCLUDE","Drop the clustered index","Increase MAXDOP","Switch to a columnstore index"],a:0,
 e:"Dùng INCLUDE để ghi dữ liệu vào index nhưng ở phần tách khỏi Key — nhanh hơn mà không làm index chậm đi nhiều. INCLUDE cũng được tính trong uniqueness test của unique index."},
{d:3,t:"Index",q:"Which of these is a SARGable predicate (index-friendly)?",
 o:["WHERE OrderDate BETWEEN '2024-01-01' AND '2024-12-31'","WHERE YEAR(OrderDate) = 2024","WHERE LEFT(Name,3) = 'ABC'","WHERE ISNULL(Status,'X') = 'X'"],a:0,
 e:"SARGable: dùng BETWEEN thay YEAR() cho ngày, dùng LIKE thay LEFT() cho chuỗi, dùng (X IS NULL OR X = 'Y') thay ISNULL(X,'Y')."},
{d:3,t:"Index",q:"When creating an index from the missing index DMV, how should the columns be ordered?",
 o:["equality_columns first, then inequality_columns (both as key columns), with included_columns in INCLUDE","Inequality columns before equality columns","Only the included columns","Alphabetical order"],a:0,
 e:"Đặt equality columns trước inequality columns (cả hai đều là key), và INCLUDE các included columns."},
{d:3,t:"Index",q:"What is the drawback of having too many indexes?",
 o:["Every INSERT, UPDATE, DELETE and MERGE has to adjust all of the indexes","SELECT queries become slower","Reads consume more CPU","There is no drawback"],a:0,
 e:"Khi INSERT/UPDATE/DELETE/MERGE, mọi index đều phải được điều chỉnh — càng nhiều index thì ghi càng chậm."},
{d:3,t:"Index",q:"If you only need an index over a small portion of the data, which index type should you use?",
 o:["A filtered index","A columnstore index","A clustered index","A unique index"],a:0,
 e:"Filtered Index (dùng mệnh đề WHERE khi CREATE INDEX) khi chỉ cần index một phần nhỏ dữ liệu. FillFactor dùng khi cần chừa chỗ cho tăng trưởng."},
{d:3,t:"Hints",q:"Which query hint prevents recompilation when statistics change?",
 o:["KEEPFIXED PLAN","KEEP PLAN","ROBUST PLAN","OPTIMIZE FOR UNKNOWN"],a:0,
 e:"KEEPFIXED PLAN: không recompile vì statistics thay đổi — chỉ recompile khi schema đổi hoặc chạy sp_recompile. KEEP PLAN chỉ giảm tần suất recompile."},
{d:3,t:"Hints",q:"What does OPTIMIZE FOR UNKNOWN do?",
 o:["It uses the average selectivity of the predicate instead of the parameter value at compile time","It recompiles on every execution","It forces a Nested Loops join","It ignores statistics"],a:0,
 e:"OPTIMIZE FOR UNKNOWN dùng average selectivity của predicate, thay vì giá trị runtime của tham số lúc query được compile — hữu ích khi parameter sniffing gây plan xấu."},
{d:3,t:"Hints",q:"Which join hint CANNOT be used with a RIGHT or FULL JOIN?",
 o:["LOOP","HASH","MERGE","All three can be used"],a:0,
 e:"LOOP không chỉ định được với RIGHT hoặc FULL join. Join hint gồm LOOP, HASH, MERGE — ví dụ INNER LOOP JOIN."},
{d:3,t:"Hints",q:"What does Microsoft recommend about using query hints?",
 o:["Use them only as a last resort, because the Query Optimizer usually picks the best plan","Always use them to keep plans stable","Use them on every query containing a JOIN","Use them instead of indexes"],a:0,
 e:"Microsoft nói Query Optimizer thường chọn được execution plan tốt nhất, nên chỉ dùng hint như biện pháp cuối cùng. Hint chỉ ảnh hưởng một câu DELETE/INSERT/SELECT/UPDATE/MERGE."},
{d:3,t:"Execution plan",q:"When is a Nested Loops join most suitable?",
 o:["Input1 is small, Input2 is large, and Input2 is indexed on the join column","Both inputs are large and unsorted","Both inputs are already sorted on the join column","For intermediate results in a complex query"],a:0,
 e:"Nested Loops: Input1 nhỏ, Input2 lớn và có index trên join — dùng ít I/O và ít so sánh nhất. Merge join khi cả hai đã sort. Hash join cho input lớn, chưa sort, không index."},
{d:3,t:"Execution plan",q:"How does the Batch mode Adaptive Join (SQL Server 2017) work?",
 o:["It converts to a Hash Join or Nested Loops join after the first input has been scanned","It always uses a Merge Join","It chooses the join type at compile time from statistics","It runs both join types in parallel"],a:0,
 e:"Adaptive Join chọn Hash Join hay Nested Loops trong RUNTIME, sau khi đã scan input đầu tiên, dựa trên số dòng thực tế so với ngưỡng."},
{d:3,t:"Execution plan",q:"In which direction is an execution plan read, and what does arrow thickness represent?",
 o:["Right to left; arrow thickness represents the number of rows","Left to right; thickness represents CPU cost","Top to bottom; thickness represents elapsed time","Right to left; thickness represents the execution count"],a:0,
 e:"Execution plan chạy từ phải sang trái. Độ dày mũi tên = số dòng. Càng nhiều estimated row thì càng nhiều memory được reserve."},
{d:3,t:"Execution plan",q:"Which SET statement displays execution plan information WITHOUT executing the statement?",
 o:["SET SHOWPLAN_ALL ON or SET SHOWPLAN_TEXT ON","SET STATISTICS IO ON","SET STATISTICS TIME ON","SET NOEXEC ON"],a:0,
 e:"SHOWPLAN_ALL và SHOWPLAN_TEXT hiển thị thông tin plan mà không chạy câu lệnh. 'Display Estimated Execution Plan' cũng không chạy query; 'Include Actual Execution Plan' thì có chạy."},
{d:3,t:"Execution plan",q:"You see an expensive Sort operator in the plan. What is the most appropriate action?",
 o:["Check whether the sort is really needed, or create an index already sorted on those columns","Set MAXDOP to 0","Add OPTION (HASH JOIN)","Rewrite the query using a cursor"],a:0,
 e:"Sort rất tốn kém — cân nhắc bỏ nếu không cần, hoặc tạo index đã sort sẵn theo các cột đó."},
{d:3,t:"Execution plan",q:"If the code uses a cursor, what should you do?",
 o:["Replace it with a set-based operation","Add an index for the cursor","Increase the memory grant","Add OPTION (RECOMPILE)"],a:0,
 e:"Cursor xử lý từng dòng, rất chậm — nên thay bằng set-based operation."},
{d:3,t:"Intelligent Insights",q:"Intelligent Insights compares the current workload against what period?",
 o:["The last hour of workload against the previous 7 days","24 hours against 30 days","One week against one month","Real time against a manual baseline"],a:0,
 e:"Intelligent Insights so sánh workload 1 giờ gần nhất với 7 ngày qua, dùng dữ liệu từ Query Store, và cung cấp root cause analysis dạng dễ đọc."},
{d:3,t:"Intelligent Insights",q:"Where can Intelligent Insights be streamed to, and in what formats?",
 o:["Log Analytics; Event Hubs (Avro); Azure Storage (Extended Events format)","Log Analytics only","Azure Storage only, as CSV","Directly to Power BI"],a:0,
 e:"Stream tới Log Analytics workspace (cách phổ biến nhất, dùng với Azure SQL Analytics, truy vấn bằng KQL), Azure Event Hubs (định dạng Avro — binary JSON), hoặc Azure Storage (định dạng Extended Events)."},
{d:3,t:"Statistics",q:"When SHOULD statistics be updated manually?",
 o:["After a bulk insert, when queries are slow, or when inserting into ascending/descending key columns such as IDENTITY","After every index rebuild","Every hour","After every backup"],a:0,
 e:"Cập nhật thủ công khi query chậm, khi insert vào cột key tăng/giảm dần (IDENTITY, timestamp), hoặc sau bulk insert. LƯU Ý: rebuild/reorganize index KHÔNG cần update statistics vì không đổi phân bố dữ liệu."},
{d:3,t:"Statistics",q:"UPDATE STATISTICS ... WITH FULLSCAN is equivalent to what?",
 o:["SAMPLE 100 PERCENT","SAMPLE 50 PERCENT","RESAMPLE","PERSIST_SAMPLE_PERCENT = ON"],a:0,
 e:"WITH FULLSCAN quét toàn bộ dòng, tương đương SAMPLE 100 PERCENT. RESAMPLE dùng lại tỉ lệ mẫu gần nhất."},
{d:3,t:"Statistics",q:"What does PERSIST_SAMPLE_PERCENT = ON do?",
 o:["That sample rate becomes the default for future statistics updates","It saves statistics into Query Store","It disables auto update statistics","It applies to the whole database"],a:0,
 e:"PERSIST_SAMPLE_PERCENT = ON khiến tỉ lệ mẫu hiện tại thành mặc định cho các lần cập nhật sau (trừ khi bạn chỉ định số dòng cụ thể)."},
{d:3,t:"Statistics",q:"Which stored procedure updates statistics for ALL user-defined and internal tables?",
 o:["sp_updatestats","sp_update_statistics","UPDATE STATISTICS ALL","sp_recompile"],a:0,
