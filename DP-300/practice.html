<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DP-300 · Luyện tập</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#646b74; --line:#e2e5ea;
  --accent:#0b6bcb; --accent-soft:#e7f0fb;
  --ok:#127c3f; --ok-soft:#e4f4ea; --bad:#c0392b; --bad-soft:#fbeceb;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --card:#1c2025; --fg:#e6e8ea; --muted:#98a0aa; --line:#2c323a;
    --accent:#5aa9ff; --accent-soft:#16283d;
    --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#331817;
  }
}
:root[data-theme=light]{
  --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#646b74; --line:#e2e5ea;
  --accent:#0b6bcb; --accent-soft:#e7f0fb;
  --ok:#127c3f; --ok-soft:#e4f4ea; --bad:#c0392b; --bad-soft:#fbeceb;
}
:root[data-theme=dark]{
  --bg:#14171a; --card:#1c2025; --fg:#e6e8ea; --muted:#98a0aa; --line:#2c323a;
  --accent:#5aa9ff; --accent-soft:#16283d;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#331817;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
code,kbd,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:7px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

/* setup screen */
.setup{margin-top:16px}
.field{margin-bottom:16px}
.field > label{display:block;font-weight:600;font-size:13px;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}

/* quiz */
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 8px;font-weight:600;font-size:11.5px}
.badge.plain{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.q{font-size:16.5px;font-weight:600;margin:0 0 16px;line-height:1.5;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:transparent;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:1px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed=true] .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.expl{margin-top:14px;padding:13px 15px;border-radius:8px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:14px}
.expl b{display:block;margin-bottom:3px}
.expl.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.expl.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;gap:8px;align-items:center;margin-top:16px}
.hint{color:var(--muted);font-size:12px;margin-top:14px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px}

/* results */
.score{text-align:center;padding:8px 0 4px}
.score b{font-size:44px;letter-spacing:-.03em;display:block;line-height:1.1}
.score span{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.review{margin-top:20px}
.review > h3{font-size:14px;margin:0 0 10px}
.rev{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:9px}
.rev .qq{font-weight:600;margin-bottom:8px;white-space:pre-wrap}
.rev .line{font-size:13.5px;margin:3px 0}
.rev .line .tag{display:inline-block;min-width:56px;color:var(--muted);font-size:12px}
.rev .yours{color:var(--bad)}
.rev .right{color:var(--ok)}
.rev .why{margin-top:8px;font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px}
.note-link{display:inline-block;margin-top:9px;font-size:13px;font-weight:600;
  color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.note-link:hover{border-bottom-color:var(--accent)}
.rev .note-link{margin-top:7px}
header a.top{font-size:13px;color:var(--accent);text-decoration:none}
header a.top:hover{text-decoration:underline}

/* ---------- điện thoại ---------- */
@media (max-width:640px){
  html{-webkit-text-size-adjust:100%}
  .wrap{padding:16px 12px 90px}
  header{gap:8px}
  h1{font-size:18px}
  .card{padding:15px}
  .q{font-size:17px}
  /* vùng chạm tối thiểu 44px cho ngón tay */
  button{min-height:44px}
  header a.top{min-height:44px;display:inline-flex;align-items:center}
  .chip{min-height:44px;display:inline-flex;align-items:center}
  select{min-height:44px;font-size:16px}          /* 16px để iOS không tự phóng to */
  .opt{min-height:52px;padding:13px 14px}
  .note-link{min-height:44px;display:inline-flex;align-items:center}
  .stats{grid-template-columns:repeat(auto-fit,minmax(94px,1fr))}
  /* nội dung dài không được đẩy trang rộng ra */
  table{display:block;overflow-x:auto}
  code{overflow-wrap:anywhere}
  .q,.rev .qq,.expl,.rev .line{overflow-wrap:anywhere}
  .score b{font-size:38px}
}
/* ---------- case study ---------- */
.casebox{border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);margin:0 0 16px;overflow:hidden}
.casebar{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 14px;
  cursor:pointer;font-weight:650;font-size:14.5px;background:transparent;border:0;border-radius:0}
.casebar .caret{color:var(--accent);font-size:12px}
.casebar .hintx{color:var(--muted);font-size:12px;font-weight:400}
.casebody{padding:2px 16px 14px;font-size:14px;border-top:1px solid var(--line);background:var(--card)}
.casebody h5{margin:14px 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.casebody p{margin:6px 0}
.casebody ul{margin:6px 0;padding-left:20px}
.casebody li{margin:3px 0}

/* ---------- sắp xếp thứ tự ---------- */
.build{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.buildcol h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.step{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;line-height:1.45;
  padding:10px 12px;margin-bottom:7px;border:1px solid var(--line);border-radius:8px;background:transparent}
.step:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.step .n{flex:none;width:20px;height:20px;border-radius:5px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.step.ok{border-color:var(--ok);background:var(--ok-soft)}
.step.ok .n{background:var(--ok)}
.step.bad{border-color:var(--bad);background:var(--bad-soft)}
.step.bad .n{background:var(--bad)}
.slot{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center}

/* ---------- điền vào chỗ trống ---------- */
.fillcode{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:13px 14px;
  overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
  line-height:2.1;white-space:pre;margin:0}
.fillcode select{padding:2px 6px;font-size:12.5px;border-radius:6px;border-color:var(--accent);
  background:var(--accent-soft);color:var(--accent);font-weight:600;max-width:min(60vw,320px)}
.fillcode select.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.fillcode select.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* ---------- Có / Không ---------- */
.goalbox,.solbox{border-radius:8px;padding:11px 13px;margin-bottom:10px;font-size:14px;border-left:3px solid}
.goalbox{border-left-color:var(--accent);background:var(--accent-soft)}
.solbox{border-left-color:var(--muted);background:var(--bg);border:1px solid var(--line);border-left-width:3px}
.goalbox h4,.solbox h4{margin:0 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.goalbox h4{color:var(--accent)}
.solbox h4{color:var(--muted)}
.ynrow{display:flex;gap:9px;flex-wrap:wrap}
.ynrow button{flex:1 1 200px;padding:12px;font-weight:600}
.ynrow button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ynrow button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ynrow button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* ---------- linh tinh ---------- */
.badge.kind{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini > i{display:block;height:100%}
.rev .qq .badge{margin-right:6px;vertical-align:1px}
h3.sect{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.rev ol{margin:5px 0 0 18px;padding:0}
.rev ol li{margin:2px 0;font-size:13.5px}
.note{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:18px;
  border-left:2px solid var(--line);padding-left:12px}

@media (max-width:640px){
  .build{grid-template-columns:1fr}
  .step{min-height:48px}
  .fillcode{font-size:12.5px;line-height:2.3}
  .fillcode select{min-height:34px;font-size:16px}
  .ynrow button{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DP-300 · Luyện tập</h1>
    <span class="sub" id="qcount"></span>
    <a class="top" href="notes.html">Xem toàn bộ note →</a>
    <span class="spacer"></span>
    <button id="theme" title="Đổi giao diện sáng/tối">◐</button>
  </header>

  <!-- ===== SETUP ===== -->
  <section id="setup" class="setup">
    <div class="card">
      <div class="field">
        <label>Phạm vi (Skills measured)</label>
        <div class="chips" id="domains"></div>
      </div>
      <div class="field">
        <label>Dạng câu hỏi</label>
        <div class="chips" id="kinds"></div>
      </div>
      <div class="field">
        <label>Chế độ</label>
        <div class="chips" id="modes">
          <button class="chip" data-mode="study" aria-pressed="true">Học — hiện đáp án ngay</button>
          <button class="chip" data-mode="exam" aria-pressed="false">Thi thử — chấm ở cuối</button>
        </div>
      </div>
      <div class="field">
        <label for="num">Số câu</label>
        <select id="num">
          <option value="20">20 câu</option>
          <option value="40" selected>40 câu</option>
          <option value="60">60 câu</option>
          <option value="0">Tất cả</option>
        </select>
      </div>
      <div class="nav">
        <button class="primary" id="start">Bắt đầu</button>
        <button id="startWrong">Ôn lại câu đã sai (<span id="wrongCount">0</span>)</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <p class="note">
      Câu hỏi tự soạn theo khuôn của đề thi thật (tình huống nhiều câu, chọn nhiều đáp án, sắp xếp thứ tự,
      điền vào chỗ trống, Có/Không, case study) — không phải đề thi thật.
      Thứ tự câu, thứ tự lựa chọn và thứ tự các bước đều được trộn lại mỗi lượt.
    </p>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quiz" hidden>
    <div class="bar"><i id="prog"></i></div>
    <div id="casePanel"></div>
    <div class="card">
      <div class="meta">
        <span class="badge" id="mDomain"></span>
        <span class="badge plain" id="mTopic"></span>
        <span class="badge kind" id="mKind"></span>
        <span class="spacer"></span>
        <span id="mPos"></span>
        <span id="mScore"></span>
      </div>
      <p class="q" id="qtext"></p>
      <div id="body"></div>
      <div id="expl"></div>
      <div class="nav">
        <button id="check" class="primary">Kiểm tra</button>
        <button id="next" class="primary" hidden>Câu tiếp →</button>
        <span class="spacer"></span>
        <button id="quit">Kết thúc</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="result" hidden>
    <div class="card">
      <div class="score">
        <b id="rPct"></b>
        <span id="rRaw"></span>
      </div>
      <table id="rTable"></table>
      <table id="rKind"></table>
      <div class="nav" style="margin-top:18px">
        <button class="primary" id="again">Làm lại</button>
        <button id="reviewWrong">Ôn ngay các câu sai</button>
      </div>
    </div>
    <div class="review" id="rReview"></div>
  </section>
</div>

<script>
/* ============================================================
   Ngân hàng câu hỏi DP-300 — soạn từ DP-300Notes260424.pdf (161 trang),
   viết theo khuôn câu hỏi của kỳ thi thật.

   Trắc nghiệm (QUESTIONS)
     id = mã câu (duy nhất toàn ngân hàng, dùng để ghi nhớ câu đã sai)
     d  = domain 1-5 · t = chủ đề (dùng để liên kết tới notes.html)
     n  = (tuỳ chọn) id mục trong notes.html, ghi đè tra cứu theo chủ đề
     q  = câu hỏi · o = lựa chọn
     a  = index đáp án đúng (số = một đáp án, mảng = nhiều đáp án)
     e  = giải thích

   Các dạng theo format kỳ thi
     ORDER  steps  = các bước ĐÃ đúng thứ tự (engine tự trộn khi hiển thị)
     FILL   code   = đoạn code, {{n}} là chỗ trống thứ n · blanks[n] = {o, a}
     YESNO  series = nhóm câu cùng một mục tiêu · a = true/false
     CASES  sections = bối cảnh · questions = câu hỏi bám bối cảnh đó

   Trong q / o / e: `code` thành thẻ <code>, **đậm** thành <strong>.
   ============================================================ */
const DOMAINS = [
  "Plan & implement data platform resources",
  "Implement a secure environment",
  "Monitor, configure & optimize",
  "Automation of tasks",
  "High availability & disaster recovery"
];
const DOMAIN_SHORT  = ["Platform", "Security", "Monitor & tune", "Automation", "HA/DR"];
const DOMAIN_WEIGHT = ["20–25%", "15–20%", "20–25%", "15–20%", "20–25%"];

/* Chủ đề "<domain>|<t>" -> mục tương ứng trong notes.html (bản HTML của file PDF gốc).
   Khoá gồm cả domain vì cùng một nhãn chủ đề có thể xuất hiện ở hai phạm vi khác nhau. */
const NOTE_REF = {
  "1|Deployment":"s1", "1|Patching":"s3", "1|Azure Arc":"s6a", "1|Fabric":"s6b",
  "1|Partitioning":"s8", "1|Azure SQL DB":"s9", "1|Azure SQL MI":"s10", "1|SQL on VM":"s11",
  "1|Compression":"s13", "1|Migration":"s15", "1|Data Sync":"s20", "1|MI copy/move":"s22a",
  "1|Resource":"s-16",

  "2|Authentication":"s23", "2|Users & logins":"s24", "2|Server roles":"s25",
  "2|Database roles":"s25", "2|Permissions":"s29-3", "2|Custom roles":"s29-4",
  "2|Certificates":"s29", "2|TDE":"s30", "2|Firewall":"s32", "2|Always Encrypted":"s33",
  "2|Secure enclaves":"s33a", "2|Dynamic Data Masking":"s34", "2|Private Link":"s34a",
  "2|TLS":"s35", "2|Classification":"s36", "2|Auditing":"s37", "2|Change Tracking":"s38",
  "2|CDC":"s38", "2|Ledger":"s41", "2|RLS":"s42", "2|Defender":"s43",
  "2|Vulnerability":"s39", "2|Purview":"s40", "2|Key Vault":"s34-2",

  "3|Baseline":"s44", "3|Metrics":"s46", "3|Query Perf Insight":"s46", "3|SQL Insights":"s48",
  "3|Database watcher":"s48a", "3|Query Store":"s50", "3|Blocking":"s52",
  "3|Extended Events":"s52", "3|DMV":"s53", "3|Wait stats":"s60", "3|Index":"s54",
  "3|Hints":"s56", "3|Execution plan":"s57", "3|Intelligent Insights":"s57a",
  "3|Statistics":"s59", "3|DBCC":"s60-3", "3|Auto-tuning":"s61", "3|Resource Governor":"s63",
  "3|Scoped config":"s64", "3|DB options":"s64-2", "3|Autogrowth":"s65-2",
  "3|Free space":"s65-3", "3|IQP":"s66", "3|Index maintenance":"s58",

  "4|SQL Agent":"s67", "4|Notifications":"s68", "4|Database Mail":"s68", "4|ARM/Bicep":"s70-2",
  "4|PowerShell":"s71", "4|Azure CLI":"s72", "4|Deployment":"s70", "4|Elastic Jobs":"s74",
  "4|Multi-server":"s75", "4|VM backup":"s75-2", "4|Policies":"s75-4", "4|Alerts":"s77-2",
  "4|Config changes":"s77-3", "4|Logic Apps":"s76", "4|Automation":"s75-3",
  "4|VM automation":"s3", "4|Maintenance":"s13",

  "5|SLA / RPO / RTO":"s79", "5|SLA":"s79", "5|Hybrid HADR":"s4", "5|FCI":"s4",
  "5|Site Recovery":"s4", "5|Geo-replication":"s94", "5|Failover group":"s82",
  "5|Availability Group":"s90", "5|AG listener":"s90-4", "5|AG setup":"s90",
  "5|Quorum":"s92", "5|Backup":"s88-3", "5|Log backup":"s88", "5|Restore":"s85",
  "5|PITR":"s86", "5|LTR":"s87", "5|Cloud backup":"s88a", "5|Replication":"s94",
  "5|Log shipping":"s94-2", "5|MI restore":"s86"
};

const QUESTIONS = [
/* ---------- 1. Plan and implement data platform resources (20–25%) ---------- */
{id:101,d:1,t:"Deployment",q:"You are provisioning a production Azure SQL Managed Instance from the Azure portal. The deployment must succeed on the first attempt. Which two requirements must the values you enter satisfy?",
 o:["The admin password must contain at least 12 characters","The managed instance name must be unique across all of Azure","The admin password must contain at least 8 characters","The managed instance name must be unique within the resource group","The admin login must be named `sa`"],a:[0,1],
 e:"MI yêu cầu admin password tối thiểu **12 ký tự** (Azure SQL Database chỉ 8) và tên instance phải unique trên toàn Azure vì nó tạo thành FQDN công khai. Login `sa` là tên bị cấm. Lưu ý: password policy của MI thừa hưởng policy nền tảng Azure của các VM trong virtual cluster, nên portal có thể yêu cầu dài hơn — hãy đọc thông báo validation trong portal thay vì nhớ cứng một con số."},
{id:102,d:1,t:"Deployment",q:"Three Azure VMs host SQL Server instances that will form an availability group. You must run the SQL Server service on all three VMs under one Active Directory account, with automatic password rotation and no stored credentials. What should you use?",
 o:["A Group Managed Service Account (gMSA)","A standalone Managed Service Account (MSA)","A virtual account per VM","The Local System account"],a:0,
 e:"MSA chỉ gán được cho **một** máy; cần dùng trên nhiều server thì phải là gMSA. Virtual account và Local System là account cục bộ, không dùng chung qua domain được."},
{id:103,d:1,t:"Deployment",q:"You are creating the virtual network that will host SQL Server on Azure VMs. Traffic from the subnet to Azure SQL must stay on the Microsoft backbone instead of traversing the public internet, at no extra cost. Which service endpoint should you add to the subnet?",
 o:["`Microsoft.Sql`","`Microsoft.Storage`","`Microsoft.Network`","`Microsoft.AzureActiveDirectory`"],a:0,
 e:"Trong Edit subnet, thêm service endpoint `Microsoft.Sql`. Service endpoint miễn phí; nếu cần private IP trong VNet thì mới dùng Private Link (có phí)."},
{id:104,d:1,t:"Patching",q:"Management asks you for the monthly maintenance window during which you will apply Database Engine patches to a 60-database Azure SQL Database and Managed Instance estate. What should you tell them?",
 o:["Patching is built in and applied automatically; you cannot choose when, so applications must implement retry logic","You must schedule the patches yourself each month from the Azure portal","Patching only happens if Automated Patching is enabled on the logical server","The databases are never patched, in order to guarantee application compatibility"],a:0,
 e:"PaaS (SQL Database và MI) luôn chạy latest stable Database Engine version, patch tự động — bạn không kiểm soát thời điểm. Cách giảm tác động duy nhất là retry logic ở tầng ứng dụng."},
{id:105,d:1,t:"Patching",q:"You must enable Automated Patching for SQL Server on an existing Azure VM. What is the minimum supported combination?",
 o:["SQL Server 2008 R2 or above on Windows Server 2008 R2 or above","SQL Server 2012 on Windows Server 2012","SQL Server 2016 on Windows Server 2016","SQL Server 2019 on Windows Server 2019"],a:0,
 e:"Automated Patching hỗ trợ từ SQL Server 2008 R2 + Windows Server 2008 R2. Cấu hình gồm day, maintenance start hour và window duration."},
{id:106,d:1,t:"Patching",q:"You must script the Automated Patching maintenance window for 40 SQL Server VMs so it can be re-run in a pipeline. Which cmdlet defines the schedule object?",
 o:["`New-AzVMSqlServerAutoPatchingConfig -Enable`","`Set-AzVMSqlServerExtension -AutoPatch`","`Update-AzVM -PatchMode AutomaticByPlatform`","`New-AzSqlDatabaseExport`"],a:0,
 e:"`New-AzVMSqlServerAutoPatchingConfig -Enable` tạo config (day, start hour, duration), sau đó `Set-AzVMSqlServerExtension` áp config đó lên VM."},
{id:107,d:1,t:"Azure Arc",q:"An on-premises SQL Server estate is onboarded to Azure Arc. Security wants users to authenticate to those instances with Microsoft Entra ID accounts. What is the minimum SQL Server version required?",
 o:["SQL Server 2022","SQL Server 2016","SQL Server 2019","Any version supported by the Arc agent"],a:0,
 e:"Arc-enabled SQL Server chỉ hỗ trợ xác thực bằng Entra ID từ **SQL Server 2022** trở lên; các version cũ hơn vẫn onboard được nhưng chỉ dùng Windows/SQL authentication."},
{id:108,d:1,t:"Azure Arc",q:"Your company runs 120 SQL Server instances in its own datacentres and wants Azure management capabilities without migrating. Which two outcomes can Azure Arc-enabled SQL Server deliver?",
 o:["A central inventory of every instance with a best practices assessment","A pay-as-you-go licensing model instead of purchasing licences up front","Automatic scale-out of a database across several Azure regions under load","Automatic conversion of the instances into Azure SQL Managed Instances","Built-in patching identical to Azure SQL Database"],a:[0,1],
 e:"Arc mang inventory, best practices assessment, Defender, Purview và mô hình pay-as-you-go tới SQL Server ngoài Azure. Nó **không** scale out, không tự convert sang PaaS, và không patch thay bạn."},
{id:109,d:1,t:"Fabric",q:"A team asks how Azure SQL Database in Microsoft Fabric differs from a standard Azure SQL Database. Which statement is correct?",
 o:["It is a SaaS offering with mirroring to OneLake configured for you, whereas Azure SQL Database is PaaS","It is IaaS, whereas Azure SQL Database is PaaS","It requires the DTU purchasing model","It does not support row-level security or object-level security"],a:0,
 e:"SQL Database trong Fabric là **SaaS**: không cấu hình hạ tầng, dữ liệu tự mirror sang OneLake. Nó vẫn hỗ trợ RLS và OLS như bản PaaS."},
{id:110,d:1,t:"Partitioning",q:"A `Customer` table contains a rarely queried `PassportScan` column and several audit columns. You must keep the sensitive and rarely used columns in a separate store while every partition can still be joined on `CustomerId`. Which partitioning approach should you use?",
 o:["Vertical partitioning","Horizontal partitioning (sharding)","Functional partitioning","Range partitioning"],a:0,
 e:"Vertical partitioning tách theo **cột** — mỗi partition giữ một tập con cột và tất cả đều join được qua khoá chung. Horizontal tách theo dòng; functional tách theo mục đích sử dụng."},
{id:111,d:1,t:"Partitioning",q:"Your design shards a 9 TB order table across eight databases. Which two statements about horizontal partitioning are true?",
 o:["Every shard uses the same schema and holds a subset of the rows","Small static reference data should be replicated to every shard to avoid cross-shard queries","Each shard holds a different subset of the columns","Each shard should be given its own optimised schema","Cross-shard queries are handled transparently by the Database Engine"],a:[0,1],
 e:"Sharding = cùng schema, khác dòng. Dữ liệu tra cứu nhỏ nên replicate ở mọi shard để tránh cross-partition access — chi phí lớn nhất của mô hình này, và ứng dụng phải tự xử lý truy vấn cross-shard."},
{id:112,d:1,t:"Partitioning",q:"Order volume is heavily skewed towards a handful of large customers and one shard is becoming a hotspot. Which sharding strategy distributes data most evenly?",
 o:["Hash strategy","Range strategy","Lookup strategy","Functional strategy"],a:0,
 e:"Hash phân bố đều nhất nhờ tính ngẫu nhiên nên giảm hotspot; đổi lại tốn CPU tính hash và rebalance rất khó. Range gom dữ liệu liền kề nên dễ tạo hotspot."},
{id:113,d:1,t:"Partitioning",q:"A reporting workload almost always reads one whole month of telemetry at a time, and you want each read to touch as few shards as possible. Which sharding strategy fits best?",
 o:["Range strategy, with one shard per month","Hash strategy on the event ID","Lookup strategy with a shard map","Functional strategy by event type"],a:0,
 e:"Range strategy dùng shard key tuần tự theo khoảng (ví dụ mỗi tháng một shard) nên lấy nhiều item liền kề trong một thao tác; nhược điểm là cân bằng tải kém."},
{id:114,d:1,t:"Partitioning",q:"You must be able to move an individual tenant's data to a different shard without changing the tenant's identifier or the application's connection logic. Which sharding strategy supports this best?",
 o:["Lookup strategy","Hash strategy","Range strategy","Vertical partitioning"],a:0,
 e:"Lookup strategy dùng shard map ánh xạ shard key → shard, nên di chuyển tenant chỉ cần cập nhật map. Đổi lại có thêm một lượt tra cứu và phải bảo vệ map."},
{id:115,d:1,t:"Azure SQL DB",q:"A development database is queried unpredictably for two or three hours a day and is idle the rest of the time. You must minimise cost. Which compute tier should you choose?",
 o:["Serverless, with auto-pause enabled","Provisioned General Purpose","An elastic pool with 50 eDTUs","Hyperscale with one replica"],a:0,
 e:"Serverless phù hợp pattern on-off: tự pause khi không dùng và khi pause **chỉ trả tiền storage**. Provisioned trả tiền compute liên tục; elastic pool chỉ có lợi khi nhiều database chia sẻ tài nguyên."},
{id:116,d:1,t:"Azure SQL DB",q:"An OLTP application performs many short update transactions and requires the lowest possible storage latency, plus a read-only replica at no additional cost. Which service tier meets the requirement?",
 o:["Business Critical","General Purpose","Hyperscale","Basic"],a:0,
 e:"Business Critical: I/O 1–2 ms, độ bền cao, kèm một free read-only secondary replica. General Purpose có latency 5–10 ms và không có replica đọc miễn phí."},
{id:117,d:1,t:"Azure SQL DB",q:"A database is expected to grow to 30 TB. Before recommending Hyperscale, which two facts must you take into account?",
 o:["Hyperscale supports database sizes up to 100 TB","Once a database is migrated to Hyperscale it cannot be moved back to another service tier","Hyperscale is also available in Azure SQL Managed Instance","Hyperscale requires the DTU purchasing model","Hyperscale is limited to 4 TB like the other tiers"],a:[0,1],
 e:"Hyperscale lên tới 100 TB nhưng là **đường một chiều** — không chuyển ngược ra tier khác. Nó chỉ có trên Azure SQL Database, không có ở MI, và chỉ dùng vCore."},
{id:118,d:1,t:"Azure SQL DB",q:"You are sizing an Azure SQL Database on the vCore purchasing model, standard-series (Gen5) hardware. Which set of maximums is correct?",
 o:["80 vCores and 4 TB of data — except Hyperscale, which reaches 100 TB","128 vCores and 8 TB of data in every service tier","40 vCores and 2 TB of data","80 vCores and 16 TB of data, the same limit as a managed instance"],a:0,
 e:"Standard-series (Gen5): tối đa 80 vCores và 4 TB data cho một database (Hyperscale lên 100 TB; premium-series cho nhiều vCore hơn). Memory đi theo tỉ lệ **5.1 GB mỗi vCore** (~408 GB ở 80 vCores) chứ không phải một con số cố định — bộ số 80 vCores / 16 TB là giới hạn của **Managed Instance**."},
{id:119,d:1,t:"Azure SQL DB",q:"You are calculating the total storage to provision for a vCore database whose data maximum size is 500 GB. How much log space is included in the calculation?",
 o:["150 GB — log size is 30% of the data maximum size","500 GB — log size matches the data size","50 GB — log size is 10% of the data maximum size","250 GB — log size is 50% of the data maximum size"],a:0,
 e:"Trong mô hình vCore, log size được tính bằng **30%** của Data Maximum size, tức 150 GB với database 500 GB."},
{id:120,d:1,t:"Azure SQL DB",q:"An application on an Azure SQL Database in the Standard S1 tier must start feeding a downstream warehouse using Change Data Capture. What must you do first?",
 o:["Scale the database to a tier with at least 1 vCore or 100 DTUs","Enable Change Tracking instead, because CDC is not supported on Azure SQL Database","Move the database into an elastic pool","Switch the database to the Full recovery model"],a:0,
 e:"CDC cần tối thiểu 1 vCore hoặc 100 DTU/eDTU, nên Basic và Standard S0/S1/S2 không dùng được. CDC **có** trên Azure SQL Database miễn đủ tài nguyên; recovery model không cấu hình được trên PaaS."},
{id:121,d:1,t:"Azure SQL DB",q:"A database currently runs at 400 DTUs and finance asks whether the vCore model would be cheaper. Which two statements should you include in your answer?",
 o:["Microsoft suggests evaluating the vCore model once a database exceeds 300 DTUs","Converting between the DTU and vCore models is a scale operation and needs no meaningful downtime","The two models cannot be compared; a migration and a re-import are required","vCore only becomes cheaper above 1000 DTUs","The change requires re-creating the database on a new logical server"],a:[0,1],
 e:"Trên ~300 DTU thì nên cân nhắc vCore vì thường rẻ hơn và cho phép chọn hardware generation; chuyển đổi giữa hai model chỉ là thao tác scale, **không có downtime** đáng kể và không cần tạo lại database."},
{id:122,d:1,t:"Azure SQL DB",q:"Immediately after you scale a database from 8 to 32 vCores, DMV output still reflects the old resource limits. What should you run?",
 o:["`EXEC sp_query_store_flush_db;`","`DBCC FREEPROCCACHE;`","`EXEC sp_updatestats;`","`ALTER DATABASE CURRENT SET QUERY_STORE CLEAR;`"],a:0,
 e:"Sau khi re-scale, flush Query Store bằng `sp_query_store_flush_db` để DMV báo số liệu chính xác. `QUERY_STORE CLEAR` thì xoá sạch dữ liệu — mất luôn lịch sử."},
{id:123,d:1,t:"Azure SQL DB",q:"An application hosted on an Azure VM in the same region as its Azure SQL Database suffers from extra latency on every connection. You must minimise round-trip latency. Which two actions are required?",
 o:["Set the connection policy of the logical server to Redirect","Allow outbound traffic from the VM subnet on ports 11000–11999","Set the connection policy of the logical server to Proxy","Allow outbound traffic from the VM subnet on port 1434 UDP","Set the minimum TLS version of the logical server to 1.0"],a:[0,1],
 e:"Redirect kết nối trực tiếp tới database node sau khi gateway trả về địa chỉ nên latency thấp nhất, nhưng bắt buộc mở port **11000–11999** ngoài 1433. Proxy đi qua gateway (chậm hơn nhưng chỉ cần 1433). Default = Redirect nếu client trong Azure, Proxy nếu từ ngoài."},
{id:124,d:1,t:"Azure SQL MI",q:"A workload that relies heavily on tempdb is being moved from Azure SQL Database (16 vCores) to Azure SQL Managed Instance (16 vCores). How many tempdb data files will the new environment have?",
 o:["12, regardless of the vCore count","16 — one per vCore","8, the recommended maximum","1"],a:0,
 e:"MI luôn tạo **12** tempdb data file bất kể số vCore. Azure SQL Database tạo 1 file/vCore (32 GB mỗi file, cap 32 file với serverless)."},
{id:125,d:1,t:"Azure SQL MI",q:"A legacy application uses cross-database joins, SQL Server Agent jobs stored in msdb, and CLR assemblies. It must move to a PaaS platform with the fewest code changes. Which three of these requirements rule out Azure SQL Database and point to Managed Instance?",
 o:["Cross-database queries","SQL Server Agent and the msdb database","CLR integration","Transparent Data Encryption","Dynamic data masking"],a:[0,1,2],
 e:"Cross-database query, SQL Agent/msdb và CLR chỉ có ở MI (và VM). TDE cùng dynamic data masking có ở cả hai nên không phải lý do chọn MI."},
{id:126,d:1,t:"Azure SQL MI",q:"You must consolidate 140 small databases onto a single Azure SQL Managed Instance. Which limit blocks the plan?",
 o:["A managed instance supports a maximum of 100 databases","A managed instance supports a maximum of 40 vCores","A managed instance is limited to 4 TB of storage","A managed instance supports a maximum of 50 databases"],a:0,
 e:"MI: tối đa 80 vCores, 400 GB memory, **100 database**, và 16 TB storage. 140 database vượt giới hạn nên phải chia thành hai instance."},
{id:127,d:1,t:"SQL on VM",q:"A SQL Server workload must run on Azure VMs with the highest platform SLA available inside a single region. How should you deploy the VMs?",
 o:["Two or more instances spread across two or more availability zones — 99.99%","Two or more instances in the same availability set — 99.95%","A single instance with premium SSD disks — 99.9%","A single instance with standard SSD disks — 99.5%"],a:0,
 e:"99.95% = 2+ instance trong cùng availability set (cùng datacenter). 99.99% = 2+ instance ở 2+ availability zone, tức các datacenter vật lý khác nhau trong region."},
{id:128,d:1,t:"SQL on VM",q:"A single-instance Azure VM hosts a test SQL Server and uses premium SSD managed disks for all volumes. What SLA does Microsoft commit to?",
 o:["99.9%","99.5%","95%","99.99%"],a:0,
 e:"Single instance: 95% với Standard HDD, 99.5% với Standard SSD, 99.9% với Premium SSD hoặc Ultra Disk."},
{id:129,d:1,t:"SQL on VM",q:"A customer must migrate a SQL Server 2014 estate that also runs SSIS packages and SSRS reports on the same instance, and administrators need to install third-party agents on the operating system. Which deployment option should you recommend?",
 o:["SQL Server on Azure Virtual Machines","Azure SQL Managed Instance","Azure SQL Database with an elastic pool","Azure SQL Database Hyperscale"],a:0,
 e:"Cần bản SQL Server cũ, quyền vào Windows OS, hoặc SSAS/SSIS/SSRS trên cùng máy thì chỉ có VM (IaaS) đáp ứng. MI có SSIS qua Azure-SSIS IR nhưng không host SSRS/SSAS."},
{id:130,d:1,t:"SQL on VM",q:"You are attaching premium SSD data disks to a SQL Server VM. Which two host caching settings should you apply?",
 o:["ReadOnly caching on the disks holding data files","No caching on the disks holding transaction log files","ReadWrite caching on the disks holding data files","ReadWrite caching on the disks holding transaction log files","ReadOnly caching on the disks holding transaction log files"],a:[0,1],
 e:"Data file: ReadOnly caching (đọc từ cache nhanh hơn Azure Blob storage rất nhiều). Log file: None vì ghi tuần tự. **ReadWrite không được dùng** cho file SQL Server vì không bảo đảm data consistency."},
{id:131,d:1,t:"SQL on VM",q:"On a SQL Server VM you must create a Storage Spaces volume for archive and backup files, optimising capacity rather than performance. Which resiliency type should you use, and what is its minimum disk count?",
 o:["Parity, with at least three physical disks","Mirror, with at least two physical disks","Simple, with at least one physical disk","Parity, with at least two physical disks"],a:0,
 e:"Simple: ≥1 đĩa, không resiliency. Mirror: ≥2 đĩa, dùng cho phần lớn deployment. Parity: ≥3 đĩa, stripe kèm parity — tiết kiệm dung lượng, phù hợp archive và backup."},
{id:132,d:1,t:"SQL on VM",q:"A SQL Server VM has 16 vCPUs and a tempdb-heavy workload. Which two configuration choices follow the best practice for tempdb?",
 o:["Create eight tempdb data files — one per core, capped at eight","Place the tempdb files on the local SSD (the D: drive)","Create sixteen tempdb data files, one per core with no cap","Create twelve tempdb data files, matching Azure SQL Managed Instance","Place the tempdb files on the same premium SSD as the user database data files"],a:[0,1],
 e:"Best practice: 1 tempdb data file mỗi core nhưng **tối đa 8 file**, và đặt tempdb trên ổ D: (local SSD, ephemeral) để tận dụng I/O nhanh."},
{id:133,d:1,t:"SQL on VM",q:"After registering a SQL Server VM with the SQL IaaS Agent extension in full manageability mode, which two capabilities become available?",
 o:["Automated Backup","Automated Patching","Automatic failover to a secondary region","Query Store on every database","Hyperscale storage"],a:[0,1],
 e:"SQL IaaS Agent extension cung cấp Automated Backup, Automated Patching, tích hợp Azure Key Vault và hiển thị cấu hình SQL Server trong portal. Failover vẫn phải tự dựng bằng AG/FCI."},
{id:134,d:1,t:"SQL on VM",q:"Which storage account redundancy option does Microsoft recommend for the storage account used by a SQL Server VM?",
 o:["Locally redundant storage (LRS)","Geo-redundant storage (GRS)","Read-access geo-redundant storage (RA-GRS)","Geo-zone-redundant storage (GZRS)"],a:0,
 e:"Dùng LRS cho storage account của SQL Server VM. Geo-redundant replicate không đồng bộ giữa các region nên có thể phá vỡ write-order của file database."},
{id:135,d:1,t:"SQL on VM",q:"Which Azure VM series is the usual starting point for a relational database server?",
 o:["Memory optimized","Compute optimized","General purpose","Storage optimized"],a:0,
 e:"Memory optimized có tỉ lệ memory/CPU cao (tới 4 TB RAM) nên phù hợp relational database, cache lớn và in-memory analytics."},
{id:136,d:1,t:"Compression",q:"A 4 TB columnstore fact table holds seven years of data that is queried perhaps twice a year but must be retained for regulatory reasons. When is COLUMNSTORE_ARCHIVE compression the right choice?",
 o:["For exactly this pattern — data that is rarely read but must be kept","For OLTP tables that are constantly read and written","For any table smaller than 1000 rows","For data that must be queried with sub-second latency"],a:0,
 e:"Archival compression tiết kiệm rất nhiều dung lượng nhưng chi phí CPU giải nén vượt cả phần I/O tiết kiệm được, nên chỉ dùng cho dữ liệu ít đọc cần lưu giữ."},
{id:137,d:1,t:"Compression",q:"You are estimating the benefit of row compression on a table. Which two column definitions will benefit least?",
 o:["`varchar(200)`","`nvarchar(max)`","`decimal(19,4)`","`datetime2(3)`","`nchar(10)`"],a:[0,1],
 e:"Row compression tối ưu numeric (trừ `tinyint`), datetime/datetime2/datetimeoffset và char/nchar bằng cách bỏ byte trắng. `varchar`/`nvarchar` đã là kiểu độ dài biến đổi nên gần như không hưởng lợi."},
{id:138,d:1,t:"Compression",q:"`ALTER TABLE ... REBUILD WITH (DATA_COMPRESSION = PAGE)` fails on one table in the database. Which table characteristic prevents data compression?",
 o:["The table contains SPARSE columns","The table is a heap with no clustered index","The table has three nonclustered indexes","The table is referenced by an indexed view"],a:0,
 e:"Không nén được bảng có **SPARSE column** (và không nén được system table). Heap, clustered/nonclustered index và indexed view đều nén được."},
{id:139,d:1,t:"Compression",q:"You must estimate how much space page compression would save on the nonclustered indexes of `Sales.Orders`, before applying it. You call `sys.sp_estimate_data_compression_savings`. What must you pass for `@index_id`?",
 o:["A value greater than 1, because 0 means the heap, 1 means the clustered index and NULL means every index of the table","0, which is the only value that covers indexes","1, which always means 'all nonclustered indexes'","NULL, which is the only value accepted for indexes"],a:0,
 e:"`@index_id`: 0 = heap, 1 = clustered index, > 1 = nonclustered index cụ thể, NULL = toàn bộ bảng và index của nó. Lưu ý cập nhật: procedure này **đã được hỗ trợ** trên Azure SQL Database và MI (tài liệu cũ ghi là chỉ có trên SQL Server)."},
{id:140,d:1,t:"Migration",q:"You must migrate an on-premises Oracle database to Azure SQL Database, converting schema and objects. Which tool should you use?",
 o:["SQL Server Migration Assistant (SSMA)","Data Migration Assistant (DMA)","Database Experimentation Assistant (DEA)","Azure Migrate"],a:0,
 e:"SSMA dùng cho nguồn **không phải SQL Server**: Access, DB2, MySQL, Oracle, SAP ASE. DMA dùng cho SQL Server → Azure SQL."},
{id:141,d:1,t:"Migration",q:"Before a migration you must capture the production workload, replay it against the proposed target and compare performance. Which tool should you use?",
 o:["Database Experimentation Assistant (DEA)","Data Migration Assistant (DMA)","Azure Migrate","Query Performance Insight"],a:0,
 e:"DEA capture workload trên nguồn, replay và so sánh giữa hai môi trường để phát hiện regression cũng như vấn đề tương thích."},
{id:142,d:1,t:"Migration",q:"Leadership wants a discovery and sizing report for 300 SQL Server instances, plus cost estimates, before choosing between VM and PaaS targets. Which tool should you use?",
 o:["Azure Migrate","Data Migration Assistant","SQL Server Migration Assistant","Database Experimentation Assistant"],a:0,
 e:"Azure Migrate discover và assess cả data estate ở quy mô lớn: đưa ra khuyến nghị deployment target, sizing và ước tính chi phí; nó cũng là công cụ lift-and-shift sang VM."},
{id:143,d:1,t:"Migration",n:"s16-2",q:"You are opening firewall rules for Azure Database Migration Service. Which two outbound ports may the service require?",
 o:["443 (TCP)","1434 (UDP)","3306 (TCP)","5432 (TCP)","59999 (TCP)"],a:[0,1],
 e:"DMS cần outbound **443 (HTTPS)** và có thể cần **1434 (UDP)** để dò named instance. 3306 là MySQL, 5432 là PostgreSQL; 59999 là probe port của internal load balancer trong cấu hình availability group."},
{id:144,d:1,t:"Migration",n:"s16-2",q:"Which permissions must the account used by Azure Database Migration Service hold?",
 o:["CONTROL SERVER on the source SQL Server and CONTROL DATABASE on the target Azure SQL database","sysadmin on both the source and the target","db_owner on the target only","VIEW SERVER STATE on the source and db_datawriter on the target"],a:0,
 e:"DMS cần **CONTROL SERVER** trên nguồn và **CONTROL DATABASE** trên đích. Đây là quyền tối thiểu, không cần sysadmin trên Azure SQL (và với SQL Database thì cũng không tồn tại)."},
{id:145,d:1,t:"Migration",n:"s16-2",q:"Your backup strategy for the source database is weekly full, nightly differential and 15-minute log backups. What must you change before an Azure Database Migration Service migration?",
 o:["Nothing about the fulls and logs, but DMS ignores differential backups so the chain must not depend on them","DMS must be allowed to take its own full backup first","Only differential backups may be used","All backups must be converted to snapshot backups"],a:0,
 e:"DMS **không tự tạo backup nào**; nó dùng full và log backup có sẵn và **không dùng differential**. Chuỗi restore phải đi từ full rồi các log backup."},
{id:146,d:1,t:"Migration",n:"s16-2",q:"An Azure Database Migration Service migration must keep the source online and continuously sync changes until a short cutover. Which pricing tier is required?",
 o:["Premium","Standard","Basic","Free"],a:0,
 e:"Standard miễn phí nhưng chỉ offline (one-time). Premium hỗ trợ cả online (continuous) migration và nhanh hơn."},
{id:147,d:1,t:"Migration",n:"s16-2",q:"In Data Migration Assistant, you must find features that are partially supported or unsupported on the target and would therefore block the migration. Which assessment option should you select?",
 o:["Check database compatibility","Check feature parity","Migration scope: schema only","Data-tier application export"],a:0,
 e:"'Check database compatibility' liệt kê tính năng bị hỗ trợ một phần hoặc không hỗ trợ (có thể chặn migration). 'Check feature parity' gợi ý các tính năng tương đương ở Azure."},
{id:148,d:1,t:"Migration",n:"s18",q:"After migrating a database to Azure SQL Database, one critical stored procedure runs three times slower under compatibility level 160 than it did at level 130. Business requires a fix now, without changing the whole database's compatibility level. What should you do first?",
 o:["Force the last known good plan for that query","Set the compatibility level of the database back to 130","Drop and recreate every index on the affected tables","Move the database to Business Critical"],a:0,
 e:"Đúng quy trình: force last known good plan cho query bị regression, sau đó điều tra parameter sniffing và recompile procedure. Hạ compatibility level cả database làm mất mọi cải tiến optimizer khác."},
{id:149,d:1,t:"Migration",n:"s18",q:"Rank the platforms by feature completeness, from fewest features to most.",
 o:["Azure SQL Database → Azure SQL Managed Instance → SQL Server on VM or on-premises","SQL Server on-premises → Azure SQL Managed Instance → Azure SQL Database","Azure SQL Managed Instance → Azure SQL Database → SQL Server on VM","All three expose the same feature set"],a:0,
 e:"Azure SQL Database ít tính năng nhất, MI gần bằng SQL Server (surface area cao hơn SQL Database), còn SQL Server trên VM/on-prem đầy đủ nhất."},
{id:150,d:1,t:"Data Sync",q:"You are designing Azure SQL Data Sync between a hub in Azure and several member databases. Which two constraints must the design respect?",
 o:["Every synced table must have a primary key, and that primary key value must never be updated","Azure SQL Managed Instance cannot participate in a sync group","Each table must have change data capture enabled","The hub database must be in the Business Critical tier","All members must be in the same region as the hub"],a:[0,1],
 e:"Data Sync yêu cầu primary key trên mọi bảng và PK **không được sửa** (chỉ xoá rồi tạo lại dòng). MI không hỗ trợ Data Sync; member có thể ở region khác."},
{id:151,d:1,t:"Data Sync",q:"What are the requirements for the Sync Metadata Database in an Azure SQL Data Sync topology?",
 o:["An empty Azure SQL Database in the same region as the hub database","Any Azure SQL Managed Instance in any region","The hub database itself, using a dedicated schema","An on-premises SQL Server database with change tracking enabled"],a:0,
 e:"Sync Metadata Database chứa metadata và log của sync group; phải là Azure SQL Database **cùng region với hub** và nên là database rỗng, chuyên dụng."},
{id:152,d:1,t:"Data Sync",q:"The same row is updated in the hub and in two member databases between sync cycles. Which conflict resolution policies can you configure?",
 o:["Hub wins or Member wins","Newest write wins or Oldest write wins","Manual review or Automatic merge","Primary wins or Secondary wins"],a:0,
 e:"Chỉ có 'Hub wins' hoặc 'Member wins'. Với nhiều member, kết quả cuối phụ thuộc thứ tự sync của từng member, nên hãy coi Data Sync là eventual consistency."},
{id:153,d:1,t:"Migration",n:"s22",q:"You must hand an external auditor a single file containing both the schema and the data of an Azure SQL database. What should you produce?",
 o:["A BACPAC, by exporting a data-tier application","A DACPAC, by extracting a data-tier application","A BAK file, by running `BACKUP DATABASE`","An MDF and LDF file pair, by detaching the database"],a:0,
 e:"BACPAC chứa **schema + data** (export data-tier application, hoặc `sqlpackage.exe`). DACPAC chỉ chứa schema — nó là artifact dùng cho pipeline triển khai."},
{id:154,d:1,t:"Migration",n:"s22",q:"You must import a BACPAC into an Azure SQL Managed Instance. Which statement is true?",
 o:["The Azure portal cannot import into (or export from) a managed instance, so use SSMS or SqlPackage","The portal supports it, but only for databases under 1 GB","BACPAC files cannot be imported into a managed instance by any tool","Import requires the database to be in the Business Critical tier"],a:0,
 e:"Azure portal không hỗ trợ export/import BACPAC với MI. Dùng SSMS (Import Data-tier Application) hoặc `SqlPackage` từ máy có kết nối tới MI."},
{id:155,d:1,t:"Migration",n:"s22",q:"Which cmdlet exports an Azure SQL database to a BACPAC in Azure Blob Storage?",
 o:["`New-AzSqlDatabaseExport`","`New-AzSqlDatabaseImport`","`Backup-AzSqlDatabase`","`Export-AzSqlDatabaseTde`"],a:0,
 e:"`New-AzSqlDatabaseExport` export, `New-AzSqlDatabaseImport` import. Azure CLI dùng `az sql db export` / `az sql db import`."},
{id:156,d:1,t:"MI copy/move",q:"You must relocate a database between two Azure SQL Managed Instances, and the original database must be dropped once the operation completes. Which two statements apply?",
 o:["You should choose Move rather than Copy, because Move drops the source database at the end","The operation is cancelled — and the target database dropped — if you do not complete it within 24 hours","You should choose Copy, because only Copy transfers the data","The operation has no time limit once seeding has started","Both the source and the target stay read/write and in sync until you complete the operation"],a:[0,1],
 e:"Copy giữ database gốc online (hai bản độc lập, đều read/write); Move drop bản gốc sau khi hoàn tất. Nếu không bấm 'Ready for completion' rồi 'Complete' trong **24 giờ**, thao tác bị hủy và database đích bị drop."},
{id:157,d:1,t:"Resource",q:"Finance compares an elastic pool with a set of single databases. What is the correct statement about unit price?",
 o:["An eDTU in a pool costs 1.5 times a DTU for a single database, while a vCore costs the same in both","An eDTU and a DTU cost the same, while a vCore in a pool costs 1.5 times more","Pools are always 50% cheaper per unit","Pools are only available on the DTU model"],a:0,
 e:"eDTU pool có đơn giá 1.5x so với DTU của single database (bù lại chia sẻ được giữa nhiều database), còn vCore pool cùng đơn giá với single database."},
{id:158,d:1,t:"Resource",q:"Forty departmental databases each spike at a different time of day and are idle otherwise. You must minimise cost while keeping every database responsive during its own peak. What should you do?",
 o:["Put the databases in an elastic pool so they share resources and the pool autoscales","Deploy each database as a single database and scale each one manually","Consolidate all the data into one large single database","Move each database to its own managed instance"],a:0,
 e:"Elastic pool đúng cho pattern peak lệch nhau: các database chia sẻ tài nguyên nên tổng chi phí thấp hơn nhiều single database phải mua đủ cho peak riêng. Single database không autoscale (trừ serverless)."},
/* ---------- 2. Implement a secure environment (15–20%) ---------- */
{id:201,d:2,t:"Authentication",q:"An application runs on a physical server in a partner's datacentre. The server is not in Azure and is not joined to your Active Directory domain, and the security policy forbids passwords in connection strings. Which authentication method should the application use to reach Azure SQL Database?",
 o:["Certificate-based authentication with a service principal","A system-assigned managed identity","Passwordless authentication using the signed-in developer account","SQL authentication with a strong password rotated monthly"],a:0,
 e:"Theo decision tree: app trên Azure resource → managed identity; máy ngoài Azure có domain-join → managed identity qua Arc; **máy ngoài Azure không domain-join → certificate**; chỉ khi không sửa được connection string mới dùng SQL authentication."},
{id:202,d:2,t:"Authentication",q:"Your company already runs AD FS and has a sign-in requirement that Microsoft Entra ID cannot satisfy natively. Which hybrid identity model should you choose?",
 o:["Federated authentication","Cloud-only authentication","Password hash synchronisation","Pass-through authentication"],a:0,
 e:"Federated khi cần tích hợp federation provider có sẵn hoặc có yêu cầu sign-in mà Entra ID không hỗ trợ. Cloud-only khi Entra xử lý hoàn toàn trên cloud; pass-through cho phần lớn trường hợp còn lại."},
{id:203,d:2,t:"Authentication",q:"An auditor asks why you are migrating applications away from SQL Server authentication. Which technical argument is correct?",
 o:["SQL authentication transmits the user name and password in plain text, whereas Entra ID authentication does not","SQL authentication cannot be used at all in Azure SQL Database","SQL logins cannot be granted database permissions","SQL authentication does not support encrypted connections"],a:0,
 e:"SQL Server authentication gửi username/password ở dạng plain text (nên bắt buộc dựa vào TLS để bảo vệ). Entra ID an toàn hơn, hỗ trợ MFA và conditional access, và có thể sync với Windows Server AD on-prem."},
{id:204,d:2,t:"Users & logins",q:"You must give a Microsoft Entra ID group named `Analysts` read access to one Azure SQL database, following Microsoft's recommended practice. Which statement should you run, and where?",
 o:["`CREATE USER [Analysts] FROM EXTERNAL PROVIDER;` in the target database","`CREATE LOGIN [Analysts] FROM EXTERNAL PROVIDER;` in master, then `CREATE USER ... FOR LOGIN` in the database","`EXEC sp_adduser 'Analysts';` in the target database","Add the group on the database's Security tab in the Azure portal"],a:0,
 e:"Với Azure SQL Database, best practice là tạo **contained user** trực tiếp trong database: `CREATE USER ... FROM EXTERNAL PROVIDER`. Cách tạo login ở master rồi map user vẫn chạy nhưng làm database kém portable."},
{id:205,d:2,t:"Users & logins",q:"A junior DBA cannot find where to create a database user in the Azure portal. Which two statements should you explain to them?",
 o:["Database users can only be created with T-SQL, never from the portal","SQL Server logins can only be created with T-SQL, never from the portal","Database users can be created on the database's Security blade, but only for managed instances","Assigning the SQL DB Contributor role at subscription level creates the matching database user automatically","Contained users can be created in the portal, while users mapped to a login cannot"],a:[0,1],
 e:"Portal không tạo được database user cũng không tạo được SQL login — chỉ dùng T-SQL. Điều portal làm được là chỉ định **Microsoft Entra ID admin** cho logical server hoặc MI."},
{id:206,d:2,t:"Users & logins",q:"You need a database principal that can own objects and be granted permissions, cannot log in at all, and does not prevent the database from being moved to another server. Which principal type should you create?",
 o:["A SQL user without login","A SQL user with password","A user mapped to a SQL Server login","A Windows user"],a:0,
 e:"'SQL user without login' không có password, không đăng nhập được, nhưng vẫn nhận được permission (thường dùng với `EXECUTE AS`) và giữ database portable — hợp lệ trong Azure SQL Database và contained database."},
{id:207,d:2,t:"Users & logins",q:"Only one type of administrator can create contained database users that map to Microsoft Entra ID users and groups. Which one?",
 o:["The Microsoft Entra ID administrator configured for the server","Any member of the sysadmin fixed server role","Any member of db_owner in the database","Any member of the securityadmin fixed server role"],a:0,
 e:"Cả SQL admin lẫn Entra admin đều tạo được user từ SQL login và contained user dùng SQL auth. Nhưng **chỉ Entra ID administrator** tạo được contained user dựa trên Entra user/group."},
{id:208,d:2,t:"Server roles",q:"An ETL account on a managed instance must be able to run `BULK INSERT` but must not receive any other elevated privilege. Which fixed server role should you use?",
 o:["bulkadmin","dbcreator","serveradmin","setupadmin"],a:0,
 e:"`bulkadmin` cho phép `BULK INSERT`. `dbcreator` create/alter/drop/restore database; `setupadmin` quản linked server; `diskadmin` quản disk file; `processadmin` kill process."},
{id:209,d:2,t:"Server roles",q:"Why should membership of the securityadmin fixed server role be treated as equivalent to sysadmin?",
 o:["It can GRANT, DENY and REVOKE server-level permissions, so it can grant itself almost anything","It can restore any database over any other database","It owns every schema in every database","It bypasses DENY on the public role"],a:0,
 e:"`securityadmin` cấp/thu hồi quyền cấp server (và quyền cấp database nếu có quyền vào database đó) — tức có thể tự nâng quyền cho chính nó. Vì vậy hãy coi nó tương đương sysadmin."},
{id:210,d:2,t:"Database roles",q:"An operator must be able to back up one database on an Azure SQL Managed Instance without any other administrative rights. Which fixed database role should you use, and what is the caveat?",
 o:["db_backupoperator — the role is meaningless on Azure SQL Database, where BACKUP is not supported","db_owner — no lesser role can issue BACKUP","db_securityadmin — it also covers backup permissions","db_ddladmin — BACKUP is treated as a DDL operation"],a:0,
 e:"`db_backupoperator` back up được trên MI và SQL Server VM. Trên Azure SQL Database không có lệnh `BACKUP`/`RESTORE` nên role này không có tác dụng."},
{id:211,d:2,t:"Database roles",q:"Which risk must you document before adding a developer to db_securityadmin?",
 o:["The member can elevate its own permissions, even though it can only modify membership of custom roles","The member can drop the database","The member inherits full sysadmin rights on the instance","The member can read every table regardless of DENY"],a:0,
 e:"`db_securityadmin` quản permission và sửa membership của **custom role** (không phải fixed role) — nhưng chính vì quản được permission nên nó có thể tự nâng quyền của mình."},
{id:212,d:2,t:"Database roles",q:"A service principal must create and drop databases on an Azure SQL Database logical server, but must not be able to create logins. Which role should you grant, and in which database?",
 o:["dbmanager, in the master database","loginmanager, in the master database","dbcreator, in the master database","db_owner, in each user database"],a:0,
 e:"Trong master của Azure SQL Database có hai role đặc biệt: `dbmanager` (tạo/xoá database, kết nối như dbo) và `loginmanager` (tạo/xoá login). `dbcreator` là fixed server role, không có trên SQL Database."},
{id:213,d:2,t:"Permissions",q:"A user is a member of two roles: one is granted SELECT on `dbo.Salary`, the other is denied SELECT on the same table. Which two statements about the outcome are true?",
 o:["DENY normally overrides GRANT, so a user in this situation cannot read the table","If the user owns the table, or is a member of sysadmin, the DENY does not stop them","The GRANT wins, because an explicit GRANT is evaluated after DENY","The result depends on which role was created first","REVOKE on the second role would have exactly the same effect as DENY"],a:[0,1],
 e:"DENY ghi đè GRANT — **trừ** với sysadmin và với object owner. Nếu user không phải owner thì DENY thắng; DENY trên role `public` sẽ chặn mọi principal không phải sysadmin."},
{id:214,d:2,t:"Permissions",q:"You must remove an explicitly granted SELECT permission from a user but still allow the user to read the table through membership of `db_datareader`. Which statement should you use?",
 o:["REVOKE","DENY","GRANT ... WITH GRANT OPTION","ALTER ROLE ... DROP MEMBER"],a:0,
 e:"REVOKE chỉ gỡ quyền đã cấp trực tiếp; quyền có được từ role khác vẫn còn. DENY thì chặn tuyệt đối, kể cả quyền đến từ role."},
{id:215,d:2,t:"Permissions",q:"Which single permission on a table gives a principal owner-like capability, including ALTER, SELECT, INSERT, UPDATE and DELETE?",
 o:["CONTROL","ALTER","TAKE OWNERSHIP","REFERENCES"],a:0,
 e:"CONTROL bao gồm mọi quyền khác trên securable đó và tương đương quyền của owner. TAKE OWNERSHIP chỉ *cho phép* nhận quyền sở hữu, chứ không tự động chuyển."},
{id:216,d:2,t:"Permissions",q:"A developer must create a foreign key in `dbo.Orders` that references `dbo.Customer`, but must not be able to read `dbo.Customer`. Which permission on `dbo.Customer` do they need?",
 o:["REFERENCES","SELECT","CONTROL","VIEW DEFINITION"],a:0,
 e:"REFERENCES là quyền cần để tạo FOREIGN KEY tới bảng đó, không kèm quyền đọc dữ liệu. VIEW DEFINITION chỉ cho xem metadata."},
{id:217,d:2,t:"Permissions",n:"s29-2",q:"You must let a support team run `dbo.usp_CloseTicket`, which updates three tables, without granting any permission on those tables. Which mechanism makes this possible?",
 o:["Ownership chaining — the procedure and the tables share the same owner, so permissions on the tables are not re-checked","Row-level security with a block predicate","Dynamic data masking on the underlying tables","Ledger tables, which allow writes through verified procedures only"],a:0,
 e:"Khi procedure và các bảng cùng owner, SQL Server không kiểm tra lại quyền trên object thứ hai — nhờ vậy chỉ cần GRANT EXECUTE trên procedure. Nếu khác owner thì chuỗi bị phá và phải cấp quyền trực tiếp."},
{id:218,d:2,t:"Permissions",q:"Which statement grants SELECT on a single column?",
 o:["`GRANT SELECT ON OBJECT::dbo.Customer(CustomerName) TO Phillip;`","`GRANT SELECT ON COLUMN::dbo.Customer.CustomerName TO Phillip;`","`GRANT SELECT(CustomerName) ON DATABASE::Sales TO Phillip;`","`GRANT COLUMN SELECT ON dbo.Customer.CustomerName TO Phillip;`"],a:0,
 e:"Cú pháp cấp quyền cột: `GRANT SELECT ON OBJECT::Schema.Table(Column) TO principal`. Securable class có thể là `OBJECT::`, `SCHEMA::`, `DATABASE::` hoặc `SERVER::`."},
{id:219,d:2,t:"Permissions",n:"s29-2",q:"A team lead must be able to pass on the SELECT permission they hold to other users in their team, without being made a member of db_securityadmin. What should you add to the GRANT statement?",
 o:["`WITH GRANT OPTION`","`AS OWNER`","`WITH CASCADE`","`WITH DELEGATION`"],a:0,
 e:"`WITH GRANT OPTION` cho phép grantee cấp lại chính quyền đó cho người khác. Khi REVOKE quyền này thì phải dùng `CASCADE` để thu hồi cả những quyền đã cấp tiếp."},
{id:220,d:2,t:"Permissions",q:"You are connected as an application login and want to list the permissions your own session currently holds at database scope. What should you run?",
 o:["`SELECT * FROM sys.fn_my_permissions(NULL, 'DATABASE');`","`SELECT * FROM sys.database_principals;`","`EXEC sp_helprole;`","`SELECT * FROM sys.fn_builtin_permissions(DEFAULT);`"],a:0,
 e:"`fn_my_permissions(NULL,'DATABASE')` trả về quyền hiệu lực của session hiện tại. `fn_builtin_permissions(DEFAULT)` chỉ liệt kê danh mục mọi permission tồn tại, không phải quyền của bạn."},
{id:221,d:2,t:"Permissions",n:"s29-2",q:"Before a release you must verify what a specific application user can and cannot do, from your own admin session. Which approach should you use?",
 o:["`EXECUTE AS USER = 'AppUser';` run the tests, then `REVERT;`","Reset the application user's password and log in as that user","`SET USER = 'AppUser';` and reconnect","Grant yourself IMPERSONATE and query `sys.database_permissions`"],a:0,
 e:"`EXECUTE AS USER = '...'` đổi security context ngay trong session, chạy kiểm thử rồi `REVERT`. Trên MI/VM có thể dùng `EXECUTE AS LOGIN` nếu là sysadmin."},
{id:222,d:2,t:"Permissions",n:"s25",q:"A script that documents permissions works on a managed instance but fails on Azure SQL Database. Which two procedures are unavailable there?",
 o:["`sp_helprotect`","`sp_helprolemember`","`sp_helprole`","`sp_executesql`","`sp_rename`"],a:[0,1],
 e:"`sp_helprotect` (quyền của user trên object) và `sp_helprolemember` (thành viên trực tiếp của role) không có trên Azure SQL Database. Thay bằng `sys.database_permissions` và `sys.database_role_members`."},
{id:223,d:2,t:"Custom roles",q:"Which statement adds a user to a database role in a way that works on Azure SQL Database?",
 o:["`ALTER ROLE db_datareader ADD MEMBER [AppUser];`","`EXEC sp_addrolemember 'db_datareader', 'AppUser';`","`GRANT ROLE db_datareader TO [AppUser];`","`CREATE ROLE db_datareader FOR [AppUser];`"],a:0,
 e:"`ALTER ROLE ... ADD MEMBER` (hoặc `DROP MEMBER`) là cú pháp hiện hành; cần quyền ALTER trên role, ALTER ANY ROLE, hoặc là thành viên db_securityadmin/db_owner. `sp_addrolemember` đã deprecated."},
{id:224,d:2,t:"Certificates",q:"You run `CREATE CERTIFICATE` without specifying `ENCRYPTION BY PASSWORD`, `START_DATE` or `EXPIRY_DATE`. Which two statements are true?",
 o:["The private key is encrypted with the database master key","The certificate expires one year after its start date, which defaults to the current UTC date","The private key is encrypted with the service master key","The private key is left unencrypted until you run `ALTER CERTIFICATE`","The certificate never expires unless an expiry date is set"],a:[0,1],
 e:"Không có `ENCRYPTION BY PASSWORD` thì private key được mã hoá bằng **database master key**. `START_DATE` mặc định là ngày hiện tại (UTC) và `EXPIRY_DATE` mặc định là một năm sau đó."},
{id:225,d:2,t:"Certificates",q:"A certificate's subject is wrong and it expires too soon. What can `ALTER CERTIFICATE` change?",
 o:["Only the private key password — not the subject and not the dates","The subject and the expiry date, but not the private key","Every property of the certificate","Only the expiry date"],a:0,
 e:"`ALTER CERTIFICATE ... WITH PRIVATE KEY (ENCRYPTION BY PASSWORD = ...)` chỉ đổi được password của private key. Muốn đổi SUBJECT hay các mốc thời gian thì phải drop và tạo lại certificate."},
{id:226,d:2,t:"TDE",q:"An auditor asks you to explain the difference between TDE and TLS in one sentence. Which answer is correct?",
 o:["TDE encrypts data at rest at page level as it is written and read; TLS encrypts data in transit between client and server","TDE encrypts data in transit and TLS encrypts data at rest","Both encrypt data at rest, but TDE also covers backups","TDE encrypts individual columns and TLS encrypts individual tables"],a:0,
 e:"TDE mã hoá/giải mã ở mức **page** khi ghi/đọc — bảo vệ dữ liệu at rest, gồm cả data file, log file và backup. TLS bảo vệ dữ liệu **in transit**."},
{id:227,d:2,t:"TDE",q:"You restore a production Azure SQL database into a test database using point-in-time restore, then run a compliance check. Which statement about TDE is correct?",
 o:["TDE is set at server level and new databases are encrypted by default, while a database created by restore or copy inherits the encryption state of its source","TDE is enabled per database and must be turned on manually every time","TDE applies to the whole subscription once it is enabled on one server","TDE cannot be disabled once the server has it enabled"],a:0,
 e:"Với Azure SQL Database, TDE đặt ở **server level** và database mới được mã hoá mặc định. Database sinh ra từ restore hoặc database copy thì **kế thừa trạng thái mã hoá của nguồn** — nên nếu nguồn không mã hoá, bản mới cũng không, phải kiểm tra lại `sys.dm_database_encryption_keys`. Với MI thì cấu hình ở instance level."},
{id:228,d:2,t:"TDE",q:"You must enable TDE on a database hosted on Azure SQL Managed Instance. How should you do it?",
 o:["Run `ALTER DATABASE [Db1] SET ENCRYPTION ON;`, because the portal cannot enable TDE for a managed instance","Toggle Transparent data encryption to On on the database blade in the portal","Run `EXEC sp_configure 'tde', 1;` followed by `RECONFIGURE`","Enable it in the Azure portal at instance level; per-database control is not available"],a:0,
 e:"Với MI không dùng portal được cho từng database — dùng `ALTER DATABASE ... SET ENCRYPTION ON/OFF`. Lưu ý: **không** thể chuyển TDE protector sang key trong Key Vault bằng T-SQL."},
{id:229,d:2,t:"TDE",q:"Which database cannot be protected by TDE?",
 o:["A system database","A database larger than 1 TB","A database inside an elastic pool","A database using the Simple recovery model"],a:0,
 e:"TDE không mã hoá system database. Cơ chế: một symmetric Database Encryption Key (DEK) mã hoá dữ liệu, và DEK được bảo vệ bởi TDE protector — certificate do service quản lý hoặc asymmetric key trong Key Vault (BYOK)."},
{id:230,d:2,t:"Firewall",q:"An application connects to `db1` on an Azure SQL logical server. A server-level rule allows 20.1.1.0–20.1.1.255 and a database-level rule on `db1` allows only 20.1.1.50. Which two statements are true?",
 o:["Database-level rules are evaluated first; if the address matches one, server-level rules are not consulted","A server-level rule grants access to every database on the logical server, so database-level rules are the way to restrict an application to one database","Server-level rules are always evaluated before database-level rules","Both rule sets are evaluated and the most restrictive one wins","Database-level rules are ignored whenever a server-level rule exists"],a:[0,1],
 e:"Database rule được kiểm tra **trước** server-level rule. Server rule mở cho mọi database trên server; database rule dùng để giới hạn một app/user cụ thể tới đúng một database."},
{id:231,d:2,t:"Firewall",q:"How do you create a database-level firewall rule, and what permission is required?",
 o:["With T-SQL (`sp_set_database_firewall_rule`), and CONTROL DATABASE permission","With the Azure portal, and Contributor on the resource group","With PowerShell only, and SQL Security Manager","With Azure CLI, and Network Contributor"],a:0,
 e:"Database firewall rule chỉ tạo được bằng T-SQL (`sp_set_database_firewall_rule`) và cần CONTROL DATABASE. Phải có ít nhất một server-level rule tồn tại trước đó."},
{id:232,d:2,t:"Firewall",q:"A server-level firewall rule has start IP and end IP both set to 0.0.0.0. What does this mean?",
 o:["Azure services and resources are allowed to bypass the server-level firewall","All internet addresses are allowed","All access is blocked","Only connections from the same virtual network are allowed"],a:0,
 e:"Rule 0.0.0.0 tương ứng với công tắc 'Allow Azure services and resources to access this server' trong portal — cho phép mọi Azure service (kể cả của subscription khác) bỏ qua firewall, nên hãy dùng thận trọng."},
{id:233,d:2,t:"Firewall",q:"Where are server-level firewall rules for Azure SQL Database stored, and how do you list them?",
 o:["In the master database, via `sys.firewall_rules`","In each user database, via `sys.database_firewall_rules`","In the msdb database, via `sys.firewall_rules`","In Azure Resource Manager only; T-SQL cannot list them"],a:0,
 e:"Server-level rule lưu trong master (`sys.firewall_rules`); database-level rule lưu trong chính database đó (`sys.database_firewall_rules`)."},
{id:234,d:2,t:"Always Encrypted",q:"A `NationalId` column must be encrypted with Always Encrypted, and queries must still be able to join on it, group by it and use an index. Which two requirements must the design meet?",
 o:["The column must use deterministic encryption","A `_BIN2` collation must be used, because the column is a string type","The column must use randomized encryption","The database must be in the Business Critical service tier","The column must be part of the clustered index key"],a:[0,1],
 e:"Deterministic cho phép equality join, GROUP BY, DISTINCT và index — yêu cầu collation `_BIN2` với cột chuỗi. Randomized an toàn hơn nhưng chặn hết các thao tác đó."},
{id:235,d:2,t:"Always Encrypted",q:"You connect to a database with Always Encrypted columns from SSMS but see only ciphertext. What must you add?",
 o:["`Column Encryption Setting=enabled` in Additional Connection Parameters","`Encrypt=strict` in Additional Connection Parameters","`Always Encrypted=true` on the Connection Properties tab","`TrustServerCertificate=true` in Additional Connection Parameters"],a:0,
 e:"Trong tab **Additional Connection Parameters** nhập `Column Encryption Setting=enabled` để driver giải mã bằng column master key mà nó truy cập được."},
{id:236,d:2,t:"Always Encrypted",q:"Your organisation requires role separation: the security administrator holds the keys but must have no access to the data, while the DBA manages metadata but must never see the keys. Which tool must you use to configure Always Encrypted?",
 o:["PowerShell","SQL Server Management Studio","The Azure portal","Azure Data Studio"],a:0,
 e:"Chỉ PowerShell cho phép tách hai vai trò (Security Admin tạo key, DBA tạo metadata). Nếu cùng một người làm cả hai thì SSMS hay PowerShell đều được."},
{id:237,d:2,t:"Always Encrypted",q:"Which permission is required to create or drop a column master key?",
 o:["ALTER ANY COLUMN MASTER KEY","ALTER ANY COLUMN ENCRYPTION KEY","VIEW ANY COLUMN MASTER KEY DEFINITION","CONTROL DATABASE"],a:0,
 e:"ALTER ANY COLUMN MASTER KEY cho column master key; ALTER ANY COLUMN ENCRYPTION KEY cho column encryption key; các quyền `VIEW ANY ... DEFINITION` chỉ để đọc metadata."},
{id:238,d:2,t:"Secure enclaves",q:"You must run rich computations (pattern matching and range comparisons) directly on Always Encrypted columns while keeping the plaintext unavailable to the Database Engine. The database must remain on a standard General Purpose SKU with no attestation service. Which enclave technology fits?",
 o:["VBS enclaves","Intel SGX enclaves","Confidential ledger","Azure Key Vault Managed HSM"],a:0,
 e:"Intel SGX yêu cầu Azure SQL Database **DC-series** và Microsoft Azure Attestation. VBS enclave có ở mọi SKU của Azure SQL Database (kể cả elastic pool) và SQL Server 2019+, không cần attestation — bù lại mức cách ly yếu hơn SGX."},
{id:239,d:2,t:"Secure enclaves",q:"A colleague asks you to turn 'Enable secure enclaves' back off on a database after testing. What should you tell them?",
 o:["It cannot be switched off once it has been switched on","It can be switched off in the portal at any time","It can be switched off with T-SQL only","It switches itself off when the last enclave-enabled key is dropped"],a:0,
 e:"Sau khi bật, thiết lập 'Enable secure enclaves' **không thể tắt lại**. Nếu môi trường test cần trạng thái ban đầu thì phải tạo database mới."},
{id:240,d:2,t:"Dynamic Data Masking",q:"You apply the default mask to a `varchar` column, an `int` column and a `date` column. Which set of masked values will users see?",
 o:["`XXXX`, `0` and `01-01-1900`","`XXXX`, `NULL` and `NULL`","`****`, `0` and `1900-01-01 00:00:00`","`NULL` for all three"],a:0,
 e:"Mask mặc định: `XXXX` cho string, `0` cho numeric, `01-01-1900` cho date/time."},
{id:241,d:2,t:"Dynamic Data Masking",q:"Reporting users must see masked email addresses, but two integration accounts must see the real values. Which two statements are true about Dynamic Data Masking?",
 o:["Administrators always see the unmasked data and cannot be masked","You can grant the UNMASK permission to the integration accounts","Masking rewrites the stored data, so the original values are unrecoverable","Masking prevents the integration accounts from inferring values through WHERE clauses","Masking must be configured per user session"],a:[0,1],
 e:"DDM chỉ che kết quả lúc trả về, dữ liệu gốc không đổi, và admin luôn thấy dữ liệu thật. Loại trừ user bằng danh sách hoặc `GRANT UNMASK`. Lưu ý DDM **không** chống việc suy luận qua predicate — đó là lý do nó không thay thế được mã hoá."},
{id:242,d:2,t:"Dynamic Data Masking",q:"Which statement applies an email mask to an existing column?",
 o:["`ALTER TABLE dbo.Customer ALTER COLUMN Email ADD MASKED WITH (FUNCTION = 'email()');`","`ALTER TABLE dbo.Customer ALTER COLUMN Email SET MASK = 'email';`","`CREATE MASK ON dbo.Customer(Email) WITH email();`","`EXEC sp_add_mask 'dbo.Customer', 'Email', 'email()';`"],a:0,
 e:"Cú pháp: `ADD MASKED WITH (FUNCTION = '...')` với các hàm `default()`, `email()`, `random(1,1000)`, `partial(1,\"xxxxx\",1)`. Bỏ mask bằng `DROP MASKED`."},
{id:243,d:2,t:"Private Link",q:"You are creating a private endpoint for an Azure SQL logical server that lives in West Europe, while the consuming virtual network is in North Europe. What must be true?",
 o:["The private endpoint must be in the same region as the virtual network, but the target service may be in another region","The private endpoint, the virtual network and the SQL server must all be in the same region","The private endpoint must be in the same region as the SQL server","Private endpoints cannot be used across regions at all"],a:0,
 e:"Private endpoint phải cùng region (và cùng subscription) với **virtual network**, còn service đích có thể ở region khác. Toàn bộ traffic đi qua backbone Microsoft, không ra internet."},
{id:244,d:2,t:"Private Link",q:"Which target sub-resource must you select when creating a private endpoint for a database on an Azure SQL logical server?",
 o:["`sqlServer`","`sqlDatabase`","`managedInstance`","`sqlPool`"],a:0,
 e:"Private endpoint của Azure SQL Database dùng sub-resource `sqlServer` (một endpoint phục vụ mọi database trên logical server đó). `managedInstance` là sub-resource của MI."},
{id:245,d:2,t:"TLS",q:"Compliance requires the minimum TLS version on all Azure SQL logical servers to be 1.2. Which two options set it?",
 o:["The SQL server resource in the portal, under Security – Networking – Connectivity","`Set-AzSqlServer -MinimalTlsVersion 1.2` (or `az sql server update --set minimalTlsVersion=\"1.2\"`)","The Transparent data encryption blade of each database","`ALTER DATABASE SCOPED CONFIGURATION SET MIN_TLS_VERSION = 1.2`","The connection string of every client application"],a:[0,1],
 e:"Minimum TLS version đặt ở cấp **logical server** (không phải database): portal Security – Networking – Connectivity, hoặc `Set-AzSqlServer -MinimalTlsVersion`, hoặc `az sql server update --set minimalTlsVersion`."},
{id:246,d:2,t:"TLS",q:"Which TLS version is the most widely deployed, uses SHA-256, and is the usual minimum you should enforce?",
 o:["TLS 1.2","TLS 1.0","TLS 1.1","SSL 3.0"],a:0,
 e:"TLS 1.2 (2008) dùng SHA-256 và là bản phổ biến nhất; TLS 1.3 (2018) nhanh hơn nhưng chưa phải mặc định ở mọi driver. TLS 1.0/1.1 đã bị deprecate từ khoảng 2020."},
{id:247,d:2,t:"Classification",q:"An analyst with the Reader role complains they cannot change a column's sensitivity label. Which roles can modify data classification?",
 o:["Owner, Contributor and SQL Security Manager","Reader and User Access Administrator","Owner only","SQL DB Contributor and Reader"],a:0,
 e:"Owner, Contributor và SQL Security Manager đọc và sửa được classification. Reader cùng User Access Administrator **chỉ đọc**."},
{id:248,d:2,t:"Classification",q:"Which statement adds a sensitivity classification to a column?",
 o:["`ADD SENSITIVITY CLASSIFICATION TO dbo.Customer.Email WITH (LABEL='Confidential', INFORMATION_TYPE='Contact Info', RANK=MEDIUM);`","`ALTER TABLE dbo.Customer ADD CLASSIFICATION ON Email WITH (LABEL='Confidential');`","`EXEC sp_add_classification 'dbo.Customer', 'Email', 'Confidential';`","`CREATE SENSITIVITY LABEL Confidential FOR dbo.Customer.Email;`"],a:0,
 e:"`ADD SENSITIVITY CLASSIFICATION TO ... WITH (LABEL, INFORMATION_TYPE, RANK)`; RANK nhận NONE, LOW, MEDIUM, HIGH, CRITICAL. Kiểm tra kết quả trong `sys.sensitivity_classifications`."},
