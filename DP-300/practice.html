 e:"sp_updatestats cập nhật statistics cho mọi user-defined và internal table."},
{d:3,t:"DBCC",q:"Which commands does DBCC CHECKDB run internally?",
 o:["DBCC CHECKALLOC, DBCC CHECKTABLE for all tables and indexed views, and DBCC CHECKCATALOG","DBCC CHECKTABLE only","DBCC CHECKALLOC and DBCC CHECKCONSTRAINTS","DBCC CHECKIDENT and DBCC CHECKFILEGROUP"],a:0,
 e:"CHECKDB chạy CHECKALLOC (cấu trúc cấp phát disk), CHECKTABLE (mọi bảng và indexed view), CHECKCATALOG (nhất quán catalog). Sau đó nên chạy DBCC CHECKCONSTRAINTS để kiểm tra referential integrity."},
{d:3,t:"DBCC",q:"Which DBCC CHECKDB repair option may cause data loss?",
 o:["REPAIR_ALLOW_DATA_LOSS","REPAIR_REBUILD","REPAIR_FAST","NOINDEX"],a:0,
 e:"REPAIR_ALLOW_DATA_LOSS sửa mọi lỗi tìm thấy nhưng có thể mất dữ liệu — cần SET EMERGENCY rồi SINGLE_USER trước. REPAIR_REBUILD chỉ sửa những gì không gây mất dữ liệu. REPAIR_FAST không làm gì, chỉ giữ để tương thích ngược."},
{d:3,t:"DBCC",q:"Which DBCC CHECKDB WITH option performs no checks and only reports the tempdb space required?",
 o:["ESTIMATEONLY","PHYSICAL_ONLY","NO_INFOMSGS","TABLOCK"],a:0,
 e:"ESTIMATEONLY không kiểm tra, chỉ ước tính tempdb cần. PHYSICAL_ONLY giới hạn kiểm tra ở page structure và record header. TABLOCK lấy exclusive lock — nhanh hơn nhưng giảm concurrency."},
{d:3,t:"DBCC",q:"Which syntax is correct when passing a name to DBCC CHECKDB and DBCC CHECKTABLE?",
 o:["DBCC CHECKDB (MyDatabase) without quotes; DBCC CHECKTABLE ('TableName') with quotes","Both take quotes","Neither takes quotes","CHECKDB takes quotes, CHECKTABLE does not"],a:0,
 e:"DBCC CHECKDB (MyDatabase) và DBCC CHECKCATALOG (NameOfDatabase) KHÔNG dùng nháy. DBCC CHECKTABLE ('TableName') thì có nháy (là chuỗi). DBCC CHECKDB(0) = database hiện tại."},
{d:3,t:"DBCC",q:"On which objects does DBCC CHECKCATALOG NOT work?",
 o:["tempdb and Filestream data","User databases","Indexed views","Tables with a clustered index"],a:0,
 e:"DBCC CHECKCATALOG không hoạt động trên tempdb hay Filestream data (BLOB trên file system)."},
{d:3,t:"Auto-tuning",q:"When does FORCE_LAST_GOOD_PLAN trigger?",
 o:["When plan regression is detected and the estimated gain is over 10 seconds, or the new plan has more errors","After every recompilation","When CPU exceeds 80%","Every 24 hours"],a:0,
 e:"FORCE_LAST_GOOD_PLAN (bật mặc định trên Azure SQL Database và MI) ép dùng plan tốt gần nhất khi có regression, với estimated gain > 10 giây hoặc plan mới nhiều lỗi hơn."},
{d:3,t:"Auto-tuning",q:"Which automatic tuning feature is NOT available on Azure SQL Managed Instance?",
 o:["CREATE_INDEX and DROP_INDEX","FORCE_LAST_GOOD_PLAN","Query Store","Automatic patching"],a:0,
 e:"CREATE INDEX và DROP INDEX tự động chỉ có trên Azure SQL Database, không có trên MI. FORCE_LAST_GOOD_PLAN có ở cả hai."},
{d:3,t:"Auto-tuning",q:"Indexes are only auto-created when resources are below which threshold?",
 o:["CPU, data I/O and log I/O are all below 80%","CPU is below 50%","Only when the database is completely idle","There is no threshold"],a:0,
 e:"Index chỉ được auto-create khi CPU, data I/O và log I/O đều dưới 80%. Xem index tự tạo bằng SELECT * FROM sys.indexes WHERE auto_created = 1. Nếu không cải thiện hiệu năng, index sẽ tự bị drop."},
{d:3,t:"Auto-tuning",q:"Which view contains tuning recommendations?",
 o:["sys.dm_db_tuning_recommendations","sys.dm_db_missing_index_details","sys.database_query_store_options","sys.dm_db_index_usage_stats"],a:0,
 e:"SELECT * FROM sys.dm_db_tuning_recommendations cho các khuyến nghị. Cấu hình bằng ALTER DATABASE ... SET AUTOMATIC_TUNING = AUTO | INHERIT | CUSTOM."},
{d:3,t:"Resource Governor",q:"Where can Resource Governor be used?",
 o:["On VMs and Azure SQL MI; it exists in Azure SQL Database but is not configurable","Azure SQL Database only","It is configurable in every deployment","On VMs only"],a:0,
 e:"Resource Governor có trong Azure SQL Database nhưng KHÔNG cấu hình được. Trên VM và MI thì cấu hình được để cân bằng CPU, physical I/O và memory giữa các workload."},
{d:3,t:"Resource Governor",q:"Which two resource pools are created when SQL Server is installed?",
 o:["internal and default","system and user","primary and secondary","admin and guest"],a:0,
 e:"Hai pool tạo sẵn: internal và default. Không bật Resource Governor thì session mới vào default workload group, request hệ thống vào internal group."},
{d:3,t:"Resource Governor",q:"What is the difference between MAX_CPU_PERCENT and CAP_CPU_PERCENT?",
 o:["MAX_CPU_PERCENT is a maximum AVERAGE that applies only under contention; CAP_CPU_PERCENT is a hard limit","The reverse: CAP is the average, MAX is the hard limit","They are the same thing","CAP applies to memory only"],a:0,
 e:"MAX_CPU_PERCENT là maximum AVERAGE CPU và chỉ áp dụng khi tổng yêu cầu vượt 100%. CAP_CPU_PERCENT là hard limit."},
{d:3,t:"Resource Governor",q:"After creating a resource pool or registering a classifier function, which statement must be run?",
 o:["ALTER RESOURCE GOVERNOR RECONFIGURE;","EXEC sp_configure 'resource governor', 1;","DBCC FREEPROCCACHE;","Restart the SQL Server service"],a:0,
 e:"Luôn phải ALTER RESOURCE GOVERNOR RECONFIGURE; sau khi thay đổi. Classifier function đăng ký bằng ALTER RESOURCE GOVERNOR WITH (CLASSIFIER_FUNCTION = dbo.fn...)."},
{d:3,t:"Scoped config",q:"What is the default MAXDOP for a new Azure SQL Database?",
 o:["8","0","1","4"],a:0,
 e:"MAXDOP mặc định của Azure SQL Database mới là 8 — phù hợp cho hầu hết workload điển hình. MAXDOP quá cao có thể khiến query mới bị đói tài nguyên."},
{d:3,t:"Scoped config",q:"What does OPTIMIZE_FOR_AD_HOC_WORKLOADS do?",
 o:["It stores a compiled plan stub the first time a batch is compiled, using less memory","It recompiles every query","It disables parameter sniffing","It forces legacy cardinality estimation"],a:0,
 e:"Lần compile đầu chỉ lưu plan stub (nhỏ hơn nhiều). Khi batch được compile/chạy lại thì mới thay bằng full compiled plan — tiết kiệm plan cache."},
{d:3,t:"Scoped config",q:"What does LAST_QUERY_PLAN_STATS enable or disable?",
 o:["Actual execution plans in sys.dm_exec_query_plan_stats","Query Store","Lightweight profiling","The plan cache"],a:0,
 e:"LAST_QUERY_PLAN_STATS bật/tắt actual execution plan trong sys.dm_exec_query_plan_stats."},
{d:3,t:"Scoped config",q:"Who does the FOR SECONDARY clause of ALTER DATABASE SCOPED CONFIGURATION apply to?",
 o:["Geo-replicated secondary databases — they all share that configuration","The first secondary only","Availability group replicas","Elastic pools"],a:0,
 e:"FOR SECONDARY áp dụng cho các geo-replicated secondary database, và tất cả chúng dùng chung cùng một cấu hình."},
{d:3,t:"DB options",q:"When does AUTO_SHRINK trigger, and should it be enabled?",
 o:["When more than 25% of the file is free space; it is recommended to leave it OFF","When more than 50% is free; it should be on","Every night; it should be on","When the file exceeds 1 GB; it should be on"],a:0,
 e:"AUTO_SHRINK shrink khi hơn 25% file là unused space. Khuyến nghị để OFF vì gây fragmentation và tốn tài nguyên."},
{d:3,t:"DB options",q:"Which recovery model only minimally logs large-scale bulk operations?",
 o:["BULK_LOGGED","FULL","SIMPLE","MINIMAL"],a:0,
 e:"FULL dùng transaction log backup. BULK_LOGGED chỉ minimally log các thao tác bulk lớn. SIMPLE chỉ cho phép complete backup, không có log backup."},
{d:3,t:"DB options",q:"Who can connect when a database is set to RESTRICTED_USER?",
 o:["Members of db_owner, plus dbcreator and sysadmin — any number of them","Only one user at a time","Any user with appropriate permissions","sysadmin only"],a:0,
 e:"SINGLE_USER: chỉ 1 user cùng lúc. RESTRICTED_USER: chỉ db_owner, dbcreator, sysadmin (số lượng bất kỳ). MULTI_USER: mọi user có quyền."},
{d:3,t:"DB options",q:"What is the lowest compatibility level that can be set on Azure SQL Database and MI?",
 o:["100 (SQL Server 2008/R2)","90 (SQL Server 2005)","110 (SQL Server 2012)","130 (SQL Server 2016)"],a:0,
 e:"Trên Azure SQL Database, MI và SQL Server 2014 trở lên, không đặt được compatibility level thấp hơn 100 (SQL Server 2008). 150 = SQL Server 2019."},
{d:3,t:"Autogrowth",q:"What does AUTOGROW_ALL_FILES do at filegroup level?",
 o:["When any file in the filegroup hits its autogrow threshold, ALL files in the filegroup grow","Only the full file grows","It disables autogrowth for the filegroup","It doubles every file monthly"],a:0,
 e:"ALTER DATABASE ... MODIFY FILEGROUP FilegroupName AUTOGROW_ALL_FILES: nếu bất kỳ file nào chạm ngưỡng autogrow thì mọi file trong filegroup đều tăng."},
{d:3,t:"Free space",q:"In sys.database_files, what does max_size = -1 mean?",
 o:["Unlimited","The file is corrupt","The file is read-only","The size is zero"],a:0,
 e:"max_size = -1 nghĩa là unlimited. Dùng EXEC sp_spaceused để xem dung lượng đã dùng và unallocated space."},
{d:3,t:"Free space",q:"What information does DBCC SQLPERF (LOGSPACE) show?",
 o:["Transaction log space statistics only","All data and log space","tempdb pages by session","Index fragmentation"],a:0,
 e:"DBCC SQLPERF (LOGSPACE) chỉ hiển thị thống kê transaction log space. Với tempdb dùng sys.dm_db_session_space_usage và sys.dm_db_task_space_usage."},
{d:3,t:"IQP",q:"What error rate does APPROX_COUNT_DISTINCT guarantee?",
 o:["Up to a 2% error rate, within a 97% probability","Up to 5%, within 95% probability","Up to 1%, within 99% probability","No guarantee is given"],a:0,
 e:"APPROX_COUNT_DISTINCT đảm bảo sai số tối đa 2% trong 97% xác suất. Dùng khi cần phản hồi nhanh và không cần độ chính xác tuyệt đối. Cách duy nhất để 'tắt' là không dùng hàm đó."},
{d:3,t:"IQP",q:"From where is TSQL_SCALAR_UDF_INLINING enabled by default?",
 o:["Azure or SQL Server 2019+, at compatibility level 150+","SQL Server 2017, level 140","Every version","SQL Server 2022, level 160"],a:0,
 e:"Scalar UDF inlining bật mặc định trên Azure hoặc SQL Server 2019+ với compatibility level 150+. Tắt cho một UDF cụ thể bằng WITH INLINE = OFF trước 'AS BEGIN'."},
{d:3,t:"IQP",q:"How does BATCH_MODE_MEMORY_GRANT_FEEDBACK adjust memory?",
 o:["If a query spills to disk it grants more memory next time; if over 50% is wasted it grants less","It always doubles the grant","It fixes the grant from statistics","It only ever increases, never decreases"],a:0,
 e:"Memory grant feedback: nếu query spill to disk thì cấp thêm memory cho lần chạy sau; nếu lãng phí hơn 50% memory thì giảm bớt."},
{d:3,t:"IQP",q:"What problem does INTERLEAVED_EXECUTION_TVF solve?",
 o:["It uses the actual cardinality of a multi-statement TVF instead of a fixed guess of 100 rows","It speeds up scalar UDFs","It converts row mode to batch mode","It re-allocates memory grants"],a:0,
 e:"INTERLEAVED_EXECUTION_TVF dùng cardinality thực tế của multi-statement table valued function ở lần compile đầu, thay vì đoán cố định (100 dòng từ SQL Server 2014). Câu lệnh phải read-only."},
{d:3,t:"IQP",q:"DEFERRED_COMPILATION_TV is like INTERLEAVED_EXECUTION_TVF, but for what, and replacing which default guess?",
 o:["Table variables, replacing a fixed guess of 1 row","Temp tables, replacing a guess of 100 rows","CTEs, replacing a guess of 1000 rows","Scalar UDFs, replacing a guess of 1 row"],a:0,
 e:"DEFERRED_COMPILATION_TV áp dụng cho Table Variable — dùng cardinality thực tế thay cho giá trị đoán cố định 1 dòng."},
{d:3,t:"IQP",q:"Which view shows which database-scoped configurations are enabled?",
 o:["sys.database_scoped_configurations","sys.configurations","sys.databases","sys.dm_os_sys_info"],a:0,
 e:"sys.database_scoped_configurations cho cấu hình cấp database. sys.configurations cho cấu hình cấp server (đổi bằng sp_configure — không dùng được trên Azure SQL Database)."},
{d:3,t:"Index maintenance",q:"On an Azure VM, which tool analyses a workload and recommends indexes?",
 o:["Database Engine Tuning Advisor","Automatic tuning in the Portal","Query Performance Insight","Azure Advisor"],a:0,
 e:"Trên VM dùng Database Engine Tuning Advisor (Tools – Database Engine Tuning Advisor), cấp cho nó Query Store hoặc file .sql chứa workload rồi Start Analysis."},

/* ---------- 4. Configure and manage automation of tasks ---------- */
{d:4,t:"SQL Agent",q:"How does SQL Server Agent behave on Azure SQL Managed Instance?",
 o:["It is always running and does not need to be enabled, but lacks some on-premises functionality","It must be started manually after each restart","It does not exist on MI","It runs only when a job is scheduled"],a:0,
 e:"Trên MI, SQL Server Agent luôn chạy, không cần enable. Nó không có đủ 100% chức năng của on-prem nhưng có hầu hết. Azure SQL Database KHÔNG có SQL Agent."},
{d:4,t:"SQL Agent",q:"Which schedule option is NOT supported on Azure SQL Managed Instance?",
 o:["Start automatically when SQL Server Agent starts","Recurring daily","One time","Start whenever the CPUs become idle"],a:0,
 e:"'Start automatically when SQL Server Agent starts' không được hỗ trợ trên MI. Các lựa chọn khác (One time, Recurring, CPU idle) thì có."},
{d:4,t:"SQL Agent",q:"In sp_add_schedule, what does @freq_type = 8 mean?",
 o:["Weekly","Daily","Monthly by day of month","Once"],a:0,
 e:"@freq_type: 1 = Once, 4 = Daily, 8 = Weekly, 16 = Monthly (ngày trong tháng), 32 = Monthly relative (ví dụ Chủ nhật thứ X), 64 = khi SQL Agent khởi động, 128 = khi máy rảnh."},
{d:4,t:"SQL Agent",q:"In sp_add_schedule, which value means 'when the computer is idle'?",
 o:["128","64","32","16"],a:0,
 e:"@freq_type = 128 là 'When computer is idle'; 64 là 'When SQL Agent service starts'."},
{d:4,t:"SQL Agent",q:"Which stored procedure attaches an existing schedule to a job?",
 o:["sp_attach_schedule","sp_add_schedule","sp_add_jobschedule","sp_update_job"],a:0,
 e:"sp_add_schedule tạo schedule, sp_attach_schedule gắn nó vào job (@job_name, @schedule_name). Cả hai chạy trong msdb."},
{d:4,t:"SQL Agent",q:"Where in SSMS do you see when jobs have run?",
 o:["SQL Server Agent – Job Activity Monitor","Management – Extended Events","Reports – Standard Reports","Object Explorer – Databases – msdb"],a:0,
 e:"Job Activity Monitor cho biết job đã chạy khi nào. Cũng có thể query msdb.dbo.sysschedules để xem các schedule."},
{d:4,t:"Notifications",q:"In sp_add_notification, what does @notification_method = 1 mean?",
 o:["Email","Pager","Net Send","Windows event log"],a:0,
 e:"@notification_method: 1 = Email, 2 = Pager, 4 = Net Send. Pager và Net Send đã bị deprecate."},
{d:4,t:"Notifications",q:"At what level do SQL Agent job notifications apply?",
 o:["The entire job, not individual steps","Each individual step","The database","The server"],a:0,
 e:"Notification cấu hình cho toàn bộ job (khi fail, succeed, hoặc complete), không phải cho từng step riêng lẻ. Email/pager phải được tạo trước."},
{d:4,t:"Database Mail",q:"On Azure SQL Managed Instance, what must the Database Mail profile be named in order to send mail from SQL Agent jobs?",
 o:["AzureManagedInstance_dbmail_profile","DefaultProfile","SQLAgentMailProfile","MI_dbmail"],a:0,
 e:"Trên MI, profile phải tên chính xác là AzureManagedInstance_dbmail_profile nếu muốn gửi email từ SQL Agent job. Database Mail đã bật sẵn trên MI."},
{d:4,t:"Database Mail",q:"After creating a Database Mail profile, which msdb role must the user be added to?",
 o:["DatabaseMailUserRole","db_datawriter","SQLAgentOperatorRole","msdb_mailsender"],a:0,
 e:"Thêm user vào DatabaseMailUserRole trong msdb, và đặt profile đó làm default profile cho msdb ('Default Profile' = Yes trong Manage Profile Security)."},
{d:4,t:"ARM/Bicep",q:"What is Bicep?",
 o:["A Domain Specific Language using declarative syntax, an extension of the ARM template language","A scripting language replacing PowerShell","An Azure CI/CD service","A compression format for ARM templates"],a:0,
 e:"Bicep là DSL dùng declarative syntax để deploy tài nguyên Azure, mở rộng từ ARM template language. ARM template viết bằng JSON."},
{d:4,t:"ARM/Bicep",q:"Which Azure CLI command converts an ARM template to Bicep?",
 o:["az bicep decompile --file myfile.json","az bicep build --file myfile.json","az bicep convert","az deployment create --bicep"],a:0,
 e:"az bicep decompile --file myfile.json (hoặc nút 'Decompile'). Chiều ngược lại — Bicep sang ARM — dùng Bicep Playground."},
{d:4,t:"ARM/Bicep",q:"Which ARM template resource type is used for Azure SQL Managed Instance?",
 o:["Microsoft.Sql/managedInstances","Microsoft.Sql/servers","Microsoft.SqlVirtualMachine/sqlVirtualMachines","Microsoft.SqlManagedInstance/instances"],a:0,
 e:"Microsoft.Sql/servers và Microsoft.Sql/servers/databases cho SQL Database; Microsoft.Sql/managedInstances cho MI; Microsoft.Compute/virtualMachines + Microsoft.SqlVirtualMachine/sqlVirtualMachines cho VM."},
{d:4,t:"PowerShell",q:"Which cmdlet creates an Azure SQL Managed Instance?",
 o:["New-AzSqlInstance","New-AzSqlServer","New-AzSqlDatabase","New-AzVM"],a:0,
 e:"New-AzSqlServer tạo logical server; New-AzSqlDatabase tạo database; New-AzSqlInstance tạo MI; New-AzVM tạo Azure VM."},
{d:4,t:"Azure CLI",q:"Which Azure CLI command creates an Azure SQL Database?",
 o:["az sql db create","az sql server create","az sql mi create","az vm create"],a:0,
 e:"az group create → az sql server create → az sql db create. Với MI dùng az sql mi; với VM dùng az vm create."},
{d:4,t:"Deployment",q:"In an Azure Pipeline, which artifact is used to deploy a database?",
 o:["A DACPAC (data-tier application portable artifact), added to azure-pipelines.yml","A BACPAC","A BAK file","An MDF file"],a:0,
 e:"Dùng DACPAC trong Azure Pipeline, thêm vào azure-pipelines.yml. Cũng có thể dùng SQL script kết hợp PowerShell."},
{d:4,t:"Elastic Jobs",q:"What is an Elastic Job agent, and what is it the equivalent of in SQL Server?",
 o:["An Azure resource that runs jobs — the equivalent of SQL Agent Jobs, for Azure SQL Database which has no SQL Agent","A VM running SQL Agent","An extension of Managed Instance","A service within Azure Data Factory"],a:0,
 e:"Elastic Job agent (miễn phí) là tương đương của SQL Agent Jobs cho Azure SQL Database — nơi SQL Agent không tồn tại. MI thì đã có SQL Agent."},
{d:4,t:"Elastic Jobs",q:"What is the minimum service tier for the Elastic Jobs job database?",
 o:["Standard S0 or above (S1+ recommended)","Basic","Premium P1","Any tier"],a:0,
 e:"Job database phải là Standard (S0 trở lên) hoặc Premium; khuyến nghị S1+ và cao hơn nếu chạy job thường xuyên hoặc target group lớn. Nó bị tính phí như một Azure SQL Database."},
{d:4,t:"Elastic Jobs",q:"What property must Elastic Job step scripts have?",
 o:["They must be idempotent — capable of running twice with the same result","They must run in an explicit transaction","They must be under 8000 characters","They must be read-only"],a:0,
 e:"Script phải idempotent — chạy lại nhiều lần vẫn cho cùng kết quả."},
{d:4,t:"Elastic Jobs",q:"How long is Elastic Jobs job history kept, and where?",
 o:["45 days, in jobs.job_executions","30 days, in msdb","90 days, in Log Analytics","7 days, in Azure Storage"],a:0,
 e:"Job history lưu 45 ngày trong jobs.job_executions. Job output có thể lưu vào một bảng."},
{d:4,t:"Elastic Jobs",q:"Which stored procedure creates a target group for Elastic Jobs?",
 o:["jobs.sp_add_target_group","jobs.sp_add_job","jobs.sp_add_jobstep","jobs.sp_start_job"],a:0,
 e:"jobs.sp_add_target_group tạo group, jobs.sp_add_target_group_member thêm thành viên (@target_type = 'SqlDatabase', 'SqlServer' hoặc 'PoolGroup'; @membership_type = 'Exclude' nếu muốn loại trừ)."},
{d:4,t:"Elastic Jobs",q:"Where can Elastic Jobs targets be located?",
 o:["In different servers, subscriptions or regions, but they must be in the same Azure cloud","Only within the same server","Only within the same subscription","Anywhere, including other clouds"],a:0,
 e:"Target có thể ở server, subscription hay region khác nhau nhưng phải cùng một Azure cloud. Có thể là một hoặc nhiều database, tất cả database trong một server/elastic pool, hoặc shard map."},
{d:4,t:"Multi-server",q:"In multi-server automation, how many master servers can a target server be linked to?",
 o:["Only one","Up to two","Any number","Up to five"],a:0,
 e:"Một target server chỉ liên kết được với MỘT master server. MSX là viết tắt của Master Server."},
{d:4,t:"Multi-server",q:"Where do you create a master server for multi-server automation?",
 o:["Right-click SQL Server Agent – Multi Server Administration – Make this a Master","Right-click the server – Properties – Multi Server","Azure Portal – SQL Server – Automation","Management – Policy Management"],a:0,
 e:"Right-click SQL Server Agent – Multi Server Administration – Make this a Master (hoặc Make this a Target với target server). Multi-server automation dùng cho MI và VM, không phải Azure SQL Database."},
{d:4,t:"VM backup",q:"What does Automated Backup version 2 on an Azure VM require?",
 o:["Windows Server 2012 R2 or higher and SQL Server 2016+ Standard/Enterprise/Developer","Windows Server 2012 and SQL Server 2014","Any version","SQL Server Enterprise only"],a:0,
 e:"Version 1: Windows Server 2012 + SQL Server 2014 Standard/Enterprise. Version 2: Windows Server 2012 R2+ và SQL Server 2016+ Standard/Enterprise/Developer."},
{d:4,t:"VM backup",q:"What is the maximum retention period for Automated Backup on an Azure VM?",
 o:["30 days","7 days","35 days","10 years"],a:0,
 e:"Retention period của Automated Backup trên VM tối đa 30 ngày. Bắt buộc dùng Full recovery model."},
{d:4,t:"VM backup",q:"How does Automated Backup on a VM behave when there are several named instances but no default instance?",
 o:["It will fail","It backs up the first instance","It backs up all instances","It creates a default instance"],a:0,
 e:"Có thể backup default instance hoặc MỘT named instance duy nhất. Nếu không có default instance mà có nhiều named instance thì thao tác sẽ thất bại."},
{d:4,t:"Policies",q:"Which Policy-Based Management evaluation mode uses DDL triggers to block non-compliant changes?",
 o:["On change: prevent","On change: log","On demand","On schedule"],a:0,
 e:"'On change: prevent' dùng DDL trigger để chặn. 'On change: log' chỉ ghi vào event notification. Policy-Based Management không áp dụng cho Azure SQL Database hay MI."},
{d:4,t:"Policies",q:"In a policy condition, what does the condition you enter represent?",
 o:["The state that SHOULD exist — the policy fails if the condition is not true","The violation to detect","A default value","An alerting threshold"],a:0,
 e:"Condition mô tả trạng thái NÊN có; policy fail nếu điều kiện đó KHÔNG đúng. Lưu ý: != nghĩa là <>."},
{d:4,t:"Alerts",q:"Which SQL Server Agent alert type is based on an error number or severity?",
 o:["SQL Server event","WMI event alert","SQL Server performance condition","Metric alert"],a:0,
 e:"'SQL Server event' dựa trên error number hoặc severity. 'WMI event alert' dùng Windows Management Instrumentation. 'SQL Server performance condition' chọn Object, Counter, Instance và ngưỡng."},
{d:4,t:"Alerts",q:"In a SQL Agent alert, what does a delay between responses of 0 minutes and 0 seconds mean?",
 o:["You want a response for every occurrence of the alert","You never want a response","Only the first occurrence gets a response","A response every minute"],a:0,
 e:"Delay 0 phút 0 giây = muốn có response cho mỗi lần alert xảy ra."},
{d:4,t:"Alerts",q:"How does a dynamic threshold differ from a static threshold in an Azure alert rule?",
 o:["Dynamic learns the data and models it algorithmically, detecting seasonality (hourly, daily, weekly)","Dynamic is only for log alerts","Static is always more accurate","Dynamic does not need an action group"],a:0,
 e:"Dynamic threshold học dữ liệu, mô hình hóa và phát hiện pattern như seasonality (hourly, daily, weekly). Chọn sensitivity High (nhiều alert, sai lệch nhỏ), Medium (mặc định), Low (ít alert, sai lệch lớn)."},
{d:4,t:"Alerts",q:"What is the severity scale for an Azure alert rule?",
 o:["0 (Critical) to 4 (Verbose)","1 (Low) to 5 (High)","0 (Info) to 3 (Critical)","1 to 10"],a:0,
 e:"Severity từ 0 (Critical) tới 4 (Verbose)."},
{d:4,t:"Alerts",q:"What can an Azure alert action group contain?",
 o:["Email, SMS, Azure app Push Notifications and Voice, plus Automation Runbook, Azure Function, ITSM, Logic App and Webhook","Email only","Webhooks only","SMS and email only"],a:0,
 e:"Notification: Email, SMS, Push Notification, Voice. Actions: Automation Runbook, Azure Function, ITSM, Logic App, Webhook."},
{d:4,t:"Alerts",q:"Which deployment do SQL Server Agent event notifications apply to?",
 o:["SQL Server on a VM only — MI has SQL Agent but does not allow event notifications","Both Azure SQL Database and MI","Azure SQL Database only","All deployments"],a:0,
 e:"Event notification dùng SQL Server Agent nên chỉ áp dụng cho SQL Server VM. Azure SQL Database không có SQL Agent; MI có SQL Agent nhưng không cho phép event notification."},
{d:4,t:"Config changes",q:"To track server configuration changes made with sp_configure, which option must be enabled?",
 o:["sp_configure 'default trace enabled', 1 (after enabling 'show advanced options')","sp_configure 'audit level', 3","sp_configure 'track config', 1","Change Data Capture"],a:0,
 e:"Bật sp_configure 'show advanced options', 1 rồi RECONFIGURE, sau đó sp_configure 'default trace enabled', 1 rồi RECONFIGURE. Xem kết quả ở Reports – Standard Reports – Configuration Changes History."},
{d:4,t:"Logic Apps",q:"What does a workflow in Azure Logic Apps begin with?",
 o:["A trigger, followed by one or more actions","An action, followed by a trigger","A connection","A mandatory schedule"],a:0,
 e:"Workflow bắt đầu bằng trigger (dữ liệu mới được thêm, item được tạo/sửa trong SQL Server, hoặc theo lịch), rồi tiếp tục bằng nhiều action."},
{d:4,t:"Logic Apps",q:"Which connection type does NOT require a Gateway in Logic Apps?",
 o:["Azure SQL Database — a Gateway is only needed for on-premises SQL Server","Managed identity","Service principal","Azure AD Integrated"],a:0,
 e:"Với Azure SQL Database thì không cần Gateway; Gateway là cho SQL Server on-prem. Các loại authentication: Service principal, Logic Apps Managed Identity, Azure AD Integrated, SQL Server/Windows Authentication."},
{d:4,t:"Logic Apps",q:"How is the Logic Apps Consumption plan charged?",
 o:["About $1 per 40,000 actions, with the first 4,000 actions free","A flat $180 per month","It is completely free","By data volume"],a:0,
 e:"Standard: khoảng $180/tháng. Consumption: ~$1 cho 40.000 action và $1.25 cho 10.000 standard connector execution mỗi ngày; 4.000 action đầu tiên miễn phí."},
{d:4,t:"Automation",q:"How does patching work for PaaS (Azure SQL Database and MI)?",
 o:["Automatically — you do not control when, so use retry logic to minimise impact","You schedule it in the Portal","Only when you request it","Once per quarter at weekends"],a:0,
 e:"PaaS patch tự động; bạn không kiểm soát thời điểm nhưng tác động tối thiểu nếu dùng retry logic. Với database quorum, luôn có ít nhất 1 primary replica online; Business Critical và Premium còn có ít nhất 1 secondary replica online."},
{d:4,t:"SQL Agent",q:"Which button in a job step checks the T-SQL syntax before saving?",
 o:["Parse","Validate","Compile","Test"],a:0,
 e:"Trong tab Steps, sau khi nhập lệnh T-SQL, click 'Parse' để kiểm tra cú pháp. Mỗi step cần chọn database và user chạy lệnh."},
{d:4,t:"Notifications",q:"In sp_add_operator, what does @enabled = 1 mean?",
 o:["The operator is enabled","The operator receives email","The operator is an administrator","The operator uses a pager"],a:0,
 e:"@enabled = 1 là enabled, 0 là not enabled. Các tham số khác gồm @name và @email_address; vẫn còn tham số pager nhưng pager đã deprecate."},
{d:4,t:"Notifications",q:"Besides email and pager, what other job notification options exist?",
 o:["Write to the Windows Application event log, and Automatically delete job","Write to Query Store","Call a webhook","Send an SMS"],a:0,
 e:"Trong tab Notifications của job: Email, Page(r), 'Write to the Windows Application event log', và 'Automatically delete job' — kích hoạt khi job fails, succeeds hoặc completes."},
{d:4,t:"Elastic Jobs",q:"Which command runs an Elastic Job immediately?",
 o:["EXEC jobs.sp_start_job 'My first job'","EXEC jobs.sp_run_job","EXEC msdb.dbo.sp_start_job","EXEC jobs.sp_execute_job"],a:0,
 e:"jobs.sp_start_job chạy ngay. jobs.sp_update_job đặt lịch với @schedule_interval_type ('Minutes', 'Hours', 'Days', 'Weeks', 'Months', 'Once') và @schedule_interval_count."},
{d:4,t:"Elastic Jobs",q:"In the Elastic Job target database, which role must the JobU user be added to?",
 o:["db_owner","db_datareader","db_ddladmin","dbmanager"],a:0,
 e:"Trong target user database: CREATE USER JobU FROM LOGIN JobU rồi ALTER ROLE db_owner ADD MEMBER JobU. Trong master thì tạo login MasterU và JobU."},
{d:4,t:"Elastic Jobs",q:"If a target group targets a server or elastic pool, what must you supply?",
 o:["A master database credential so the databases can be enumerated","A manual list of databases","The job agent's managed identity","Nothing extra"],a:0,
 e:"Khi target là server hay elastic pool, mọi database trong đó tại thời điểm chạy job đều bị ảnh hưởng — cần credential của master database để enumerate. Dùng @refresh_credential_name khi target server/pool."},
{d:4,t:"Alerts",q:"Which values can aggregation granularity take in an Azure log alert rule?",
 o:["5, 10, 15, 30 or 45 minutes, 1-6 hours, or 1-2 days","Only 1, 5 or 15 minutes","Any value from 1 minute to 1 year","Hourly values only"],a:0,
 e:"Aggregation granularity và frequency of evaluation đều nhận: 5, 10, 15, 30, 45 phút, 1-6 giờ, hoặc 1-2 ngày. Aggregation type: Average, Total, Maximum, Minimum."},
{d:4,t:"Alerts",q:"In an alert rule, how does 'Aggregation granularity period' differ from 'Frequency of evaluation'?",
 o:["Granularity is how measures are grouped together; frequency is how often the check runs","They are the same thing","Granularity is the violation count; frequency is the threshold","Granularity applies only to dynamic thresholds"],a:0,
 e:"Aggregation granularity period = các measure được gộp lại theo khoảng thời gian nào. Frequency of evaluation = bao lâu thì kiểm tra một lần."},
{d:4,t:"Alerts",q:"How is an alert period displayed while it is 'unresolved'?",
 o:["The line turns from blue to red dots and the background turns light red","The chart disappears","The line turns grey","There is no visual change"],a:0,
 e:"Khoảng thời gian alert hiển thị màu khác khi 'unresolved': đường từ xanh dương sang chấm đỏ, nền chuyển đỏ nhạt. Bạn chọn được có tự động resolve alert hay không."},
{d:4,t:"Logic Apps",q:"Which actions are available for SQL Server in Logic Apps?",
 o:["Delete/Get/Insert/Update row, Get rows or tables, Execute an SQL query, Execute stored procedure","Insert and Update row only","Execute stored procedure only","Backup and Restore database"],a:0,
 e:"Action SQL Server: Delete/Get/Insert/Update row; Get rows hoặc tables; Execute an SQL query; Execute stored procedure. Control action gồm Conditions, Switch, For each, Until."},
{d:4,t:"Logic Apps",q:"Where do you view all API connections used across the subscription?",
 o:["Azure Portal – API connections (not inside the Logic App)","Logic App – API connections","Resource group – Connections","Azure Monitor – Connections"],a:0,
 e:"Logic App – API connections chỉ hiện connection của Logic App đó. Vào Azure Portal – API connections (không phải Logic App) để xem tất cả connection."},
{d:4,t:"VM automation",q:"What does 'Automatic SQL Server VM registration' do?",
 o:["It checks daily for unregistered VMs in the subscription and registers them in lightweight mode","It installs SQL Server on new VMs","It patches every VM automatically","It backs up every VM automatically"],a:0,
 e:"Kiểm tra hàng ngày xem có VM nào chưa đăng ký trong subscription không, và đăng ký ở lightweight mode. Muốn dùng đủ tính năng thì vẫn phải upgrade thủ công. Bật ở Azure Portal – SQL virtual machines – 'Automatic SQL Server VM registration'."},
{d:4,t:"Maintenance",q:"When enabling compression on a VM through SSMS, which Schedule options are offered?",
 o:["One time, recurring (Daily/Weekly/Monthly), when SQL Server Agent starts, or whenever the CPUs become idle","One time only","Daily and Weekly only","No schedule options are offered"],a:0,
 e:"Trên VM, Manage Compression cho phép Schedule: one time, recurring (Daily, Weekly, Monthly), khi SQL Server Agent starts, hoặc whenever the CPUs become idle."},

/* ---------- 5. Plan and implement a HA/DR environment ---------- */
{d:5,t:"SLA / RPO / RTO",q:"What are the RPO and RTO of an auto-failover group?",
 o:["RPO 5 seconds, RTO 1 hour","RPO 1 hour, RTO 12 hours","RPO 5 seconds, RTO 30 seconds","RPO 0, RTO 0"],a:0,
 e:"Geo-restore: RPO 1 giờ, RTO 12 giờ. Auto-failover group: RPO 5 giây, RTO 1 giờ. Manual database failover sang geo-replicated secondary: RPO 5 giây, RTO 30 giây."},
{d:5,t:"SLA / RPO / RTO",q:"What are the RPO and RTO of geo-restore from geo-replicated backups?",
 o:["RPO 1 hour, RTO 12 hours","RPO 5 seconds, RTO 1 hour","RPO 5 seconds, RTO 30 seconds","RPO 12 hours, RTO 1 hour"],a:0,
 e:"Geo-restore: RPO 1 giờ (có thể mất tới 1 giờ dữ liệu), RTO 12 giờ (mất tới 12 giờ mới dùng lại được)."},
{d:5,t:"SLA / RPO / RTO",q:"What do RPO and RTO mean?",
 o:["RPO is how much data you can lose; RTO is the maximum time until you can use it again","RPO is the recovery time; RTO is the data lost","Both measure downtime","RPO is the replica count; RTO is the region count"],a:0,
 e:"RPO (Recovery Point Objective) = bạn có thể mất bao nhiêu dữ liệu. RTO (Recovery Time Objective) = bao lâu thì dùng lại được, tức thời gian failover tối đa."},
{d:5,t:"SLA",q:"What is the SLA for Azure SQL Database Business Critical/Premium with a Zone Redundant Deployment?",
 o:["99.995%","99.99%","99.95%","99.9%"],a:0,
 e:"Các tier Azure SQL Database khác và MI: 99.99%. Business Critical/Premium có Zone Redundant Deployment: 99.995% (26 phút/năm)."},
{d:5,t:"SLA",q:"What is the Hyperscale SLA with ONE replica?",
 o:["99.95%","99.9%","99.99%","99.995%"],a:0,
 e:"Hyperscale: 99.9% với zero replica, 99.95% với một replica."},
{d:5,t:"SLA",q:"If the committed RTO is exceeded, what does the customer receive?",
 o:["A credit of 100% of the total monthly cost of the Secondary","A credit of 50% of the Primary cost","A full subscription refund","Nothing"],a:0,
 e:"Nếu vượt RTO, bạn được credit 100% tổng chi phí hàng tháng của Secondary."},
{d:5,t:"Hybrid HADR",q:"What does an Availability Group require in a hybrid environment?",
 o:["A domain controller VM (an Active Directory domain is required) and a VPN connection for the whole failover cluster","A VPN only","Server certificates only","Nothing special"],a:0,
 e:"AG cần Active Directory domain (nên cần domain controller VM), VPN connection cho toàn bộ failover cluster (multi-subnet failover cluster), và cho DR thì cần replica domain controller ở site DR. Failover ở cấp DATABASE, không phải instance."},
{d:5,t:"Hybrid HADR",q:"What advantage does database mirroring between an Azure VM and on-premises have over an Availability Group?",
 o:["No VPN is required and they need not be in the same Active Directory domain (server certificates are used)","It is faster","It supports more secondaries","It has better automatic failover"],a:0,
 e:"Database mirroring: Azure VM chạy SQL Server 2012+ và on-prem chạy SQL Server 2008 R2+, dùng server certificate. KHÔNG cần VPN và không cần cùng AD domain."},
{d:5,t:"Hybrid HADR",q:"What does log shipping between on-premises and an Azure VM require?",
 o:["A VPN tunnel, because log shipping requires Windows file sharing","Port 1433 only","A shared Active Directory domain","Azure ExpressRoute, mandatorily"],a:0,
 e:"Log shipping cần Windows file sharing nên phải có VPN tunnel. Secondary database nằm trên server thứ hai hoặc warm standby."},
{d:5,t:"FCI",q:"What does a Failover Cluster Instance (FCI) on Azure VMs provide?",
 o:["High availability, but NOT disaster recovery","Both HA and DR","DR only","Read scale-out"],a:0,
 e:"FCI cho HA nhưng không cho DR. Nó bảo vệ khỏi lỗi network card hoặc disk. Có 5 cấu hình: Azure shared disks (WS2019), Storage Spaces Direct (WS2016+), Premium File Share (WS2012+), giải pháp bên thứ ba, Azure ExpressRoute."},
{d:5,t:"Site Recovery",q:"What does Azure Site Recovery provide for SQL Server?",
 o:["Simple DR (not HA) for Azure VMs from a primary to a secondary region; not a SQL Server solution but usable with SQL on VMs","HA and DR for Azure SQL Database","Backup only","Automatic failover for MI"],a:0,
 e:"Azure Site Recovery: DR đơn giản (không phải HA) cho VM, replicate liên tục, có recovery point snapshot (bắt disk data, dữ liệu trong memory, transaction đang xử lý). Hữu ích chống ransomware. Không phải giải pháp SQL Server nhưng dùng với SQL trên VM được."},
{d:5,t:"Geo-replication",q:"How many readable secondaries can one Azure SQL Database primary have?",
 o:["4","2","8","Unlimited"],a:0,
 e:"Tối đa 4 secondary mỗi primary database, có thể ở region khác nhau. Cần nhiều hơn thì tạo secondary của secondary (replication tới đó chậm hơn)."},
{d:5,t:"Geo-replication",q:"When UPGRADING the service tier of a geo-replicated pair, which should you upgrade first?",
 o:["Upgrade the secondary first","Upgrade the primary first","Upgrade both simultaneously","The order does not matter"],a:0,
 e:"Khi upgrade thì nâng SECONDARY trước; khi downgrade thì hạ PRIMARY trước. Secondary phải có service tier ít nhất bằng primary."},
{d:5,t:"Geo-replication",q:"When must you disconnect secondaries before changing the service tier?",
 o:["When moving between General Purpose and Business Critical","On every tier change","When changing the vCore count","Never"],a:0,
 e:"Không cần disconnect secondary trừ khi chuyển giữa General Purpose và Business Critical."},
{d:5,t:"Geo-replication",q:"Which isolation mode do readable secondaries use?",
 o:["Snapshot isolation, so updates from the primary are not delayed by long-running queries on the secondary","Read committed","Serializable","Read uncommitted"],a:0,
 e:"Secondary dùng snapshot isolation mode, nhờ đó update từ primary không bị trì hoãn bởi long-running query trên secondary."},
{d:5,t:"Geo-replication",q:"How does geo-replication replicate changes, and how does that differ from transactional replication?",
 o:["It streams the transaction log; transactional replication executes DML commands (INSERT/UPDATE/DELETE)","It executes DML commands; transactional replication streams the log","Both stream the log","Both use snapshots"],a:0,
 e:"Geo-replication stream database transaction log. Transactional replication replicate bằng cách thực thi các lệnh DML như INSERT/UPDATE/DELETE."},
{d:5,t:"Failover group",q:"Which deployments can use auto-failover groups?",
 o:["Both Azure SQL Database and Managed Instance, but NOT VMs","Azure SQL Database only","Managed Instance only","All three, including VMs"],a:0,
 e:"Auto-failover group dùng cho Azure SQL Database và MI, không dùng cho SQL Server trên VM (VM thì dùng Availability Group)."},
{d:5,t:"Failover group",q:"How soon does automatic failover trigger?",
 o:["Not for at least 1 hour, since it may only be a minor outage","Immediately","After 5 minutes","After 24 hours"],a:0,
 e:"Auto-failover không xảy ra trong ít nhất 1 giờ (có thể chỉ là outage nhỏ). Khi đã xảy ra thì bản thân failover chỉ mất vài giây."},
{d:5,t:"Failover group",q:"What is the permitted range of the Read/Write grace period on a failover group?",
 o:["1 to 24 hours","1 to 60 minutes","1 to 7 days","5 to 30 seconds"],a:0,
 e:"Khi tạo failover group: tên duy nhất, server, Read/Write failover policy (automatic hoặc manual) và Read/Write grace period từ 1 đến 24 giờ."},
{d:5,t:"Failover group",q:"What happens when you fail over a failover group?",
 o:["All databases in the group are failed over","Only the selected database fails over","Each database must be failed over manually","Only the primary database fails over"],a:0,
 e:"Tất cả database trong failover group đều được failover cùng lúc. Forced (manual) failover có nguy cơ mất dữ liệu."},
{d:5,t:"Failover group",q:"Which cmdlet fails over ALL databases in an elastic pool?",
 o:["Invoke-AzSqlElasticPoolFailover","Invoke-AzSqlDatabaseFailover","Invoke-AzSqlInstanceFailover","Invoke-AzSqlServerFailover"],a:0,
 e:"Invoke-AzSqlInstanceFailover cho MI; Invoke-AzSqlDatabaseFailover cho một database (kể cả một database trong pool mà không ảnh hưởng cái khác); Invoke-AzSqlElasticPoolFailover cho toàn bộ pool."},
{d:5,t:"Failover group",q:"When SHOULD you use an auto-failover group rather than geo-restore?",
 o:["When the system is mission critical, the SLA does not allow 12+ hours of downtime, and you cannot lose up to an hour of data","When you want to save money","When you only need backups","When the database is under 1 GB"],a:0,
 e:"Dùng auto-failover group khi mission critical, SLA không cho phép 12+ giờ downtime (RTO của geo-restore), không chấp nhận mất tới 1 giờ dữ liệu (RPO geo-restore), và geo-replication thì đắt hơn mức cần thiết."},
{d:5,t:"Availability Group",q:"How many secondary replicas does an Availability Group support?",
 o:["1 to 8 secondaries (only 1 on SQL Server Standard)","Up to 4","Up to 2","Unlimited"],a:0,
 e:"AG có 1 primary replica và 1-8 secondary replica (SQL Server Standard chỉ cho 1). Phải có ít nhất 2 failover partner. Secondary KHÔNG thay thế backup."},
{d:5,t:"Availability Group",q:"Which failover types involve no data loss and apply only to synchronous-commit mode?",
 o:["Planned manual failover and automatic failover","Forced manual failover","Automatic failover only","All types"],a:0,
 e:"Planned manual failover và Automatic failover đều không mất dữ liệu và chỉ cho synchronous-commit mode (secondary phải synchronized). Automatic failover còn cần WSFC quorum. Forced manual failover dành cho asynchronous-commit và là phương án DR."},
{d:5,t:"Availability Group",q:"If the target secondary replica is NOT synchronized with the primary, which failover type is available?",
 o:["Forced manual failover only","Planned manual failover","Automatic failover","None"],a:0,
 e:"Forced manual failover (forced failover) là loại DUY NHẤT có thể thực hiện khi secondary chưa synchronized — dùng cho asynchronous-commit mode."},
{d:5,t:"Availability Group",q:"What happens in asynchronous-commit mode?",
 o:["The primary commits without acknowledgement from the secondary — lower latency but the secondary lags","The primary waits until the secondary has hardened the log","No replication occurs","It is only used within a single datacenter"],a:0,
 e:"Asynchronous-commit: primary commit không chờ acknowledgement — giảm transaction latency nhưng dữ liệu trên secondary bị trễ. Synchronous-commit: primary không commit cho tới khi secondary đã hardened log."},
{d:5,t:"Availability Group",q:"Which T-SQL statement fails over an Availability Group?",
 o:["ALTER AVAILABILITY GROUP MyAg FAILOVER;","ALTER DATABASE ... SET HADR FAILOVER;","EXEC sp_failover_ag 'MyAg';","BACKUP LOG ... WITH NORECOVERY;"],a:0,
 e:"ALTER AVAILABILITY GROUP MyAg FAILOVER; Trong SSMS thì kết nối tới server chứa SECONDARY replica, vào AlwaysOn High Availability – Availability Groups – right-click – Failover."},
{d:5,t:"Availability Group",q:"How do you prepare a database for an Availability Group?",
 o:["BACKUP then RESTORE WITH NORECOVERY onto the secondary; the primary must use the full recovery model and the names must match","Just copy the MDF file","RESTORE WITH RECOVERY","Detach and attach the database"],a:0,
 e:"Secondary phải giống hệt primary: BACKUP và RESTORE (gồm cả tail-log backup), dùng RESTORE WITH NORECOVERY. Primary dùng full recovery model, tên database secondary phải trùng primary."},
{d:5,t:"Availability Group",q:"Which statement joins a database to an Availability Group?",
 o:["ALTER DATABASE Db1 SET HADR AVAILABILITY GROUP = MyAG;","ALTER AVAILABILITY GROUP MyAG JOIN Db1;","ALTER DATABASE Db1 JOIN GROUP MyAG;","EXEC sp_add_ag_database 'Db1';"],a:0,
 e:"ALTER AVAILABILITY GROUP MyAG ADD DATABASE MyDb3; rồi ALTER DATABASE Db1 SET HADR AVAILABILITY GROUP = MyAG;"},
{d:5,t:"AG listener",q:"What is the character limit for an Availability Group listener name in SSMS?",
 o:["15 characters (letters, numbers, hyphens and underscores)","30 characters","63 characters","128 characters"],a:0,
 e:"Listener DNS name tối đa 15 ký tự trong SSMS. Listener port mặc định 1433; probe port của internal load balancer mặc định 59999."},
{d:5,t:"AG listener",q:"Which TCP protocol option should be used for a listener?",
 o:["A static IP — DHCP is not recommended in a production environment","DHCP","Either is equally good","Automatic"],a:0,
 e:"Dùng Static IP; DHCP không được khuyến nghị cho production. Với static, phải chỉ định IP tĩnh cho mọi subnet có availability replica."},
{d:5,t:"AG setup",q:"How many free IP addresses are needed to create an Availability Group on Azure VMs?",
 o:["2 — one for the internal load balancer and one for the AG listener","1","3","4"],a:0,
 e:"Cần 2 IP chưa dùng: một cho internal load balancer, một cho availability group listener (cùng subnet với AG). VM phải domain-joined, chạy SQL Server 2012+ Enterprise hoặc 2016+ Standard, và đăng ký SQL IaaS Agent extension ở full manageability mode."},
{d:5,t:"AG setup",q:"What does an 'Internal' load balancer type mean for an Availability Group?",
 o:["Applications in the same Virtual Network can connect to the availability group","It can be reached from the public internet","It is used for DR only","No static IP is needed"],a:0,
 e:"Internal: app trong cùng Virtual Network kết nối được. External: app kết nối qua public internet. IP address assignment nên là Static."},
{d:5,t:"Quorum",q:"Which witness type is recommended whenever possible?",
 o:["Cloud Witness — unless you have a failover cluster solution with shared storage","Disk Witness","File share witness","No witness at all"],a:0,
 e:"Cloud Witness (Windows Server 2016+) được khuyến nghị whenever possible, trừ khi có failover cluster dùng shared storage. Chỉ 1 MB, dùng port 443, cần General Purpose + Standard Storage với Locally redundant storage."},
{d:5,t:"Quorum",q:"What is the limitation of a Disk Witness on Azure?",
 o:["It can only be used with a cluster using Azure Shared Disks, and cannot be a Cluster Shared Volume","It cannot be used on Azure","It requires Premium storage","It must be larger than 1 GB"],a:0,
 e:"Disk Witness là clustered disk nhỏ (<1 GB) trong Cluster Available Storage group, highly available. Trên Azure chỉ dùng được với cluster dùng Azure Shared Disks, và không thể là Cluster Shared Volume."},
{d:5,t:"Quorum",q:"What is the drawback of the 'No majority (disk witness only)' quorum configuration?",
 o:["It is not recommended because it is a single point of failure","It requires more nodes","It is slower","It only works with 2 nodes"],a:0,
 e:"'No majority (disk witness only)': chỉ disk witness có vote — không khuyến nghị vì single point of failure."},
{d:5,t:"Quorum",q:"How does a two-node cluster behave without a quorum resource?",
 o:["It functions, but using a quorum resource is recommended to give an odd number of votes","It cannot function","Three nodes are mandatory","It creates a cloud witness automatically"],a:0,
 e:"Cluster 2 node hoạt động được không cần quorum resource, nhưng nên dùng — nó cho số vote lẻ và tối thiểu 3 quorum vote."},
{d:5,t:"Backup",q:"Which backup type can be created manually on Managed Instance?",
 o:["Full database COPY_ONLY backups only — no differential, log or file snapshot backups","Full, differential and log backups","Transaction log backups only","No manual backups are supported"],a:0,

/* ============================================================
   Engine
   ============================================================ */
const $ = s => document.querySelector(s);
const LS_WRONG = "dp300.wrong.v1";
const LS_BEST  = "dp300.best.v1";
const LS_THEME = "dp300.theme.v1";

const state = {
  domains: new Set([0,1,2,3,4]),
  mode: "study",
  list: [],
  i: 0,
  picked: null,      // number | Set
  checked: false,
  correct: 0,
  answers: []        // {qi, picked, ok}
};

/* ---- utilities ---- */
const isMulti = q => Array.isArray(q.a);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const loadWrong = () => { try{ return new Set(JSON.parse(localStorage.getItem(LS_WRONG)||"[]")); }catch(e){ return new Set(); } };
const saveWrong = s => { try{ localStorage.setItem(LS_WRONG, JSON.stringify([...s])); }catch(e){} };

/* Trộn thứ tự lựa chọn nhưng giữ đúng ánh xạ đáp án */
function prepare(q, idx){
  const order = shuffle(q.o.map((_,i)=>i));
  const opts  = order.map(i => q.o[i]);
  const remap = i => order.indexOf(i);
  const a = isMulti(q) ? q.a.map(remap).sort((x,y)=>x-y) : remap(q.a);
  return { ...q, o: opts, a, qi: idx };
}

/* ---- theme ---- */
(function(){
  const saved = localStorage.getItem(LS_THEME);
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem(LS_THEME, next);
  };
})();

/* ---- setup screen ---- */
function renderSetup(){
  $("#qcount").textContent = QUESTIONS.length + " câu hỏi";

  const box = $("#domains");
  box.innerHTML = "";
  DOMAINS.forEach((name, i) => {
    const n = QUESTIONS.filter(q => q.d === i+1).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = `${DOMAIN_SHORT[i]} (${n})`;
    b.title = name;
    b.setAttribute("aria-pressed", state.domains.has(i));
    b.onclick = () => {
      if (state.domains.has(i)) { if (state.domains.size > 1) state.domains.delete(i); }
      else state.domains.add(i);
      renderSetup();
    };
    box.appendChild(b);
  });

  $("#modes").querySelectorAll("[data-mode]").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.mode === state.mode);
    b.onclick = () => { state.mode = b.dataset.mode; renderSetup(); };
  });

  const wrong = loadWrong();
  $("#wrongCount").textContent = wrong.size;
  $("#startWrong").disabled = wrong.size === 0;

  // thống kê điểm cao nhất theo domain
  let best = {};
  try { best = JSON.parse(localStorage.getItem(LS_BEST) || "{}"); } catch(e){}
  const stats = $("#stats");
  stats.innerHTML = "";
  DOMAINS.forEach((name, i) => {
    const b = best[i+1];
    const el = document.createElement("div");
    el.className = "stat";
    el.innerHTML = `<b>${b ? Math.round(b) + "%" : "—"}</b><span>${DOMAIN_SHORT[i]}</span>`;
    el.title = name + " — điểm cao nhất";
    stats.appendChild(el);
  });
}

/* ---- start ---- */
function start(pool){
  if (!pool){
    pool = QUESTIONS.map((q,i)=>({q,i})).filter(x => state.domains.has(x.q.d - 1));
    shuffle(pool);
    const n = +$("#num").value;
    if (n > 0) pool = pool.slice(0, n);
  }
  if (!pool.length) return;

  state.list = pool.map(x => prepare(x.q, x.i));
  state.i = 0; state.correct = 0; state.answers = [];
  $("#setup").hidden = true; $("#result").hidden = true; $("#quiz").hidden = false;
  renderQuestion();
}

function renderQuestion(){
  const q = state.list[state.i];
  state.picked = isMulti(q) ? new Set() : null;
  state.checked = false;

  $("#prog").style.width = (state.i / state.list.length * 100) + "%";
  $("#mDomain").textContent = DOMAIN_SHORT[q.d - 1];
  $("#mTopic").textContent  = q.t;
  $("#mPos").textContent    = `${state.i + 1}/${state.list.length}`;
  $("#mScore").textContent  = state.mode === "study" ? ` · ${state.correct} đúng` : "";
  $("#qtext").textContent   = q.q + (isMulti(q) ? `\n(Chọn ${q.a.length} đáp án)` : "");

  const box = $("#opts");
  box.innerHTML = "";
  q.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<span class="k">${i+1}</span><span></span>`;
    b.lastChild.textContent = text;
    b.onclick = () => pick(i);
    box.appendChild(b);
  });

  $("#expl").innerHTML = "";
  $("#check").hidden = false;
  $("#check").disabled = true;
  $("#check").textContent = state.mode === "study" ? "Kiểm tra" : "Trả lời";
  $("#next").hidden = true;
}

function pick(i){
  if (state.checked) return;
  const q = state.list[state.i];
  const btns = [...$("#opts").children];
  if (isMulti(q)){
    state.picked.has(i) ? state.picked.delete(i) : state.picked.add(i);
    btns.forEach((b, k) => b.setAttribute("aria-pressed", state.picked.has(k)));
    $("#check").disabled = state.picked.size !== q.a.length;
  } else {
    state.picked = i;
    btns.forEach((b, k) => b.setAttribute("aria-pressed", k === i));
    $("#check").disabled = false;
  }
}

function check(){
  const q = state.list[state.i];
  if (state.checked) return;
  const picked = isMulti(q) ? [...state.picked].sort((a,b)=>a-b) : state.picked;
  const ok = isMulti(q)
    ? picked.length === q.a.length && picked.every((v,k) => v === q.a[k])
    : picked === q.a;

  state.checked = true;
  if (ok) state.correct++;
  state.answers.push({ qi: q.qi, listIdx: state.i, picked, ok });

  // ghi nhớ câu sai để ôn lại
  const wrong = loadWrong();
  ok ? wrong.delete(q.qi) : wrong.add(q.qi);
  saveWrong(wrong);

  if (state.mode === "study"){
    const right = isMulti(q) ? q.a : [q.a];
    const yours = isMulti(q) ? picked : [picked];
    [...$("#opts").children].forEach((b, i) => {
      b.disabled = true;
      if (right.includes(i)) b.classList.add("ok");
      else if (yours.includes(i)) b.classList.add("bad");
    });
    const e = document.createElement("div");
    e.className = "expl " + (ok ? "ok" : "bad");
    e.innerHTML = "<b></b><span></span>";
    e.firstChild.textContent = ok ? "Chính xác" : "Chưa đúng";
    e.lastChild.textContent = q.e;
    const ln = noteLink(q);
    if (ln) e.appendChild(ln);
    $("#expl").appendChild(e);
    $("#mScore").textContent = ` · ${state.correct} đúng`;
  } else {
    [...$("#opts").children].forEach(b => b.disabled = true);
  }
  $("#check").hidden = true;
  $("#next").hidden = false;
  $("#next").textContent = state.i === state.list.length - 1 ? "Xem kết quả →" : "Câu tiếp →";
  $("#next").focus();
}

function next(){
  if (state.i === state.list.length - 1) return finish();
  state.i++;
  renderQuestion();
}

function finish(){
  $("#quiz").hidden = true; $("#result").hidden = false;
  const total = state.answers.length;
  const pct = total ? state.correct / total * 100 : 0;
  $("#rPct").textContent = Math.round(pct) + "%";
  $("#rRaw").textContent = `${state.correct}/${total} câu đúng` + (pct >= 70 ? " — đạt ngưỡng 700/1000" : "");

  // bảng theo domain
  const per = {};
  state.answers.forEach(a => {
    const d = QUESTIONS[a.qi].d;
    per[d] = per[d] || { n:0, ok:0 };
    per[d].n++; if (a.ok) per[d].ok++;
  });
  let html = "<tr><th>Phạm vi</th><th class='num'>Đúng</th><th class='num'>Tổng</th><th class='num'>%</th></tr>";
  let best = {};
  try { best = JSON.parse(localStorage.getItem(LS_BEST) || "{}"); } catch(e){}
  Object.keys(per).sort().forEach(d => {
    const p = per[d].ok / per[d].n * 100;
    if (per[d].n >= 5 && (!best[d] || p > best[d])) best[d] = p;
    html += `<tr><td>${DOMAIN_SHORT[d-1]}</td><td class='num'>${per[d].ok}</td><td class='num'>${per[d].n}</td><td class='num'>${Math.round(p)}%</td></tr>`;
  });
  $("#rTable").innerHTML = html;
  try { localStorage.setItem(LS_BEST, JSON.stringify(best)); } catch(e){}

  // review các câu sai
  const bad = state.answers.filter(a => !a.ok);
  const rv = $("#rReview");
  rv.innerHTML = "";
  if (!bad.length){
    rv.innerHTML = "<div class='empty'>Không sai câu nào.</div>";
  } else {
    const h = document.createElement("h3");
    h.textContent = `Xem lại ${bad.length} câu sai`;
    rv.appendChild(h);
    bad.forEach(a => {
      const q = state.list[a.listIdx];
      const right = isMulti(q) ? q.a : [q.a];
      const yours = isMulti(q) ? a.picked : [a.picked];
      const d = document.createElement("div");
      d.className = "rev";
      const qq = document.createElement("div"); qq.className = "qq"; qq.textContent = q.q;
      d.appendChild(qq);
      const mk = (cls, label, idxs) => {
        const l = document.createElement("div"); l.className = "line " + cls;
        const t = document.createElement("span"); t.className = "tag"; t.textContent = label;
        l.appendChild(t);
        l.appendChild(document.createTextNode(idxs.map(i => q.o[i]).join("  |  ")));
        d.appendChild(l);
      };
      mk("yours", "Bạn chọn", yours);
      mk("right", "Đáp án", right);
      const w = document.createElement("div"); w.className = "why"; w.textContent = q.e;
      d.appendChild(w);
      const ln = noteLink(q);
      if (ln) d.appendChild(ln);
      rv.appendChild(d);
    });
  }
  $("#reviewWrong").disabled = !bad.length;
  $("#reviewWrong").onclick = () => start(bad.map(a => ({ q: QUESTIONS[a.qi], i: a.qi })));
  renderSetup();
}

function home(){
  $("#quiz").hidden = true; $("#result").hidden = true; $("#setup").hidden = false;
  renderSetup();
}

/* ---- wiring ---- */
$("#start").onclick = () => start(null);
$("#startWrong").onclick = () => {
  const w = loadWrong();
  const pool = [...w].filter(i => QUESTIONS[i]).map(i => ({ q: QUESTIONS[i], i }));
  shuffle(pool); start(pool);
};
$("#check").onclick = check;
$("#next").onclick = next;
$("#quit").onclick = () => state.answers.length ? finish() : home();
$("#again").onclick = home;

document.addEventListener("keydown", e => {
  if ($("#quiz").hidden) return;
  if (e.key >= "1" && e.key <= "9"){
    const i = +e.key - 1;
    if (i < state.list[state.i].o.length){ pick(i); e.preventDefault(); }
  } else if (e.key === "Enter"){
    e.preventDefault();
    state.checked ? next() : (!$("#check").disabled && check());
  }
});

renderSetup();
</script>
</body>
</html>
