{id:249,d:2,t:"Classification",q:"When classifying a column, which rule must you respect?",
 o:["You cannot set both the information type and the sensitivity label to [n/a]","At least one of the two must be [n/a]","The sensitivity label is optional and the information type is mandatory","The rank must always be HIGH or CRITICAL"],a:0,
 e:"Không được chọn `[n/a]` cho **cả hai** Information Type và Sensitivity Label — ít nhất một trong hai phải có giá trị thật."},
{id:250,d:2,t:"Auditing",q:"You enable Azure SQL auditing and keep the default policy. Which action groups are captured?",
 o:["BATCH_COMPLETED_GROUP, SUCCESSFUL_DATABASE_AUTHENTICATION_GROUP and FAILED_DATABASE_AUTHENTICATION_GROUP","FAILED_DATABASE_AUTHENTICATION_GROUP only","DDL_DATABASE_LEVEL_EVENTS and SCHEMA_OBJECT_ACCESS_GROUP","BACKUP_RESTORE_GROUP and DATABASE_PERMISSION_CHANGE_GROUP"],a:0,
 e:"Default policy audit mọi query/stored procedure (`BATCH_COMPLETED_GROUP`) cùng login thành công và thất bại. Mỗi audit record lưu tối đa 4.000 ký tự cho dữ liệu ký tự."},
{id:251,d:2,t:"Auditing",q:"You are choosing a storage account as the audit log destination. Which two requirements apply?",
 o:["Audit logs are written as append blobs","Storage accounts with hierarchical namespace enabled are not supported","Premium block blob storage is required","Logs must be written to a container named `sqldbauditlogs` created manually","The storage account must use geo-redundant storage"],a:[0,1],
 e:"Audit ghi bằng **append blob**, không hỗ trợ premium storage và không hỗ trợ hierarchical namespace (Data Lake Gen2). Container được tạo tự động."},
{id:252,d:2,t:"Auditing",q:"You enable auditing at server level for a logical server and also enable a different database-level policy on one database. What is the effect, and what does Microsoft recommend?",
 o:["Both policies run in parallel and both sets of events are audited; use server-level only, unless one database genuinely needs different event types","The database-level policy overrides the server-level policy for that database","The server-level policy is ignored as soon as a database-level policy exists","The configuration is invalid and the deployment fails"],a:0,
 e:"Server policy luôn áp cho mọi database bất kể database-level policy — hai policy chạy **song song** và dễ tạo log trùng. Vì vậy chỉ nên dùng server-level, trừ khi một database cần audit loại sự kiện khác."},
{id:253,d:2,t:"Auditing",q:"Which function reads an audit file so you can query it with T-SQL?",
 o:["`sys.fn_get_audit_file('https://.../file.xel', default, default)`","`sys.dm_audit_actions`","`sys.fn_read_audit_log(default)`","`EXEC sp_get_audit_log;`"],a:0,
 e:"`sys.fn_get_audit_file(pattern, initial_file_name, audit_record_offset)` đọc file audit. Trong SSMS có thể dùng File – Open – Merge Audit Files để xem nhiều file cùng lúc."},
{id:254,d:2,t:"Change Tracking",q:"A nightly ETL only needs to know which rows changed since the last run; it re-reads the current values itself and never needs previous values. Storage and overhead must be minimal. Which feature should you enable?",
 o:["Change tracking","Change data capture","Temporal tables","An updatable ledger table"],a:0,
 e:"Change tracking nhẹ hơn CDC: chỉ ghi nhận dòng nào (và cột nào) đã thay đổi, **không lưu dữ liệu lịch sử**. CDC lưu cả before/after image nên tốn hơn nhiều."},
{id:255,d:2,t:"Change Tracking",q:"You are reviewing the change tracking settings of a database whose tracking tables keep growing. Which two statements are true?",
 o:["The default retention period is two days, and the minimum you can set is one minute","If AUTO_CLEANUP is OFF, expired tracking data is never removed","The default retention period is seven days, and the minimum is one hour","There is a maximum retention period of 30 days","Retention is configured per table rather than per database"],a:[0,1],
 e:"Mặc định 2 ngày, tối thiểu 1 phút, không có giá trị tối đa. `AUTO_CLEANUP` quyết định có tự xoá dữ liệu quá hạn hay không — tắt nó thì dữ liệu tracking phình ra."},
{id:256,d:2,t:"Change Tracking",q:"`ALTER DATABASE Sales SET CHANGE_TRACKING = OFF;` fails. What must you do first?",
 o:["Disable change tracking on every table that still has it enabled","Set the database to SINGLE_USER mode","Take a transaction log backup","Disable snapshot isolation"],a:0,
 e:"Phải `ALTER TABLE ... DISABLE CHANGE_TRACKING` cho toàn bộ bảng trước, rồi mới tắt được ở cấp database."},
{id:257,d:2,t:"CDC",q:"Which resource requirement applies before you can enable change data capture on an Azure SQL database?",
 o:["At least 1 vCore, or 100 DTUs/eDTUs","At least 2 vCores in the Business Critical tier","Any tier, including Basic and Free","Premium tier only"],a:0,
 e:"CDC cần tối thiểu 1 vCore hoặc 100 DTU/eDTU — nên không dùng được với Free, Basic, Standard S0/S1/S2, hay elastic pool dưới các ngưỡng đó."},
{id:258,d:2,t:"CDC",q:"In a CDC change table, what does `__$operation = 2` represent?",
 o:["An insert","A delete","An update, before image","An update, after image"],a:0,
 e:"`__$operation`: 1 = delete, 2 = insert, 3 = update (before image), 4 = update (after image)."},
{id:259,d:2,t:"CDC",q:"On a SQL Server 2022 instance you must enable CDC for two tables in a user database. Which sequence and permission are correct?",
 o:["Run `sys.sp_cdc_enable_db` first as a member of sysadmin, then `sys.sp_cdc_enable_table` for each table as db_owner","Run `sys.sp_cdc_enable_table` first as db_owner; the database is enabled implicitly","Enable change tracking first, then run `sys.sp_cdc_enable_db`","Run `sys.sp_cdc_enable_db` in master as db_owner, then enable each table"],a:0,
 e:"`sys.sp_cdc_enable_db` phải chạy trước, trong **chính user database** đó (không phải master), rồi mới `sp_cdc_enable_table` cho từng bảng. Trên SQL Server và MI, bật ở cấp database cần **sysadmin**; riêng trên Azure SQL Database thì chỉ cần **db_owner**. Cả hai procedure trả 0 = thành công, 1 = thất bại."},
{id:260,d:2,t:"Ledger",q:"You are explaining the tamper-evidence guarantees of a ledger database. When is a block closed?",
 o:["After 30 seconds, or after 100,000 transactions","After 60 seconds, or after 10,000 transactions","After every committed transaction","After five minutes, regardless of transaction count"],a:0,
 e:"Block đóng sau **30 giây hoặc 100.000 transaction**. Root hash của block được hash cùng root hash của block trước tạo thành chuỗi; hash của block mới nhất gọi là *database digest*."},
{id:261,d:2,t:"Ledger",q:"A regulator requires an audit table that nobody — including the DBA — can update or delete. Which two statements about an append-only ledger table are true?",
 o:["Updates and deletes are blocked even for members of sysadmin","No history table is created for it","It creates a history table like an updatable ledger table","Existing tables can be converted to append-only with ALTER TABLE","Deletes are allowed but are recorded in the ledger view"],a:[0,1],
 e:"Append-only ledger table chỉ cho INSERT: update/delete bị từ chối kể cả với sysadmin/DBA, và **không** có history table (vì không có phiên bản cũ). Nó chỉ thêm hai cột `GENERATED ALWAYS`."},
{id:262,d:2,t:"Ledger",q:"You must turn an existing 400 GB non-ledger table into an updatable ledger table with minimal downtime. What is the supported approach?",
 o:["Create a new ledger table, copy the data with `sp_copy_data_in_batches`, then rename","Run `ALTER TABLE dbo.Ledger SET (LEDGER = ON);`","Enable the ledger at database level; existing tables are converted automatically","Export to a BACPAC and re-import into a ledger database"],a:0,
 e:"Không convert được bảng thường thành ledger table. Phải tạo bảng ledger mới rồi copy dữ liệu (`sp_copy_data_in_batches` chia batch 10.000–100.000 dòng chạy song song, hoặc `SELECT INTO`/`BULK INSERT`) và đổi tên."},
{id:263,d:2,t:"Ledger",q:"How does Microsoft recommend querying the change history of an updatable ledger table?",
 o:["Query the ledger view, which joins the table with its history table","Query the history table directly","Query `sys.database_ledger_transactions`","Use temporal table `FOR SYSTEM_TIME` syntax"],a:0,
 e:"Dùng **ledger view** thay vì đọc thẳng history table: view thể hiện transaction ID và loại thao tác (một UPDATE hiện thành cặp DELETE + INSERT)."},
{id:264,d:2,t:"RLS",q:"A security policy with a filter predicate is applied to `dbo.Sales`. Which operations does the filter predicate affect?",
 o:["SELECT, and it also silently affects UPDATE and DELETE because filtered rows cannot be seen","INSERT only","DELETE only","DDL statements against the table"],a:0,
 e:"FILTER PREDICATE lọc dòng khi đọc, nên UPDATE/DELETE cũng chỉ tác động được vào dòng nhìn thấy. Muốn chặn ghi dữ liệu ra ngoài phạm vi thì phải thêm BLOCK PREDICATE (AFTER INSERT / AFTER UPDATE / BEFORE UPDATE / BEFORE DELETE)."},
{id:265,d:2,t:"RLS",q:"You are writing the predicate function for row-level security. What form must it take?",
 o:["An inline table-valued function that returns a row when the caller may see the record, ideally WITH SCHEMABINDING","A scalar function returning a BIT","A multi-statement table-valued function returning a table variable","A stored procedure returning a result set"],a:0,
 e:"RLS dùng **inline table-valued function** (nên `WITH SCHEMABINDING`), trả về một dòng khi user được phép xem. Nhớ GRANT SELECT trên function và nên đặt các object RLS trong schema riêng."},
{id:266,d:2,t:"RLS",q:"Which permissions do you need to create a security policy for row-level security?",
 o:["ALTER ANY SECURITY POLICY, plus SELECT and REFERENCES on the predicate function and the target table","CONTROL DATABASE only","Membership of db_securityadmin only","ALTER ANY SCHEMA plus VIEW DEFINITION"],a:0,
 e:"Cần ALTER ANY SECURITY POLICY cộng thêm SELECT và REFERENCES trên function, bảng và cột liên quan."},
{id:267,d:2,t:"Defender",q:"Which two things does Microsoft Defender for SQL surface?",
 o:["Alerts on anomalous access patterns and potential SQL injection","A recurring vulnerability assessment of your instances against best practice rules","Automatic remediation of every finding without approval","Blocking of suspicious logins at the firewall in real time","Automatic rotation of all SQL logins"],a:[0,1],
 e:"Defender for SQL gồm Advanced Threat Protection (cảnh báo hoạt động bất thường, brute force, SQL injection) và Vulnerability Assessment. Nó **cảnh báo và khuyến nghị**, không tự chặn hay tự sửa."},
{id:268,d:2,t:"Vulnerability",q:"A vulnerability assessment flags a configuration that is intentional in your environment, and you want future scans to treat it as acceptable while still reporting it. What should you do?",
 o:["Choose Approve as Baseline, so matching future results appear in the Passed section","Choose Disable rule, so the check never runs again","Delete the finding from the report","Export the report to Excel and annotate it manually"],a:0,
 e:"'Approve as Baseline' đưa các kết quả khớp baseline vào mục **Passed** ở lần scan sau. Muốn bỏ hẳn một kiểm tra thì dùng 'Disable rule'."},
{id:269,d:2,t:"Purview",q:"Which three elements make up Microsoft Purview (Azure Purview) Studio?",
 o:["Data Map","Data Catalog","Data Insights","Data Factory","Data Sync"],a:[0,1,2],
 e:"Data Map scan và classify để thu metadata; Data Catalog cho phép tìm dữ liệu theo classification/metadata; Data Insights cho biết dữ liệu nhạy cảm nằm ở đâu và luân chuyển ra sao."},
{id:270,d:2,t:"Key Vault",q:"You are creating a key vault that will hold the key used to encrypt the OS and data disks of a SQL Server VM. Which access policy option must you enable?",
 o:["Azure Disk Encryption for volume encryption","Azure Backup for recovery point protection","Azure Resource Manager for template deployment","Azure Virtual Machines for deployment"],a:0,
 e:"Trong Access policies, bật 'Azure Disk Encryption for volume encryption'. Với Azure Key Vault integration của SQL Server (TDE, backup encryption) thì cần thêm quyền get/list/wrapKey/unwrapKey cho service principal."},
/* ---------- 3. Monitor, configure and optimize database resources (20–25%) ---------- */
{id:301,d:3,t:"Baseline",q:"A user reports that a query timed out about 20 minutes ago. You must see the CPU, data I/O and log I/O consumption of the Azure SQL database at that moment, at the finest granularity available. Which DMV should you query?",
 o:["`sys.dm_db_resource_stats` — one row every 15 seconds for roughly the past hour","`sys.resource_stats` in master — one row per hour, kept for 90 days","`sys.dm_os_performance_counters` — cumulative counters since startup","`sys.dm_exec_requests` — one row per executing request"],a:0,
 e:"`sys.dm_db_resource_stats` cho 1 dòng mỗi 15 giây trong khoảng 1 giờ gần nhất — đủ để soi sự cố vừa xảy ra. Với MI dùng `sys.server_resource_stats`."},
{id:302,d:3,t:"Baseline",q:"Management wants a trend of average resource consumption per database over the last two months. Which view should you use?",
 o:["`sys.resource_stats` in the master database","`sys.dm_db_resource_stats` in each database","`sys.dm_exec_query_stats`","`sys.database_query_store_options`"],a:0,
 e:"`sys.resource_stats` (master, tương ứng `sys.resource_usage` cho tổng hợp theo giờ) giữ lịch sử tới **90 ngày**, dùng cho báo cáo xu hướng. `dm_db_resource_stats` chỉ giữ khoảng 1 giờ."},
{id:303,d:3,t:"Metrics",q:"You must chart DTU consumption for a database over an incident that started 40 days ago. What are the limits of Metrics Explorer?",
 o:["It can display up to 30 days at a time and can go back as far as 93 days","It can display up to 7 days at a time and can go back 30 days","It can display up to 90 days at a time and can go back one year","There is no retention limit for platform metrics"],a:0,
 e:"Metrics Explorer hiển thị tối đa 30 ngày cùng lúc và lùi được tới **93 ngày**. Cần giữ lâu hơn thì phải export metric sang Log Analytics hoặc storage bằng diagnostic setting."},
{id:304,d:3,t:"Metrics",n:"s44",q:"You must choose between Azure Monitor metrics and logs for a new alert that has to fire within a minute of a CPU spike. Which statement should guide the decision?",
 o:["Metrics are numeric time-series values, lightweight and suited to near real-time alerting; logs are events that may hold non-numeric data and are queried with KQL","Metrics store text and logs store numbers","Metrics can only be read through Log Analytics","Log alerts evaluate faster than metric alerts"],a:0,
 e:"Metric là giá trị số thu thập đều đặn trong time-series database nên rất nhẹ và alert gần realtime. Log là sự kiện (có thể phi số), truy vấn bằng KQL trong Log Analytics và có độ trễ ingest lớn hơn."},
{id:305,d:3,t:"Metrics",q:"`xtp_storage_percent` for a database reaches 100%. What happens to the workload?",
 o:["INSERT, UPDATE, ALTER and CREATE operations fail, while SELECT and DELETE continue to work","The database is taken offline until you scale up","Only SELECT statements fail","The service tier scales up automatically"],a:0,
 e:"Khi hết In-Memory OLTP storage: INSERT/UPDATE/ALTER/CREATE fail; SELECT và DELETE vẫn chạy (DELETE giải phóng được chỗ). Metric trả về 0 nếu không dùng In-Memory OLTP."},
{id:306,d:3,t:"Metrics",q:"`max_worker_percent` is close to 100% while CPU percentage stays around 30%. What does this indicate?",
 o:["Concurrent requests are approaching the service tier's worker limit — often caused by blocking or many long-waiting sessions","The database is CPU bound and must be scaled up","The workers are idle and the metric can be ignored","Session count has exceeded the tier limit"],a:0,
 e:"`max_worker_percent` = số concurrent request cao nhất / giới hạn tier (`max_session_percent` là cho session). Worker cạn mà CPU thấp là dấu hiệu request đang **chờ** — điều tra blocking và wait stats trước khi scale."},
{id:307,d:3,t:"Metrics",q:"`Data space used percent` on a General Purpose database in an elastic pool is above 90% and rising. Which three actions could address it?",
 o:["Increase the maximum data size, or move to a service tier with a larger storage limit","Archive or delete old data, then reclaim the freed space","Scale out by sharding the largest tables across several databases","Raise MAXDOP so that queries complete faster","Rebuild the largest indexes with FILLFACTOR = 50"],a:[0,1,2],
 e:"Với data space used cao: nâng tier/max size, dọn dữ liệu rồi thu hồi dung lượng, hoặc scale out bằng sharding — và nếu giới hạn đến từ elastic pool thì đưa database ra khỏi pool. MAXDOP không liên quan tới dung lượng, còn FILLFACTOR thấp thì **tốn thêm** chỗ."},
{id:308,d:3,t:"Query Perf Insight",q:"A developer with no access to DMVs must find the top CPU-consuming queries of the past week from the Azure portal. Where should you send them?",
 o:["Query Performance Insight, under Intelligent Performance","Metrics Explorer, filtered on cpu_percent","The Extended Events session list","The Vulnerability Assessment report"],a:0,
 e:"Query Performance Insight (dựa trên Query Store) cho top query theo CPU, Duration hoặc Execution count, chi tiết từng query, kèm biểu tượng performance recommendation."},
{id:309,d:3,t:"SQL Insights",q:"An older runbook in your estate still configures Azure Monitor SQL Insights (preview) to monitor 30 Azure SQL databases. What should you do?",
 o:["Replace it with database watcher, because SQL Insights was retired on 31 December 2024","Keep it, but exclude the Basic, S0, S1 and S2 databases, which it cannot monitor","Keep it and add one monitoring VM per 100 connection strings","Replace it with Query Performance Insight, which collects the same telemetry"],a:0,
 e:"**Cập nhật quan trọng:** Azure Monitor SQL Insights (preview) đã bị khai tử ngày 31/12/2024; giải pháp thay thế được Microsoft khuyến nghị là **database watcher** (cho Azure SQL Database và MI). Các giới hạn cũ của SQL Insights (không hỗ trợ elastic pool, Basic/S0/S1/S2, không hỗ trợ Entra ID auth, 1 VM Standard_B2s mỗi 100 connection string) chỉ còn giá trị lịch sử."},
{id:310,d:3,t:"Database watcher",q:"You must monitor 250 Azure SQL databases and 12 managed instances with low collection latency, and the team does not want to run any monitoring agents or virtual machines. Which solution fits?",
 o:["Database watcher, which is a managed service and needs no monitoring VM","SQL Insights, with one Standard_B2s monitoring VM per 100 connection strings","A self-built solution collecting DMVs into a Log Analytics workspace with the Azure Monitor agent","Query Performance Insight, opened per database in the portal"],a:0,
 e:"Database watcher là dịch vụ quản lý: không cần agent hay VM, dữ liệu tới đích trong khoảng dưới 10 giây, và theo dõi được cả fleet. Mô hình 'một VM Standard_B2s mỗi 100 connection string' là của SQL Insights — đã bị khai tử 31/12/2024. Lưu ý database watcher hiện hỗ trợ Azure SQL Database và MI, **chưa** hỗ trợ SQL Server trên VM."},
{id:311,d:3,t:"DMV",q:"A monitoring tool must read performance DMVs on an Azure SQL database with the least privilege possible. Which permission must you grant, and where?",
 o:["`GRANT VIEW DATABASE STATE` to a user created in the monitored database, not in master","`GRANT VIEW SERVER STATE` to a login created in master","`GRANT CONTROL DATABASE` to a user in master","Membership of db_owner in every monitored database"],a:0,
 e:"Với Azure SQL Database: tạo user trong **chính database** cần monitor rồi `GRANT VIEW DATABASE STATE` — không cần quyền nào ở master. Với MI và SQL Server VM thì DMV cấp server cần `VIEW SERVER STATE` (thường kèm `VIEW ANY DEFINITION`)."},
{id:312,d:3,t:"Database watcher",q:"You deploy database watcher for a fleet of Azure SQL resources. Where is the collected data stored and how is it queried?",
 o:["In an Azure Data Explorer cluster or Fabric Real-Time Analytics, queried with KQL","In a Log Analytics workspace, queried with KQL","In Azure Blob Storage, queried with T-SQL","Inside each monitored database, queried with DMVs"],a:0,
 e:"Database watcher ghi vào Azure Data Explorer cluster hoặc Real-Time Analytics trong Fabric; xem qua ADX dashboard, Power BI, Grafana hoặc Excel."},
{id:313,d:3,t:"Database watcher",q:"Finance asks what database watcher will cost for 60 monitored databases. What should you tell them?",
 o:["Creating watchers and dashboards is free; you pay only for the data store","It is charged per monitored resource","It is charged per user who opens a dashboard","It is entirely free, including storage"],a:0,
 e:"Bản thân watcher và dashboard miễn phí, không tính theo resource hay theo user — chi phí đến từ **storage** (ADX cluster hoặc Fabric capacity)."},
{id:314,d:3,t:"Query Store",q:"Which three stores make up Query Store?",
 o:["The plan store","The runtime stats store","The wait stats store","The plan cache","The procedure cache"],a:[0,1,2],
 e:"Query Store gồm plan store (execution plan), runtime stats store (thống kê thực thi) và wait stats store. Plan cache là bộ nhớ của engine, không thuộc Query Store."},
{id:315,d:3,t:"Query Store",q:"On a SQL Server 2022 instance running on an Azure VM you create one new database and restore another database from a SQL Server 2017 backup. What is the state of Query Store in each?",
 o:["Enabled (READ_WRITE) on the new database, while the restored database keeps whatever setting it had on the source","Enabled on both, because the instance is SQL Server 2022","Disabled on both, because Query Store is never on by default in SQL Server","Disabled on the new database and enabled on the restored one"],a:0,
 e:"Từ **SQL Server 2022**, Query Store bật mặc định ở trạng thái READ_WRITE cho **database mới tạo** — khác với SQL Server 2016/2017/2019 (tắt mặc định). Database restore từ instance khác hoặc nâng cấp tại chỗ thì **giữ nguyên** thiết lập cũ, nên phải kiểm tra và bật thủ công. Azure SQL Database và MI luôn bật mặc định."},
{id:316,d:3,t:"Query Store",q:"Query Store on a busy database has stopped showing recent queries, and `sys.database_query_store_options` reports `readonly_reason = 65536` — it has reached MAX_STORAGE_SIZE_MB and switched to read-only. Which two changes get it capturing again and keep it that way?",
 o:["Increase MAX_STORAGE_SIZE_MB","Set SIZE_BASED_CLEANUP_MODE to AUTO so the oldest data is purged automatically","Set QUERY_CAPTURE_MODE to ALL so no query is missed","Run `sp_query_store_flush_db` to reset the read-only state","Increase DATA_FLUSH_INTERVAL_SECONDS so less data is written to disk"],a:[0,1],
 e:"`readonly_reason = 65536` nghĩa là đã chạm MAX_STORAGE_SIZE_MB: Query Store chuyển read-only và dữ liệu trở nên stale. Cách xử lý là tăng dung lượng **và** bật size-based cleanup (dọn ở ~90%, dừng ở ~80%). `CAPTURE_MODE = ALL` chỉ làm đầy nhanh hơn; `sp_query_store_flush_db` chỉ đẩy dữ liệu từ memory xuống đĩa; `DATA_FLUSH_INTERVAL_SECONDS` không thay đổi dung lượng đã dùng."},
{id:317,d:3,t:"Query Store",q:"With `SIZE_BASED_CLEANUP_MODE = AUTO`, when does cleanup start and when does it stop?",
 o:["It starts at about 90% of MAX_STORAGE_SIZE_MB and stops at about 80%","It starts at 100% and stops at 50%","It starts at 75% and stops at 25%","It runs on a 24-hour schedule regardless of size"],a:0,
 e:"Cleanup bắt đầu khi dữ liệu đạt ~90% MAX_STORAGE_SIZE_MB, xoá dữ liệu cũ nhất/ít giá trị nhất, và dừng ở khoảng 80%."},
{id:318,d:3,t:"Query Store",q:"In `sys.database_query_store_options`, `actual_state = 2` and `desired_state = 2`. What does this mean?",
 o:["Query Store is READ_WRITE and collecting normally","Query Store is READ_ONLY","Query Store is OFF","Query Store is in an error state"],a:0,
 e:"`actual_state`: 0 = OFF, 1 = READ_ONLY, 2 = READ_WRITE. Cần so `actual_state` với `desired_state` — lệch nhau là dấu hiệu Query Store bị chuyển read-only ngoài ý muốn."},
{id:319,d:3,t:"Query Store",q:"You must ensure Query Store captures every query, including single-execution ad-hoc statements, on a SQL Server 2022 database. Which setting must you change from its default?",
 o:["`QUERY_CAPTURE_MODE`, which defaults to AUTO and ignores infrequent or very cheap queries","`DATA_FLUSH_INTERVAL_SECONDS`, which defaults to 900","`INTERVAL_LENGTH_MINUTES`, which defaults to 60","`MAX_PLANS_PER_QUERY`, which defaults to 200"],a:0,
 e:"Từ SQL Server 2019 và trên Azure SQL, `QUERY_CAPTURE_MODE` mặc định là **AUTO** — bỏ qua query không thường xuyên và query có compile/execution time nhỏ. Đặt ALL nếu cần bắt hết (tốn dung lượng hơn)."},
{id:320,d:3,t:"Query Store",q:"A SQL Server instance crashes and you find that the last 30 minutes of Query Store data is missing. Which option controls this exposure?",
 o:["`DATA_FLUSH_INTERVAL_SECONDS` — how long data stays in memory before being persisted","`INTERVAL_LENGTH_MINUTES` — the aggregation window for runtime statistics","`STALE_QUERY_THRESHOLD_DAYS` — how long data is retained","`SIZE_BASED_CLEANUP_MODE` — when old data is purged"],a:0,
 e:"`DATA_FLUSH_INTERVAL_SECONDS` quyết định dữ liệu nằm trong memory bao lâu trước khi ghi xuống đĩa: giá trị lớn thì ít I/O hơn nhưng mất nhiều dữ liệu hơn khi crash/restart."},
{id:321,d:3,t:"Query Store",q:"You want each query's runtime statistics aggregated into 15-minute buckets. Which values does `INTERVAL_LENGTH_MINUTES` accept?",
 o:["1, 5, 10, 15, 30, 60 or 1440","Any integer between 1 and 1440","15 or 60 only","5, 10 or 15 only"],a:0,
 e:"Chỉ nhận 1, 5, 10, 15, 30, 60 hoặc 1440 phút. Trong mỗi interval, mỗi query có tối đa một dòng runtime stats — interval nhỏ thì chi tiết hơn nhưng dữ liệu lớn hơn."},
{id:322,d:3,t:"Query Store",q:"After a major release you must discard all historical Query Store data for a database while leaving Query Store enabled. What should you run?",
 o:["`ALTER DATABASE Sales SET QUERY_STORE CLEAR;`","`EXEC sp_query_store_flush_db;`","`DBCC FREEPROCCACHE;`","`ALTER DATABASE Sales SET QUERY_STORE = OFF;`"],a:0,
 e:"`SET QUERY_STORE CLEAR` xoá toàn bộ dữ liệu (tương đương nút 'Purge Query Data' trong SSMS). `sp_query_store_flush_db` chỉ đẩy dữ liệu từ memory xuống đĩa, không xoá."},
{id:323,d:3,t:"Query Store",n:"s57-3",q:"Users report that several reports became slower after a maintenance window, though nothing else changed. Which Query Store report should you open first?",
 o:["Regressed Queries","Overall Resource Consumption","Queries With Forced Plans","Query Wait Statistics"],a:0,
 e:"Regressed Queries so sánh hiệu năng trước/sau và chỉ ra query bị chậm đi theo Duration, CPU Time hay Logical/Physical Reads. 'Queries With High Variation' dùng cho query dao động thất thường."},
{id:324,d:3,t:"Query Store",n:"s57-3",q:"In the Tracked Queries view of Query Store, one execution is drawn as a square. What does that mean?",
 o:["The query was cancelled by the client","The query completed successfully","The query failed because of an exception","The query is still running"],a:0,
 e:"Hình tròn = hoàn tất; **hình vuông = client hủy**; hình tam giác = thất bại do exception làm ngắt thực thi."},
{id:325,d:3,t:"Query Store",n:"s57-3",q:"You must write a T-SQL report joining Query Store execution plans with the query text. Which two views do you need in addition to `sys.query_store_query`?",
 o:["`sys.query_store_plan`","`sys.query_store_query_text`","`sys.dm_exec_cached_plans`","`sys.dm_exec_query_plan`","`sys.query_store_wait_stats`"],a:[0,1],
 e:"`sys.query_store_plan` chứa plan, `sys.query_store_query_text` chứa câu lệnh, join qua `sys.query_store_query`. Runtime stats ở `sys.query_store_runtime_stats`, wait ở `sys.query_store_wait_stats`."},
{id:326,d:3,t:"Blocking",q:"A reporting query must never be blocked by writers and the business explicitly accepts reading uncommitted rows. Which isolation level matches?",
 o:["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","SERIALIZABLE"],a:0,
 e:"READ UNCOMMITTED không lấy shared lock nên không bị block, nhưng chấp nhận dirty read. REPEATABLE READ và SERIALIZABLE giữ lock lâu hơn nên block nhiều hơn."},
{id:327,d:3,t:"Blocking",q:"The same application blocks heavily on SQL Server but not on Azure SQL Database, with identical code at READ COMMITTED. Which two statements explain the difference and its cost?",
 o:["`READ_COMMITTED_SNAPSHOT` is OFF by default on SQL Server but ON by default on Azure SQL Database","With the option ON, readers use row versions instead of shared locks, which shifts load onto the tempdb version store","Azure SQL Database silently ignores the isolation level requested by the client","SQL Server escalates every read lock to a table lock","Azure SQL Database runs every statement at READ UNCOMMITTED"],a:[0,1],
 e:"Trên Azure SQL Database, `READ_COMMITTED_SNAPSHOT` bật mặc định nên reader dùng row version thay vì chờ lock. Trên SQL Server nó tắt mặc định — bật lên là cách giảm blocking hiệu quả nhất, đổi lại tempdb chịu tải version store."},
{id:328,d:3,t:"Blocking",q:"Developers want to run a long report under the SNAPSHOT isolation level. Which database option must you enable first?",
 o:["`ALTER DATABASE Sales SET ALLOW_SNAPSHOT_ISOLATION ON;`","`ALTER DATABASE Sales SET READ_COMMITTED_SNAPSHOT ON;`","`ALTER DATABASE Sales SET AUTO_UPDATE_STATISTICS ON;`","`ALTER DATABASE Sales SET DELAYED_DURABILITY = FORCED;`"],a:0,
 e:"`ALLOW_SNAPSHOT_ISOLATION` cho phép session dùng `SET TRANSACTION ISOLATION LEVEL SNAPSHOT`. `READ_COMMITTED_SNAPSHOT` là chuyện khác: nó đổi hành vi của READ COMMITTED sang dùng row version."},
{id:329,d:3,t:"Blocking",q:"Users report timeouts right now. Which query identifies which session is blocking which?",
 o:["`SELECT session_id, blocking_session_id, wait_type, wait_time FROM sys.dm_exec_requests WHERE blocking_session_id <> 0;`","`SELECT * FROM sys.dm_tran_locks;`","`SELECT * FROM sys.dm_exec_sessions;`","`SELECT * FROM sys.dm_os_wait_stats ORDER BY wait_time_ms DESC;`"],a:0,
 e:"`sys.dm_exec_requests` với `blocking_session_id <> 0` chỉ ra ai đang bị block bởi ai. `dm_tran_locks` cho chi tiết lock, `dm_os_waiting_tasks` cho wait theo task, còn `dm_os_wait_stats` là số liệu tích lũy toàn instance."},
{id:330,d:3,t:"Blocking",q:"You must confirm the isolation level actually in effect for your current session. What should you run?",
 o:["`DBCC USEROPTIONS`","`SELECT @@ISOLATION`","`DBCC SHOWOPTIONS`","`EXEC sp_configure 'isolation level'`"],a:0,
 e:"`DBCC USEROPTIONS` liệt kê các SET option của session hiện tại, gồm cả isolation level. Muốn xem session khác thì đọc `transaction_isolation_level` trong `sys.dm_exec_sessions`."},
{id:331,d:3,t:"Extended Events",q:"You must detect connections that open a transaction but never commit or roll it back. Which Extended Events target should you use?",
 o:["Pair matching","Histogram","Ring buffer","Event counter"],a:0,
 e:"Pair matching (asynchronous) ghép start event với end event và chỉ báo cáo những event **không có cặp** — đúng cho việc tìm giao dịch không kết thúc."},
{id:332,d:3,t:"Extended Events",q:"Which two Extended Events targets process data synchronously, and therefore add latency to the monitored workload?",
 o:["Event Tracing for Windows (ETW)","Event counter","Event file","Histogram","Ring buffer"],a:[0,1],
 e:"ETW và event counter xử lý **synchronous**. Event file, histogram, pair matching và ring buffer là asynchronous nên ít ảnh hưởng workload hơn."},
{id:333,d:3,t:"Extended Events",q:"Which Extended Events template is designed for finding slow-running queries?",
 o:["TSQL_Duration","TSQL_Locks","TSQL_Replay","Count Query Locks"],a:0,
 e:"TSQL_Duration bắt thời lượng câu lệnh — dùng tìm query chậm. TSQL_Locks dùng cho deadlock, TSQL_Replay cho benchmark/replay."},
{id:334,d:3,t:"DMV",q:"You must find the queries that have consumed the most CPU in total since the instance last restarted. Which DMV should you use?",
 o:["`sys.dm_exec_query_stats`, cross applied to `sys.dm_exec_sql_text`","`sys.dm_exec_requests`","`sys.dm_exec_connections`","`sys.dm_os_wait_stats`"],a:0,
 e:"`sys.dm_exec_query_stats` tổng hợp query **đã hoàn tất** (sắp xếp theo `total_worker_time`). `sys.dm_exec_requests` chỉ thấy query đang chạy, và cả hai đều mất dữ liệu khi plan bị đẩy khỏi cache."},
{id:335,d:3,t:"DMV",q:"A batch job has been running for 40 minutes and is consuming most of the CPU right now. Which DMV shows what it is currently waiting on?",
 o:["`sys.dm_exec_requests`","`sys.dm_exec_query_stats`","`sys.query_store_runtime_stats`","`sys.dm_db_resource_stats`"],a:0,
 e:"`sys.dm_exec_requests` cho request đang chạy kèm `wait_type`, `wait_time`, `cpu_time` và `blocking_session_id`. Query Store và `dm_exec_query_stats` chỉ có dữ liệu sau khi query kết thúc."},
{id:336,d:3,t:"DMV",q:"You must capture the actual execution plan of one specific slow query in production with minimal overhead. Which hint should you add?",
 o:["`OPTION (USE HINT ('QUERY_PLAN_PROFILE'))`","`OPTION (RECOMPILE)`","`OPTION (MAXDOP 1)`","`OPTION (KEEPFIXED PLAN)`"],a:0,
 e:"`QUERY_PLAN_PROFILE` bật lightweight profiling cho riêng câu đó và phát event `query_plan_profile` vào Extended Events — cách lấy actual plan mà không bật profiling toàn instance."},
{id:337,d:3,t:"DMV",q:"A monitoring login has VIEW SERVER STATE on a managed instance but its queries against `sys.dm_db_index_usage_stats` in one database return no rows. Why?",
 o:["Database-scoped DMVs require VIEW DATABASE STATE in that database; VIEW SERVER STATE is not sufficient","Index usage statistics are only visible to db_owner","The DMV is not supported on managed instances","VIEW SERVER STATE must be granted in master and the login must reconnect"],a:0,
 e:"DMV cấp database cần **VIEW DATABASE STATE** trên chính database đó; DMV cấp server cần VIEW SERVER STATE. Hai quyền không thay thế nhau."},
{id:338,d:3,t:"DMV",n:"s60-2",q:"A deployment script must behave differently on Azure SQL Managed Instance. What does `SERVERPROPERTY('EngineEdition')` return there?",
 o:["8","5","3","11"],a:0,
 e:"`EngineEdition`: 5 = Azure SQL Database, 8 = Azure SQL Managed Instance, nhỏ hơn 5 = SQL Server on-prem/VM (ví dụ 3 = Enterprise)."},
{id:339,d:3,t:"Wait stats",q:"The top waits on a data warehouse are CXPACKET together with SOS_SCHEDULER_YIELD. Which two actions are the most reasonable first steps?",
 o:["Review MAXDOP, which may be set too high for this workload","Look for missing or inadequate indexes causing large scans","Move tempdb to a faster disk","Increase the transaction log growth increment","Enable READ_COMMITTED_SNAPSHOT"],a:[0,1],
 e:"CXPACKET đi kèm SOS_SCHEDULER_YIELD thường là dấu hiệu MAXDOP quá cao và/hoặc thiếu index nên phải quét song song rất nhiều dữ liệu. Đây là vấn đề CPU/plan, không phải I/O của tempdb hay log."},
{id:340,d:3,t:"Wait stats",q:"Match the dominant wait type to the resource under pressure: PAGEIOLATCH_SH, PAGELATCH_UP and WRITE_LOG.",
 o:["Data file I/O, tempdb contention, transaction log I/O","tempdb contention, data file I/O, memory grants","Transaction log I/O, data file I/O, tempdb contention","Memory grants, data file I/O, network"],a:0,
 e:"`PAGEIOLATCH_*` = I/O của data file; `PAGELATCH_*` = tranh chấp trong bộ nhớ, kinh điển là allocation page của tempdb; `WRITE_LOG` = I/O của transaction log. `RESOURCE_SEMAPHORE` là chờ memory grant."},
{id:341,d:3,t:"Wait stats",q:"An application inserting into a database inside an elastic pool is throttled. Which wait type confirms that the pool's log rate limit is the cause?",
 o:["`POOL_LOG_RATE_GOVERNOR`","`LOG_RATE_GOVERNOR`","`INSTANCE_LOG_GOVERNOR`","`HADR_THROTTLE_LOG_RATE`"],a:0,
 e:"`LOG_RATE_GOVERNOR` = giới hạn của một Azure SQL Database; `POOL_LOG_RATE_GOVERNOR` = giới hạn của elastic pool; `INSTANCE_LOG_GOVERNOR` = MI; `HADR_THROTTLE_LOG_RATE` = Business Critical/geo-replication chờ replica."},
{id:342,d:3,t:"Index",q:"A search screen filters with `WHERE Description LIKE '%pump%'` and always scans the table. What should you tell the developers?",
 o:["A conventional index cannot help with a leading wildcard; a full-text index is the option to consider","A filtered index on Description will resolve it","Adding the column with INCLUDE will resolve it","Rebuilding the clustered index will resolve it"],a:0,
 e:"Wildcard ở đầu chuỗi khiến predicate không SARGable nên B-tree index vô dụng; chỉ full-text index (hoặc thiết kế tìm kiếm khác) giúp được."},
{id:343,d:3,t:"Index",q:"You are choosing the clustered index for a new table. Which two characteristics are desirable?",
 o:["Unique, or with many distinct values","Used to return ranges of rows accessed sequentially, such as an IDENTITY or date key","As many columns as possible, to cover more queries","A wide `nvarchar` column, so lookups can avoid key lookups","Frequently updated values, so the index stays warm"],a:[0,1],
 e:"Clustered key nên hẹp, unique/nhiều giá trị phân biệt, tăng dần và dùng cho truy vấn theo range — vì nó là khoá được nhân bản vào **mọi** nonclustered index. Key rộng hoặc hay đổi làm phình index và gây page split."},
{id:344,d:3,t:"Index",n:"s57-2",q:"An execution plan shows a Key Lookup that accounts for most of the query cost. What is the usual fix?",
 o:["Add the columns the query needs to the nonclustered index using INCLUDE","Drop the clustered index so lookups become RID lookups","Force a hash join with a query hint","Increase MAXDOP for the query"],a:0,
 e:"Key/RID Lookup nghĩa là index không cover query. Thêm cột bằng `INCLUDE` để dữ liệu nằm ở leaf level mà không làm phình key. INCLUDE cũng được tính trong uniqueness test của unique index."},
{id:345,d:3,t:"Index",n:"s57-2",q:"Which predicate is SARGable and can therefore seek on an index on `OrderDate`?",
 o:["`WHERE OrderDate >= '2024-01-01' AND OrderDate < '2025-01-01'`","`WHERE YEAR(OrderDate) = 2024`","`WHERE CONVERT(varchar(7), OrderDate, 126) = '2024-01'`","`WHERE ISNULL(OrderDate, '1900-01-01') > '2024-01-01'`"],a:0,
 e:"Bọc cột trong hàm (`YEAR`, `CONVERT`, `ISNULL`) làm mất khả năng seek. Viết lại thành range predicate; tương tự dùng `LIKE 'ABC%'` thay `LEFT(col,3) = 'ABC'` và `(col IS NULL OR col = 'Y')` thay `ISNULL(col,'Y') = 'Y'`."},
{id:346,d:3,t:"Index",n:"s55",q:"`sys.dm_db_missing_index_details` suggests an index with equality columns `CustomerId`, inequality columns `OrderDate`, and included columns `Total`. How should you write the CREATE INDEX statement?",
 o:["Key columns `(CustomerId, OrderDate)` in that order, with `INCLUDE (Total)`","Key columns `(OrderDate, CustomerId)`, with `INCLUDE (Total)`","Key columns `(CustomerId, OrderDate, Total)` with no INCLUDE","Key columns `(Total)` with `INCLUDE (CustomerId, OrderDate)`"],a:0,
 e:"Đặt equality column trước, rồi inequality column, cả hai là key; included column đi vào `INCLUDE`. Luôn đối chiếu với index đang có để không tạo index trùng lặp."},
{id:347,d:3,t:"Index",q:"A table used by a heavy nightly load has 14 nonclustered indexes. What is the main cost of this?",
 o:["Every INSERT, UPDATE, DELETE and MERGE must maintain all of the indexes","SELECT statements become slower because the optimizer has more options","Statistics can no longer be updated automatically","The clustered index must be rebuilt after every load"],a:0,
 e:"Index tăng tốc đọc nhưng mọi thao tác ghi phải cập nhật tất cả index liên quan, làm chậm load và tăng log. Xem `sys.dm_db_index_usage_stats` để tìm index không được dùng."},
{id:348,d:3,t:"Index",q:"Only 2% of rows in a large `Orders` table have `Status = 'Open'`, and every hot query filters on exactly that value. Which index type is most efficient?",
 o:["A filtered index with `WHERE Status = 'Open'`","A clustered columnstore index","A unique index on Status","A full-text index on Status"],a:0,
 e:"Filtered index chỉ index phần dữ liệu quan tâm nên nhỏ, rẻ để duy trì và thống kê chính xác hơn. FillFactor là chuyện khác — dùng khi cần chừa chỗ cho tăng trưởng để giảm page split."},
{id:349,d:3,t:"Hints",q:"A stored procedure gets a good plan but is recompiled constantly because statistics on a large logging table change every minute. Which hint prevents recompilation caused by statistics changes?",
 o:["`OPTION (KEEPFIXED PLAN)`","`OPTION (KEEP PLAN)`","`OPTION (RECOMPILE)`","`OPTION (OPTIMIZE FOR UNKNOWN)`"],a:0,
 e:"`KEEPFIXED PLAN` chỉ recompile khi schema đổi hoặc `sp_recompile` được gọi — statistics đổi thì không. `KEEP PLAN` chỉ **giảm** ngưỡng recompile, không loại bỏ."},
{id:350,d:3,t:"Hints",q:"A procedure performs well for most parameter values but terribly whenever it is first compiled with an atypical value. You need a stable plan based on average selectivity. Which hint should you use?",
 o:["`OPTION (OPTIMIZE FOR UNKNOWN)`","`OPTION (RECOMPILE)` on every statement","`OPTION (MAXDOP 1)`","`OPTION (ROBUST PLAN)`"],a:0,
 e:"`OPTIMIZE FOR UNKNOWN` bỏ qua giá trị tham số lúc compile và dùng average selectivity — đúng cho parameter sniffing. `RECOMPILE` cũng chữa được nhưng trả giá CPU compile mỗi lần chạy."},
{id:351,d:3,t:"Hints",q:"Which join hint cannot be combined with a RIGHT or FULL OUTER JOIN?",
 o:["LOOP","HASH","MERGE","REMOTE"],a:0,
 e:"`LOOP` không dùng được với RIGHT hoặc FULL join. Ba join hint chính là LOOP, HASH, MERGE — viết dạng `INNER LOOP JOIN`, `LEFT HASH JOIN`…"},
{id:352,d:3,t:"Hints",q:"A developer wants to add query hints across the codebase to 'lock plans in'. What is Microsoft's guidance?",
 o:["Use hints only as a last resort, because the Query Optimizer usually produces the best plan and a hint freezes today's assumptions","Use hints on every query containing a join","Use hints instead of creating indexes","Hints are required whenever the compatibility level changes"],a:0,
 e:"Hint là phương án cuối cùng: nó chặn optimizer thích ứng khi dữ liệu, statistics hay version thay đổi. Với Azure SQL còn có Query Store hints để áp hint mà không sửa code."},
{id:353,d:3,t:"Execution plan",q:"When is a Nested Loops join the most appropriate physical join?",
 o:["The outer input is small and the inner input is large but indexed on the join column","Both inputs are large, unsorted and have no useful index","Both inputs are already sorted on the join column","The inputs are intermediate results of the same size"],a:0,
 e:"Nested Loops tốt khi outer input nhỏ và inner input có index trên join column (ít I/O, ít so sánh). Merge join cần cả hai đã sort; hash join phù hợp input lớn, chưa sort, không index."},
{id:354,d:3,t:"Execution plan",q:"An execution plan shows an Adaptive Join. What does that tell you?",
 o:["The engine decides between a hash join and a nested loops join at runtime, after scanning the first input","The optimizer chose the join type from statistics at compile time","Both join algorithms run in parallel and the fastest result is used","The plan will be recompiled on every execution"],a:0,
 e:"Batch mode adaptive join (SQL Server 2017+) so số dòng thực tế của build input với một ngưỡng rồi mới chọn hash hoặc nested loops — cơ chế chống ước lượng cardinality sai."},
{id:355,d:3,t:"Execution plan",q:"Which two statements about reading a graphical execution plan are true?",
 o:["Execution flows from right to left","The thickness of an arrow reflects the number of rows flowing between operators","Execution flows from left to right","Arrow thickness reflects CPU cost","The percentage on each operator is measured, not estimated"],a:[0,1],
 e:"Plan đọc từ phải sang trái, độ dày mũi tên thể hiện **số dòng**. Phần trăm chi phí trên operator là **ước lượng** của optimizer — chênh lệch lớn giữa estimated và actual rows chính là điểm cần điều tra."},
{id:356,d:3,t:"Execution plan",q:"You must inspect the plan of an expensive DELETE statement without executing it. Which options do this?",
 o:["`SET SHOWPLAN_ALL ON` or `SET SHOWPLAN_TEXT ON`, and Display Estimated Execution Plan in SSMS","`SET STATISTICS IO ON` and Include Actual Execution Plan","`SET STATISTICS TIME ON`","`SET NOCOUNT ON` with Include Live Query Statistics"],a:0,
 e:"`SHOWPLAN_ALL`/`SHOWPLAN_TEXT`/`SHOWPLAN_XML` và 'Display Estimated Execution Plan' chỉ compile chứ **không chạy** câu lệnh. 'Include Actual Execution Plan' thì có chạy."},
{id:357,d:3,t:"Execution plan",q:"A plan for a paged report contains a Sort operator that spills to disk and dominates the cost. Which two actions address the root cause?",
 o:["Verify whether the sort is required at all — for example an unnecessary ORDER BY or DISTINCT","Create an index that already stores the rows in the required order","Add `OPTION (HASH JOIN)`","Increase MAXDOP so the sort runs in parallel","Rewrite the query with a cursor to avoid sorting"],a:[0,1],
 e:"Sort rất tốn CPU và memory, spill xuống tempdb khi memory grant không đủ. Cách xử lý: bỏ sort không cần thiết, hoặc tạo index đã sort theo đúng thứ tự cần. Cursor luôn là bước đi sai hướng."},
{id:358,d:3,t:"Execution plan",q:"You inherit a stored procedure that loops through 400,000 rows with a cursor. What should you do?",
 o:["Rewrite it as a set-based operation","Add an index that supports the cursor's SELECT","Convert it to a FAST_FORWARD cursor and increase memory","Wrap it in an explicit transaction to reduce logging"],a:0,
 e:"Cursor xử lý từng dòng, phát sinh round-trip và log lớn. Viết lại theo set-based (một `UPDATE ... FROM`, `MERGE`, hay window function) hầu như luôn nhanh hơn nhiều bậc."},
{id:359,d:3,t:"Intelligent Insights",q:"Intelligent Insights reports a performance degradation. Which baseline does it compare against?",
 o:["The last hour of workload against the previous seven days","The last 24 hours against the previous 30 days","The current week against the previous month","Real time against a baseline you configure manually"],a:0,
 e:"Intelligent Insights so sánh workload **1 giờ gần nhất với 7 ngày trước**, dùng dữ liệu Query Store, và trả về root cause analysis ở dạng dễ đọc."},
{id:360,d:3,t:"Intelligent Insights",q:"You must keep Intelligent Insights output for a year and query it with KQL. Which destination should you configure?",
 o:["A Log Analytics workspace","Azure Event Hubs, in Avro format","Azure Storage, in Extended Events format","The master database of the logical server"],a:0,
 e:"Ba đích của diagnostic setting: Log Analytics workspace (phổ biến nhất, truy vấn bằng KQL), Event Hubs (Avro — cho hệ thống ngoài), và Azure Storage (định dạng Extended Events, cho lưu trữ dài hạn giá rẻ)."},
{id:361,d:3,t:"Statistics",q:"In which two situations should you update statistics manually rather than relying on the automatic threshold?",
 o:["Immediately after a large bulk insert","On tables with an ascending key such as an IDENTITY or timestamp, where recent values fall outside the histogram","After every index rebuild or reorganize","After every full backup","Every hour, on a schedule, for all tables"],a:[0,1],
 e:"Bulk load và ascending key là hai trường hợp kinh điển statistics bị lệch. Lưu ý **rebuild index đã cập nhật statistics** với FULLSCAN, còn REORGANIZE thì không — nên chạy update statistics sau reorganize, không cần sau rebuild."},
{id:362,d:3,t:"Statistics",q:"`UPDATE STATISTICS dbo.Orders WITH FULLSCAN` is equivalent to which option?",
 o:["`SAMPLE 100 PERCENT`","`SAMPLE 50 PERCENT`","`RESAMPLE`","`PERSIST_SAMPLE_PERCENT = ON`"],a:0,
 e:"`FULLSCAN` quét toàn bộ dòng, tương đương `SAMPLE 100 PERCENT`. `RESAMPLE` dùng lại tỉ lệ mẫu của lần cập nhật trước."},
{id:363,d:3,t:"Statistics",q:"You update statistics on a large table with `SAMPLE 40 PERCENT` and want automatic updates to keep using that rate. What should you add?",
 o:["`PERSIST_SAMPLE_PERCENT = ON`","`NORECOMPUTE`","`INCREMENTAL = ON`","`AUTO_UPDATE_STATISTICS_ASYNC ON` at database level"],a:0,
 e:"`PERSIST_SAMPLE_PERCENT = ON` khiến tỉ lệ mẫu hiện tại thành mặc định cho các lần cập nhật sau. `NORECOMPUTE` thì ngược lại — tắt auto update cho statistics đó."},
{id:364,d:3,t:"Statistics",q:"Which stored procedure updates statistics for all user-defined and internal tables in the current database?",
 o:["`sp_updatestats`","`sp_update_statistics`","`sp_recompile`","`sp_refreshsqlmodule`"],a:0,
 e:"`sp_updatestats` chạy `UPDATE STATISTICS` cho mọi bảng (user-defined và internal) — tiện nhưng chỉ dùng `RESAMPLE`, nên với bảng lớn hãy nhắm mục tiêu cụ thể."},
{id:365,d:3,t:"DBCC",q:"Which three checks does `DBCC CHECKDB` perform internally?",
 o:["`DBCC CHECKALLOC`","`DBCC CHECKTABLE` on every table and indexed view","`DBCC CHECKCATALOG`","`DBCC CHECKCONSTRAINTS`","`DBCC CHECKIDENT`"],a:[0,1,2],
 e:"CHECKDB chạy CHECKALLOC (cấu trúc cấp phát), CHECKTABLE cho mọi bảng/indexed view, và CHECKCATALOG. Nó **không** kiểm tra referential integrity — muốn thế thì chạy thêm `DBCC CHECKCONSTRAINTS`."},
{id:366,d:3,t:"DBCC",n:"s60-4",q:"`DBCC CHECKDB` reports consistency errors and states that the minimum repair level is REPAIR_ALLOW_DATA_LOSS. Which two statements should drive your response?",
 o:["Restoring from the last known good backup is the preferred option, because the repair can lose data","If no usable backup exists, the database must be set to EMERGENCY and then SINGLE_USER before the repair can run","REPAIR_FAST should be tried first, because it fixes these errors without data loss","REPAIR_REBUILD fixes every error type without data loss, so it is always the safer repair","The repair can be run while the database remains in MULTI_USER mode"],a:[0,1],
 e:"Restore luôn là lựa chọn đầu tiên. `REPAIR_ALLOW_DATA_LOSS` cần EMERGENCY + SINGLE_USER và có thể mất dữ liệu; `REPAIR_REBUILD` chỉ sửa những gì không gây mất dữ liệu; `REPAIR_FAST` không làm gì (chỉ còn để tương thích ngược)."},
{id:367,d:3,t:"DBCC",n:"s60-4",q:"You must know how much tempdb space a `DBCC CHECKDB` on a 5 TB database will need, without running the checks. Which option should you use?",
 o:["`WITH ESTIMATEONLY`","`WITH PHYSICAL_ONLY`","`WITH NO_INFOMSGS`","`WITH TABLOCK`"],a:0,
 e:"`ESTIMATEONLY` không kiểm tra gì, chỉ báo dung lượng tempdb cần. `PHYSICAL_ONLY` giới hạn kiểm tra ở page structure/record header (nhanh hơn nhiều); `TABLOCK` lấy lock để chạy nhanh hơn nhưng giảm concurrency."},
{id:368,d:3,t:"DBCC",q:"Which pair of statements uses the correct quoting?",
 o:["`DBCC CHECKDB (Sales);` and `DBCC CHECKTABLE ('dbo.Orders');`","`DBCC CHECKDB ('Sales');` and `DBCC CHECKTABLE (dbo.Orders);`","Both require single quotes","Neither accepts a name in parentheses"],a:0,
 e:"`DBCC CHECKDB (DatabaseName)` và `DBCC CHECKCATALOG (DatabaseName)` không dùng nháy, còn `DBCC CHECKTABLE ('Schema.Table')` nhận một chuỗi. `DBCC CHECKDB(0)` nghĩa là database hiện tại."},
{id:369,d:3,t:"Auto-tuning",q:"Which conditions cause FORCE_LAST_GOOD_PLAN to act?",
 o:["A plan regression is detected and the estimated gain exceeds 10 seconds of CPU time, or the new plan produces more errors","Any recompilation of a query in the plan cache","CPU utilisation exceeding 80% for five minutes","A scheduled evaluation every 24 hours"],a:0,
 e:"FORCE_LAST_GOOD_PLAN (bật mặc định trên Azure SQL Database và MI) ép lại plan tốt trước đó khi phát hiện regression với estimated gain > 10 giây, hoặc khi plan mới sinh nhiều lỗi hơn — và tự huỷ nếu không cải thiện."},
{id:370,d:3,t:"Auto-tuning",q:"Which automatic tuning options are available on Azure SQL Database but not on Azure SQL Managed Instance?",
 o:["CREATE INDEX and DROP INDEX","FORCE_LAST_GOOD_PLAN","Query Store","Automatic patching"],a:0,
 e:"Tự tạo/tự xoá index chỉ có ở Azure SQL Database. MI chỉ có FORCE_LAST_GOOD_PLAN."},
{id:371,d:3,t:"Auto-tuning",q:"Automatic index creation is enabled but no index has been created despite recommendations. Which resource condition must be met?",
 o:["CPU, data I/O and log I/O must all be below 80%","CPU must be below 50%","The database must be completely idle","There is no such condition; creation is immediate"],a:0,
 e:"Index chỉ được tự tạo khi CPU, data I/O và log I/O đều **dưới 80%** để không làm tệ thêm tình hình. Xem index tự tạo bằng `SELECT * FROM sys.indexes WHERE auto_created = 1`; nếu không cải thiện, nó sẽ bị tự drop."},
{id:372,d:3,t:"Auto-tuning",q:"Which view lists tuning recommendations, and which statement configures automatic tuning for a database?",
 o:["`sys.dm_db_tuning_recommendations`, and `ALTER DATABASE ... SET AUTOMATIC_TUNING = AUTO | INHERIT | CUSTOM`","`sys.dm_db_missing_index_details`, and `sp_configure 'automatic tuning', 1`","`sys.database_query_store_options`, and `ALTER DATABASE ... SET QUERY_STORE = ON`","`sys.dm_db_index_usage_stats`, and `ALTER INDEX ... SET (AUTO_TUNE = ON)`"],a:0,
 e:"`sys.dm_db_tuning_recommendations` chứa khuyến nghị kèm script; cấu hình bằng `ALTER DATABASE ... SET AUTOMATIC_TUNING = AUTO | INHERIT | CUSTOM` (hoặc từng option với `FORCE_LAST_GOOD_PLAN = ON`)."},
{id:373,d:3,t:"Resource Governor",q:"You must cap the CPU an ad-hoc reporting workload can use. On which deployments can you configure Resource Governor?",
 o:["SQL Server on VM and Azure SQL Managed Instance — it exists in Azure SQL Database but is not configurable","Azure SQL Database only","All three deployment options","SQL Server on VM only"],a:0,
 e:"Resource Governor cấu hình được trên SQL Server VM và MI. Azure SQL Database dùng Resource Governor nội bộ để thực thi giới hạn của tier, nhưng bạn **không** cấu hình được."},
{id:374,d:3,t:"Resource Governor",q:"Which two resource pools exist immediately after SQL Server is installed?",
 o:["internal","default","system","user","admin"],a:[0,1],
 e:"Hai pool sẵn có là `internal` (request của hệ thống, không giới hạn được) và `default` (mọi session khi chưa có classifier function)."},
{id:375,d:3,t:"Resource Governor",q:"What is the difference between MAX_CPU_PERCENT and CAP_CPU_PERCENT in a resource pool?",
 o:["MAX_CPU_PERCENT is a maximum average that only applies under CPU contention, while CAP_CPU_PERCENT is a hard ceiling","CAP_CPU_PERCENT is the average and MAX_CPU_PERCENT is the hard ceiling","They are synonyms kept for backward compatibility","CAP_CPU_PERCENT applies to memory grants only"],a:0,
 e:"`MAX_CPU_PERCENT` chỉ có hiệu lực khi tổng nhu cầu vượt 100% — lúc rảnh workload vẫn dùng vượt mức. `CAP_CPU_PERCENT` là hard limit, không bao giờ vượt."},
{id:376,d:3,t:"Resource Governor",q:"You create a resource pool, a workload group and a classifier function. Queries still land in the default group. What did you forget?",
 o:["`ALTER RESOURCE GOVERNOR RECONFIGURE;` — and the classifier must be registered with `ALTER RESOURCE GOVERNOR WITH (CLASSIFIER_FUNCTION = ...)`","`EXEC sp_configure 'resource governor', 1;`","`DBCC FREEPROCCACHE;`","A restart of the SQL Server service"],a:0,
 e:"Mọi thay đổi Resource Governor chỉ có hiệu lực sau `ALTER RESOURCE GOVERNOR RECONFIGURE`, và classifier function phải được đăng ký bằng `ALTER RESOURCE GOVERNOR WITH (CLASSIFIER_FUNCTION = dbo.fn_Classifier)`. Classification chỉ diễn ra khi **kết nối mới** được tạo."},
{id:377,d:3,t:"Scoped config",q:"What is the default MAXDOP for a newly created Azure SQL Database, and why does it matter?",
 o:["8 — a high MAXDOP can starve new queries of workers on a busy database","0 — meaning unlimited, which is the recommended production value","1 — parallelism must be enabled explicitly","4 — matching the number of schedulers"],a:0,
 e:"Azure SQL Database mới có MAXDOP = 8, phù hợp phần lớn workload. Đặt 0 (không giới hạn) trên database nhiều concurrency dễ khiến một query chiếm hết worker."},
{id:378,d:3,t:"Scoped config",q:"A server's plan cache is full of single-use plans from ad-hoc queries. Which database-scoped configuration reduces the memory wasted?",
 o:["`OPTIMIZE_FOR_AD_HOC_WORKLOADS` — the first compilation stores only a small plan stub","`LAST_QUERY_PLAN_STATS` — plans are stored in a DMV instead of the cache","`PARAMETER_SNIFFING = OFF` — plans become reusable","`LEGACY_CARDINALITY_ESTIMATION = ON` — plans become smaller"],a:0,
 e:"`OPTIMIZE_FOR_AD_HOC_WORKLOADS` chỉ lưu plan stub ở lần compile đầu; đến lần thứ hai mới lưu full plan — tiết kiệm đáng kể plan cache cho workload ad-hoc."},
{id:379,d:3,t:"Scoped config",q:"You want the last actual execution plan for a query to be available in `sys.dm_exec_query_plan_stats`. Which configuration enables it?",
 o:["`LAST_QUERY_PLAN_STATS`","`QUERY_OPTIMIZER_HOTFIXES`","`LIGHTWEIGHT_QUERY_PROFILING`","`ACCELERATED_PLAN_FORCING`"],a:0,
 e:"`LAST_QUERY_PLAN_STATS` bật/tắt việc lưu actual execution plan gần nhất để đọc qua `sys.dm_exec_query_plan_stats` — rất tiện khi không kịp bắt plan lúc sự cố xảy ra."},
{id:380,d:3,t:"Scoped config",q:"You run `ALTER DATABASE SCOPED CONFIGURATION FOR SECONDARY SET MAXDOP = 4`. Who does this affect?",
 o:["All geo-replicated secondary databases, which share the same secondary configuration","Only the first secondary created","Availability group replicas on VMs","Databases in the same elastic pool"],a:0,
 e:"Mệnh đề `FOR SECONDARY` áp cho các geo-replicated secondary, và **tất cả** secondary dùng chung cấu hình đó (mặc định là kế thừa primary)."},
{id:381,d:3,t:"DB options",q:"A database on an Azure VM has AUTO_SHRINK enabled and suffers from severe index fragmentation. Which two statements should you include in your explanation?",
 o:["AUTO_SHRINK triggers whenever more than 25% of the file is free space","Shrinking moves pages around, which is itself a major cause of index fragmentation, so the option should be left OFF","AUTO_SHRINK only triggers when the file is more than 50% free, so it is rarely a problem","AUTO_SHRINK is required in order to reclaim space after archiving data","Combining AUTO_SHRINK with a nightly index rebuild prevents the fragmentation"],a:[0,1],
 e:"AUTO_SHRINK shrink khi hơn 25% file là free space; shrink di chuyển page nên tạo fragmentation nặng, rồi file lại phải autogrow — vòng lặp phá hiệu năng. Khuyến nghị: **OFF**."},
{id:382,d:3,t:"DB options",q:"A data warehouse performs nightly bulk loads and must keep point-in-time recovery for normal transactions while minimising log generated by the bulk operations. Which recovery model should you use during the load?",
 o:["BULK_LOGGED","FULL","SIMPLE","There is no such model; use FULL and increase the log size"],a:0,
 e:"BULK_LOGGED minimally log các bulk operation lớn nhưng vẫn cho backup log. Đánh đổi: trong khoảng có bulk operation, không thể restore đến một điểm thời gian cụ thể — nên chuyển FULL lại ngay sau load và backup log."},
{id:383,d:3,t:"DB options",q:"You set a database to RESTRICTED_USER before a maintenance task. Who can still connect?",
 o:["Members of db_owner, dbcreator and sysadmin — any number of them","Exactly one user at a time","Every user who already holds CONNECT permission","Only members of sysadmin"],a:0,
 e:"SINGLE_USER: đúng một connection. RESTRICTED_USER: chỉ db_owner, dbcreator, sysadmin (không giới hạn số lượng). MULTI_USER: mọi user có quyền."},
{id:384,d:3,t:"DB options",q:"An application requires compatibility level 90 (SQL Server 2005) behaviour after migrating to Azure SQL Managed Instance. What is possible?",
 o:["The lowest supported level is 100, so level 90 cannot be set — the application must be tested at 100 or above","Level 90 can be set with `ALTER DATABASE ... SET COMPATIBILITY_LEVEL = 90`","Level 90 is only available on Azure SQL Database","Compatibility level cannot be changed on a managed instance"],a:0,
 e:"Trên SQL Server 2014+ , MI và Azure SQL Database, compatibility level thấp nhất là **100** (SQL Server 2008). Level 150 tương ứng SQL Server 2019, 160 là 2022."},
{id:385,d:3,t:"Autogrowth",q:"A filegroup has four equally sized data files and the proportional fill algorithm keeps becoming unbalanced after autogrowth. Which option keeps them the same size?",
 o:["`ALTER DATABASE ... MODIFY FILEGROUP FG1 AUTOGROW_ALL_FILES`","`ALTER DATABASE ... MODIFY FILEGROUP FG1 AUTOGROW_SINGLE_FILE`","`ALTER DATABASE ... SET AUTO_SHRINK ON`","`ALTER DATABASE ... MODIFY FILE (SIZE = ...)` on each file weekly"],a:0,
 e:"`AUTOGROW_ALL_FILES`: khi một file trong filegroup chạm ngưỡng autogrow thì **mọi** file trong filegroup cùng tăng, giữ kích thước đồng đều để proportional fill hoạt động tốt. Mặc định là `AUTOGROW_SINGLE_FILE`."},
{id:386,d:3,t:"Free space",q:"In `sys.database_files`, one row shows `max_size = -1`. What does that mean?",
 o:["The file can grow until the disk or the service tier limit is reached","The file is corrupt","The file is read-only","The file has no data pages allocated"],a:0,
 e:"`max_size = -1` là unlimited (với log file, `-1` nghĩa là tới 2 TB). Dùng `sp_spaceused` để xem đã dùng bao nhiêu và còn unallocated bao nhiêu."},
{id:387,d:3,t:"Free space",q:"You must check how full the transaction log of every database is, right now. Which command gives exactly that?",
 o:["`DBCC SQLPERF(LOGSPACE)`","`EXEC sp_spaceused`","`SELECT * FROM sys.dm_db_task_space_usage`","`DBCC SHOWFILESTATS`"],a:0,
 e:"`DBCC SQLPERF(LOGSPACE)` trả về log size và phần trăm đã dùng cho từng database. Với tempdb thì dùng `sys.dm_db_session_space_usage` và `sys.dm_db_task_space_usage`."},
{id:388,d:3,t:"IQP",q:"A dashboard needs an approximate distinct count over billions of rows and must respond quickly. What guarantee does `APPROX_COUNT_DISTINCT` provide?",
 o:["An error rate within 2%, with 97% probability","An error rate within 5%, with 95% probability","An error rate within 1%, with 99% probability","No guarantee at all"],a:0,
 e:"`APPROX_COUNT_DISTINCT` bảo đảm sai số tối đa 2% với xác suất 97%, dùng ít memory hơn `COUNT(DISTINCT)` rất nhiều. Cách 'tắt' duy nhất là không dùng hàm đó."},
{id:389,d:3,t:"IQP",q:"Scalar UDF inlining changes the plan of a critical procedure for the worse. You must disable it for that one function only. What should you do?",
 o:["Create or alter the function `WITH INLINE = OFF`","Set the database compatibility level to 140","Add `OPTION (RECOMPILE)` to every caller","Disable `TSQL_SCALAR_UDF_INLINING` for the whole database"],a:0,
 e:"Scalar UDF inlining bật mặc định trên Azure và SQL Server 2019+ với compatibility level 150+. Tắt cho một function bằng `WITH INLINE = OFF` (đặt trước `AS BEGIN`) — chính xác hơn là hạ compatibility level hay tắt cả database."},
{id:390,d:3,t:"IQP",q:"How does batch mode memory grant feedback adjust a query's memory grant between executions?",
 o:["It grants more memory if the query spilled to disk, and less if more than 50% of the grant was unused","It always doubles the grant after a spill","It fixes the grant from statistics at compile time","It only ever increases the grant, never decreases it"],a:0,
 e:"Memory grant feedback tăng grant khi query spill, và giảm khi lãng phí hơn 50% grant. Lưu ý feedback bị reset khi plan bị đẩy khỏi cache (trước SQL Server 2022, nơi feedback được persist trong Query Store)."},
{id:391,d:3,t:"IQP",q:"Interleaved execution and deferred compilation both fix bad cardinality guesses. Which guess does each replace?",
 o:["Interleaved execution replaces the fixed guess of 100 rows for multi-statement table-valued functions; deferred compilation replaces the guess of 1 row for table variables","Interleaved execution replaces 1 row for table variables; deferred compilation replaces 100 rows for temp tables","Both replace a fixed guess of 1000 rows for CTEs","Interleaved execution applies to scalar UDFs and deferred compilation to views"],a:0,
 e:"`INTERLEAVED_EXECUTION_TVF` dùng cardinality thực tế của multi-statement TVF (thay cho ước lượng cố định 100 dòng từ SQL Server 2014) — câu lệnh phải read-only. `DEFERRED_COMPILATION_TV` làm điều tương tự cho table variable (thay ước lượng 1 dòng)."},
{id:392,d:3,t:"IQP",q:"Which view tells you which database-scoped configurations differ from their defaults?",
 o:["`sys.database_scoped_configurations`","`sys.configurations`","`sys.databases`","`sys.dm_os_sys_info`"],a:0,
 e:"`sys.database_scoped_configurations` cho cấu hình cấp database (`is_value_default` cho biết đã đổi hay chưa). `sys.configurations` là cấp server, đổi bằng `sp_configure` — không dùng được trên Azure SQL Database."},
{id:393,d:3,t:"Index maintenance",q:"On a SQL Server VM you must analyse a captured workload and receive index, statistics and partitioning recommendations. Which tool should you use?",
 o:["Database Engine Tuning Advisor, fed with a Query Store workload or a `.sql` trace file","Automatic tuning in the Azure portal","Query Performance Insight","Azure Advisor"],a:0,
 e:"Database Engine Tuning Advisor (Tools – Database Engine Tuning Advisor trong SSMS) nhận workload từ Query Store, trace file hoặc file `.sql` rồi phân tích. Automatic tuning và Query Performance Insight là tính năng của Azure SQL Database, không có trên VM."},
{id:394,d:3,t:"Index maintenance",n:"s-130",q:"An index has 8% fragmentation and 40 GB of data. Which two statements should shape your maintenance choice?",
 o:["REORGANIZE is the appropriate action below roughly 30% fragmentation, and it is always an online operation that can be stopped without losing the work done","REORGANIZE does not update statistics, so schedule a statistics update as well — unlike REBUILD, which updates them with FULLSCAN","REBUILD is required, because reorganize does not reduce fragmentation at all","Dropping and recreating the index is the only supported option at this size","No maintenance is possible below 30% fragmentation"],a:[0,1],
 e:"Hướng dẫn thông dụng: 5–30% thì REORGANIZE (luôn online, có thể dừng giữa chừng và giữ phần đã làm), trên 30% thì REBUILD. Nhớ rằng REBUILD cập nhật statistics còn REORGANIZE thì không."},
/* ---------- 4. Configure and manage automation of tasks (15–20%) ---------- */
{id:401,d:4,t:"SQL Agent",q:"You are moving scheduled maintenance jobs from SQL Server to Azure SQL Managed Instance, and some jobs will later have to run against Azure SQL databases. Which two statements are true?",
 o:["On a managed instance SQL Server Agent is always running and cannot be stopped or enabled by you","Azure SQL Database has no SQL Server Agent, so those jobs need Elastic Jobs instead","On a managed instance the Agent must be started manually after every restart","SQL Server Agent on a managed instance supports 100% of the on-premises functionality","Azure SQL Database exposes SQL Server Agent through the master database"],a:[0,1],
 e:"Trên MI, SQL Agent luôn chạy và không thể tắt/khởi động lại; nó có gần hết chức năng nhưng thiếu một số (ví dụ một số subsystem và event notification). Azure SQL Database **không có** SQL Agent — dùng Elastic Jobs."},
{id:402,d:4,t:"SQL Agent",q:"A job on a managed instance must run as soon as the SQL Server Agent service starts. What is the outcome?",
 o:["The schedule type 'Start automatically when SQL Server Agent starts' is not supported on a managed instance","It works, but only for jobs owned by sysadmin","It works only if the job has a single step","The job must first be attached to a maintenance plan"],a:0,
 e:"MI không hỗ trợ schedule 'Start automatically when SQL Server Agent starts'. One time, recurring và 'when the CPUs become idle' đều dùng được."},
{id:403,d:4,t:"SQL Agent",q:"In `sp_add_schedule`, you set `@freq_type = 8`. What have you configured?",
 o:["A weekly schedule","A daily schedule","A monthly schedule based on the day of the month","A one-time schedule"],a:0,
 e:"`@freq_type`: 1 = once, 4 = daily, 8 = weekly, 16 = monthly theo ngày trong tháng, 32 = monthly relative (ví dụ Chủ nhật thứ hai), 64 = khi SQL Agent khởi động, 128 = khi máy rảnh."},
{id:404,d:4,t:"SQL Agent",q:"Which value of `@freq_type` schedules a job to run whenever the computer is idle?",
 o:["128","64","32","16"],a:0,
 e:"`@freq_type = 128` là 'when the computer is idle'; `64` là 'when SQL Server Agent starts' — và riêng giá trị 64 thì **không** hỗ trợ trên Azure SQL Managed Instance."},
{id:405,d:4,t:"SQL Agent",q:"A script calls `sp_add_job`, `sp_add_jobstep`, `sp_add_schedule` and `sp_add_jobserver`, and the job appears in SSMS but never starts on its own. Which procedure is missing from the script?",
 o:["`sp_attach_schedule`, to bind the schedule to the job","`sp_add_jobserver`, to assign the job to the instance","`sp_update_job`, to enable the job","`sp_start_job`, which must be called once before a schedule takes effect"],a:0,
 e:"Tạo schedule chưa đủ — phải gắn nó vào job bằng `sp_attach_schedule @job_name, @schedule_name`. Trong đề bài `sp_add_jobserver` đã được gọi (bước bắt buộc để job được giao cho instance chạy), và `sp_start_job` chỉ chạy job ngay lập tức chứ không liên quan tới lịch."},
{id:406,d:4,t:"SQL Agent",q:"You must check whether last night's jobs ran and how long they took, from SSMS. Where do you look?",
 o:["SQL Server Agent – Job Activity Monitor","Management – Extended Events – system_health","Reports – Standard Reports – Configuration Changes History","Object Explorer – Databases – msdb – Tables"],a:0,
 e:"Job Activity Monitor cho trạng thái, lần chạy cuối và thời lượng. Cần chi tiết hơn thì query `msdb.dbo.sysjobhistory` và `msdb.dbo.sysschedules`."},
{id:407,d:4,t:"SQL Agent",q:"Before saving a T-SQL job step you must validate the syntax. Which button does this?",
 o:["Parse","Validate","Compile","Test"],a:0,
 e:"Nút **Parse** kiểm tra cú pháp của lệnh T-SQL trong tab Steps. Mỗi step còn phải chọn database và (tùy chọn) 'Run as' user."},
{id:408,d:4,t:"Notifications",q:"You are scripting alert notifications with `sp_add_notification`. Which two statements about `@notification_method` are true?",
 o:["A value of 1 means email","The values 2 (pager) and 4 (net send) are deprecated","A value of 1 means pager, and 2 means email","A value of 4 writes the notification to the Windows Application event log","Net send is the only method supported on a managed instance"],a:[0,1],
 e:"`@notification_method`: 1 = email, 2 = pager, 4 = net send. Pager và net send đã deprecated, nên thực tế chỉ dùng email (qua Database Mail)."},
{id:409,d:4,t:"Notifications",q:"A job has five steps and the team wants an email only if step 3 fails. What must you tell them?",
 o:["Job notifications apply to the whole job, not to individual steps — step-level handling must be scripted inside the step or via its failure action","Each step can be given its own notification on the Notifications tab","Notifications can be per step only when the job is owned by sysadmin","Step-level notifications require Database Mail on the target database"],a:0,
 e:"Notification cấu hình cho **cả job** (khi fail, succeed hoặc complete). Muốn phản ứng theo từng step thì dùng 'On failure action' của step hoặc tự gửi mail bằng `sp_send_dbmail` trong chính step đó."},
{id:410,d:4,t:"Notifications",q:"Besides email and pager, which two notification options does a SQL Server Agent job offer?",
 o:["Write to the Windows Application event log","Automatically delete job","Post to a webhook","Send an SMS through an action group","Write a row to Query Store"],a:[0,1],
 e:"Tab Notifications của job có: Email, Page, 'Write to the Windows Application event log' và 'Automatically delete job' — mỗi cái kích hoạt khi job fails, succeeds hoặc completes."},
{id:411,d:4,t:"Notifications",q:"In `sp_add_operator`, what does `@enabled = 1` mean?",
 o:["The operator is enabled and can receive notifications","The operator receives email rather than pager messages","The operator is granted SQLAgentOperatorRole","The operator's schedule is active"],a:0,
 e:"`@enabled`: 1 = enabled, 0 = không. Các tham số chính khác là `@name` và `@email_address`; tham số pager vẫn tồn tại nhưng đã deprecated."},
{id:412,d:4,t:"Database Mail",q:"SQL Agent jobs on an Azure SQL Managed Instance must send email. What must the Database Mail profile be called?",
 o:["`AzureManagedInstance_dbmail_profile`","`DefaultProfile`","`SQLAgentMailProfile`","Any name, as long as it is marked as the default public profile"],a:0,
 e:"Trên MI, để SQL Agent job gửi được mail thì profile phải có tên chính xác `AzureManagedInstance_dbmail_profile`. Database Mail đã được bật sẵn trên MI."},
{id:413,d:4,t:"Database Mail",q:"After creating a Database Mail profile, a user gets 'profile name is not valid' when calling `sp_send_dbmail` without a profile parameter. Which two things must you fix?",
 o:["Add the user to the DatabaseMailUserRole role in msdb","Mark the profile as the default public profile for msdb","Add the user to db_datawriter in msdb","Grant the user SQLAgentOperatorRole","Re-enable Database Mail with `sp_configure 'Database Mail XPs', 1`"],a:[0,1],
 e:"Người gửi phải nằm trong `DatabaseMailUserRole` của msdb, và profile cần được đặt 'Default Profile = Yes' trong Manage Profile Security (nếu không thì phải chỉ định `@profile_name`)."},
{id:414,d:4,t:"ARM/Bicep",q:"Your team wants infrastructure as code with a more concise syntax than JSON, while remaining fully supported by Azure Resource Manager. What is Bicep?",
 o:["A domain-specific language with declarative syntax that transpiles to ARM templates","A scripting language that replaces PowerShell for imperative deployments","A CI/CD service in Azure DevOps","A compression format for large ARM templates"],a:0,
 e:"Bicep là DSL declarative, mở rộng ngôn ngữ ARM template — file `.bicep` được transpile thành JSON ARM template khi deploy."},
{id:415,d:4,t:"ARM/Bicep",q:"You inherit a 3,000-line ARM template in JSON and want to maintain it in Bicep. Which command converts it?",
 o:["`az bicep decompile --file azuredeploy.json`","`az bicep build --file azuredeploy.json`","`az bicep convert --to bicep azuredeploy.json`","`az deployment group create --template-file azuredeploy.json --bicep`"],a:0,
 e:"`az bicep decompile` chuyển ARM JSON → Bicep (kết quả cần rà lại thủ công). Chiều ngược lại là `az bicep build`."},
{id:416,d:4,t:"ARM/Bicep",q:"Which resource types must an ARM template declare to deploy SQL Server on an Azure VM with full manageability?",
 o:["`Microsoft.Compute/virtualMachines` and `Microsoft.SqlVirtualMachine/sqlVirtualMachines`","`Microsoft.Sql/servers` and `Microsoft.Sql/servers/databases`","`Microsoft.Sql/managedInstances` and `Microsoft.Network/virtualNetworks`","`Microsoft.SqlVirtualMachine/instances` only"],a:0,
 e:"VM cần `Microsoft.Compute/virtualMachines` cộng `Microsoft.SqlVirtualMachine/sqlVirtualMachines` (đăng ký SQL IaaS Agent extension). `Microsoft.Sql/servers` + `/databases` là Azure SQL Database, `Microsoft.Sql/managedInstances` là MI."},
{id:417,d:4,t:"PowerShell",q:"Which cmdlet creates a new Azure SQL Managed Instance?",
 o:["`New-AzSqlInstance`","`New-AzSqlServer`","`New-AzSqlDatabase`","`New-AzSqlInstanceDatabase`"],a:0,
 e:"`New-AzSqlInstance` tạo MI; `New-AzSqlInstanceDatabase` tạo database trong MI. `New-AzSqlServer` tạo logical server, `New-AzSqlDatabase` tạo database trên logical server đó."},
{id:418,d:4,t:"Azure CLI",q:"Order the Azure CLI commands needed to create a new Azure SQL Database from nothing.",
 o:["`az group create` → `az sql server create` → `az sql db create`","`az sql db create` → `az sql server create` → `az group create`","`az group create` → `az sql db create` → `az sql server create`","`az sql server create` → `az group create` → `az sql db create`"],a:0,
 e:"Resource group trước, rồi logical server, rồi database. Với MI dùng `az sql mi create`, với VM là `az vm create` cộng `az sql vm create`."},
{id:419,d:4,t:"Deployment",q:"A release pipeline in Azure DevOps must deploy schema changes to Azure SQL Database, with drift detection against the target. Which artifact should the pipeline publish and deploy?",
 o:["A DACPAC, referenced from `azure-pipelines.yml`","A BACPAC, so data is deployed with the schema","A BAK file restored by the pipeline","An MDF file copied to Azure Blob Storage"],a:0,
 e:"DACPAC (schema-only, data-tier application) là artifact chuẩn cho pipeline: SqlPackage so sánh với target rồi sinh script thay đổi. BACPAC gồm cả data nên dùng để copy/archive, không phải triển khai thay đổi."},
{id:420,d:4,t:"Elastic Jobs",q:"You must run a nightly index maintenance script against 200 Azure SQL databases spread over four logical servers. Which service should you use, and what is it equivalent to?",
 o:["An Elastic Job agent — the equivalent of SQL Server Agent for Azure SQL Database, which has no SQL Agent","SQL Server Agent on the logical server","Automation of the job by a managed instance's SQL Agent, targeting the databases remotely","Azure Data Factory, because Azure SQL Database has no job scheduler"],a:0,
 e:"Elastic Jobs là tương đương SQL Agent cho Azure SQL Database, chạy được trên nhiều database/server/subscription. (Job agent miễn phí, nhưng job database bị tính phí như một Azure SQL Database.)"},
{id:421,d:4,t:"Elastic Jobs",q:"Which service tier does the Elastic Jobs job database require?",
 o:["Standard S0 or higher, with S1 or above recommended for frequent jobs","Basic","Premium P1 or higher","Any tier, including Basic and Free"],a:0,
 e:"Job database phải là Standard S0+ (hoặc Premium); khuyến nghị S1 trở lên khi job chạy thường xuyên hoặc target group lớn."},
{id:422,d:4,t:"Elastic Jobs",q:"Why must an Elastic Job step script be idempotent?",
 o:["Because a step may be retried and run more than once against the same target","Because scripts run inside an implicit transaction that may roll back","Because the script cannot exceed 8,000 characters","Because target databases are read-only until the job completes"],a:0,
 e:"Elastic Jobs có thể chạy lại một step trên cùng target (retry, hoặc target được thêm vào giữa lượt chạy). Script phải chạy hai lần vẫn cho cùng kết quả — ví dụ kiểm tra tồn tại trước khi tạo object."},
{id:423,d:4,t:"Elastic Jobs",q:"Where and for how long is Elastic Jobs execution history kept?",
 o:["45 days, in `jobs.job_executions` in the job database","30 days, in `msdb.dbo.sysjobhistory`","90 days, in a Log Analytics workspace","7 days, in Azure Storage"],a:0,
 e:"History lưu 45 ngày trong `jobs.job_executions`. Output của từng step có thể ghi vào một bảng do bạn chỉ định để giữ lâu hơn."},
{id:424,d:4,t:"Elastic Jobs",q:"Which procedures define an Elastic Jobs target that excludes one database from an entire server?",
 o:["`jobs.sp_add_target_group`, then `jobs.sp_add_target_group_member` twice — once with the server and once with `@membership_type = 'Exclude'` for that database","`jobs.sp_add_job` with a database filter","`jobs.sp_add_jobstep` with a WHERE clause","`jobs.sp_update_job` with `@exclude_database`"],a:0,
 e:"Tạo target group bằng `sp_add_target_group`, thêm thành viên bằng `sp_add_target_group_member` (`@target_type` = 'SqlDatabase' | 'SqlServer' | 'SqlElasticPool' | 'SqlShardMap'), và dùng `@membership_type = 'Exclude'` để loại trừ."},
{id:425,d:4,t:"Elastic Jobs",q:"Your target group includes a whole logical server. What extra input does the job agent need, and why?",
 o:["A credential for the master database of that server, so the databases can be enumerated at run time","A managed identity for the job agent, so the server can be scaled","A firewall rule for each database","A read-only replica of the server"],a:0,
 e:"Khi target là server hoặc elastic pool, mọi database tồn tại **tại thời điểm chạy** đều bị tác động, nên agent cần credential của master để enumerate — chỉ định qua `@refresh_credential_name`."},
{id:426,d:4,t:"Elastic Jobs",q:"Which role must the job's user hold in each target database?",
 o:["db_owner","db_datareader","db_ddladmin","dbmanager"],a:0,
 e:"Trong mỗi target database: `CREATE USER JobU FROM LOGIN JobU` rồi `ALTER ROLE db_owner ADD MEMBER JobU`. Trong master của các server đích thì tạo login (MasterU/JobU) tương ứng."},
{id:427,d:4,t:"Elastic Jobs",q:"Which command starts an Elastic Job immediately, outside its schedule?",
 o:["`EXEC jobs.sp_start_job 'Nightly index maintenance';`","`EXEC msdb.dbo.sp_start_job 'Nightly index maintenance';`","`EXEC jobs.sp_run_job 'Nightly index maintenance';`","`EXEC jobs.sp_update_job @enabled = 1;`"],a:0,
 e:"`jobs.sp_start_job` chạy ngay. Lịch đặt bằng `jobs.sp_update_job` với `@schedule_interval_type` ('Minutes', 'Hours', 'Days', 'Weeks', 'Months', 'Once') và `@schedule_interval_count`."},
{id:428,d:4,t:"Elastic Jobs",q:"Can Elastic Jobs targets live in different subscriptions and regions?",
