<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --muted:#646b74; --line:#e2e5ea;
  --accent:#0b6bcb; --accent-soft:#e7f0fb;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --card:#1c2025; --fg:#e6e8ea; --muted:#98a0aa; --line:#2c323a;
    --accent:#5aa9ff; --accent-soft:#16283d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:var(--bg); color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.box{max-width:420px;text-align:center}
.code{font-size:56px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1}
h1{font-size:19px;margin:10px 0 6px}
p{color:var(--muted);font-size:14.5px;margin:0 0 22px}
.links{display:grid;gap:10px}
.links a{display:flex;align-items:center;justify-content:center;min-height:48px;
  padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--fg);text-decoration:none;font-size:15px}
.links a:hover{border-color:var(--accent);background:var(--accent-soft)}
.links a.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Không tìm thấy trang này</h1>
  <p>Đường dẫn bạn mở không tồn tại hoặc đã đổi.</p>
  <div class="links">
    <a class="main" href="/">← Về trang chủ</a>
    <a href="/AI-200/practice.html">AI-200 · Luyện thi</a>
    <a href="/DP-300/practice.html">DP-300 · Luyện thi</a>
  </div>
</div>
</body>
</html>
